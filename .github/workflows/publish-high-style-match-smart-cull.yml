name: Publish High Style Match Smart Cull

on:
  push:
    branches:
      - high-style-match-smart-cull
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Smart Cull branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify Smart Cull app
        run: |
          cat publish/smart-cull-parts/*.b64 | base64 --decode | gunzip > /tmp/high-style-match-smart-cull.html
          echo "948a3237de28218f1835df9935ddcdf7aab7e3ae5e9f071d62a94f04a2fe0346  /tmp/high-style-match-smart-cull.html" | sha256sum -c -
          test "$(wc -c < /tmp/high-style-match-smart-cull.html | tr -d ' ')" = "87400"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/high-style-match-smart-cull.html').read_text()
          assert '<title>High Style Match</title>' in html
          assert 'function renderCullTab' in html
          assert 'function runSmartCull' in html
          assert 'Exact duplicates' in html
          assert 'Smart Cull' in html
          assert 'Auto Match will prioritise your picks' in html
          m = re.search(r'<script>(.*)</script>', html, re.S)
          assert m, 'script block missing'
          Path('/tmp/hsm-smart-cull.js').write_text(m.group(1))
          PY
          node --check /tmp/hsm-smart-cull.js

      - name: Publish only High Style Match to main
        run: |
          git fetch origin main
          git switch -C main origin/main
          mkdir -p high-style-match
          cp /tmp/high-style-match-smart-cull.html high-style-match/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html
          if git diff --cached --quiet; then
            echo "High Style Match is already current."
          else
            git commit -m "Add Smart Cull to High Style Match"
            git push origin main
          fi
