name: Apply High Style Match Purple

on:
  push:
    branches: [main]
    paths:
      - 'publish/apply-hsm-purple.py'
      - '.github/workflows/apply-hsm-purple.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply purple theme directly to live HTML
        run: python3 publish/apply-hsm-purple.py

      - name: Publish purple theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add high-style-match/index.html high-style-match/tether/index.html high-style-match/sign-in/index.html high-style-match/customer/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply High Style Match black purple white theme directly'
          git push origin HEAD:main
