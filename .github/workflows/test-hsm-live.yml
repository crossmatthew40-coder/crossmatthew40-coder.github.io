name: Test High Style Match Live

on:
  push:
    paths:
      - 'tests/hsm-live-smoke.mjs'
      - '.github/workflows/test-hsm-live.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live High Style Match smoke tests
        run: node tests/hsm-live-smoke.mjs
