name: Publish High Style Match Web

on:
  push:
    branches:
      - high-style-match-web-publish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and validate web app
        run: |
          cat publish/webparts/*.b64 | base64 --decode > /tmp/high-style-match-index.html
          echo "e8f8192c6e3e4fcba4d190456ac6a20e960e3c7ef4e878bd7708cf1dce00019f  /tmp/high-style-match-index.html" | sha256sum -c -
          test "$(wc -c < /tmp/high-style-match-index.html | tr -d ' ')" = "17716"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/high-style-match-index.html').read_text()
          assert html.startswith('<!doctype html>')
          assert '<title>High Style Match</title>' in html
          match = re.search(r'<script>(.*)</script>', html, re.S)
          assert match, 'script block missing'
          Path('/tmp/high-style-match-app.js').write_text(match.group(1))
          PY
          node --check /tmp/high-style-match-app.js

      - name: Publish only High Style Match to main
        run: |
          git fetch origin main
          git switch -C main origin/main
          mkdir -p high-style-match
          cp /tmp/high-style-match-index.html high-style-match/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html
          if git diff --cached --quiet; then
            echo "High Style Match is already current."
          else
            git commit -m "Publish verified High Style Match web app"
            git push origin main
          fi
