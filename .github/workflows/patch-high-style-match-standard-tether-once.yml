name: Patch High Style Match Standard Tether Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-high-style-match-standard-tether-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch High Style Match
        shell: bash
        run: |
          cat > /tmp/patch_hsm.py <<'PY'
          from pathlib import Path
          import re

          main = Path('high-style-match/index.html')
          tether = Path('high-style-match/tether/index.html')
          text = main.read_text()

          text = text.replace("APP_VERSION='0.5.0'", "APP_VERSION='0.6.0'")
          text = text.replace("const LIVE_SHOOT_ADDON={id:'live-shoot-pro',name:'Live Shoot Pro',priceLabel:'Paid add-on'};", "const LIVE_SHOOT_ADDON={id:'tether-mode',name:'Tether Mode',priceLabel:'Standard feature'};")
          text = text.replace("function liveShootEntitled(){return D.settings.liveShootProActive===true||liveShootPreviewMode()}", "function liveShootEntitled(){return true}")
          text = text.replace('Live Shoot Pro', 'Tether Mode')
          text = text.replace('Paid add-on', 'Standard feature')
          text = text.replace('Optional premium feature', 'Standard feature')
          text = text.replace('Optional add-on', 'Included feature')
          text = text.replace('Upgrade Tether Mode', 'Open Tether Mode')
          text = text.replace('Upgrade to Tether Mode', 'Tether Mode')

          overview_fn = '''function appendLiveShootOverview(s){const W=document.getElementById('workspaceBody');if(!W)return;const card=document.createElement('div');card.className='live-pro-card';card.innerHTML=`<div><div class="live-pro-kicker">Included with High Style Match</div><h3>Tether Mode <span class="live-pro-tag active" style="margin-left:7px">Standard</span></h3><p>Connect Match to the same Capture folder used by Capture One. New photographs can appear in Tether Mode as you shoot and stay tied to the requirement marked Now Shooting.</p></div><button class="btn primary" id="overviewTetherMode">${icon('arrow')}Open Tether Mode</button>`;W.appendChild(card);document.getElementById('overviewTetherMode').onclick=()=>{tab='live';renderWorkspace()}}'''
          text, n1 = re.subn(r"function appendLiveShootOverview\(s\)\{.*?\}\nfunction appendLiveShootSettings", overview_fn + "\nfunction appendLiveShootSettings", text, flags=re.S)

          settings_fn = '''function appendLiveShootSettings(){const grid=document.querySelector('.settings-grid');if(!grid)return;const card=document.createElement('div');card.className='setting-card live-settings-card';card.innerHTML=`<h2>Tether Mode <span class="live-pro-tag active">Standard</span></h2><p>Tether Mode is included with High Style Match. Use Capture One as normal, then let Match watch the same Capture folder so incoming photographs can be logged against the live shot list.</p><button class="btn primary" id="settingsTetherMode">${icon('arrow')}Open Tether Mode</button>`;grid.insertBefore(card,grid.firstChild);document.getElementById('settingsTetherMode').onclick=()=>{location.href='./tether/'}}'''
          text, n2 = re.subn(r"function appendLiveShootSettings\(\)\{.*?\}\nfunction renderLiveShootTab", settings_fn + "\nfunction renderLiveShootTab", text, flags=re.S)

          render_fn = '''function renderLiveShootTab(W,s,c){if(!s.shots.length){W.innerHTML=`<div class="empty"><div class="empty-icon">${icon('upload')}</div><h3>Add the shot list first</h3><p>Tether Mode works best when Match knows the client brief, so add the shot-list requirements before starting the tethered session.</p><button class="btn primary" id="liveGoShotList">${icon('upload')}Open Shot List</button></div>`;document.getElementById('liveGoShotList').onclick=()=>{tab='shotlist';renderWorkspace()};return}const supported=typeof window.showDirectoryPicker==='function';W.innerHTML=`<div class="live-launch"><div class="live-launch-main"><div><span class="live-pro-tag active">Standard feature</span><h2>Tether Capture One into High Style Match.</h2><p>Open Tether Mode, choose the same Capture folder that Capture One is writing to, select the requirement you are shooting and start watching. New files are detected as they arrive — no manual capture logger.</p></div><div class="actions"><button class="btn primary" id="openTetherMode">${icon('spark')}Open Tether Mode</button><button class="btn secondary" id="openShotListFromTether">${icon('eye')}Check Shot List</button></div></div><div class="live-launch-side"><div class="live-launch-stat"><label>Shot-list requirements</label><b>${s.shots.filter(x=>!x.skip).length}</b></div><div class="live-launch-stat"><label>Folder watching</label><b style="font-size:16px">${supported?'Available':'Browser limited'}</b></div><div class="live-launch-stat"><label>Access</label><b style="font-size:16px">Included</b></div></div></div><div class="notice info section">${icon('info')}Capture One still controls the camera and RAW capture. High Style Match watches the Capture folder. Chrome or Edge can grant continuous folder access; Safari can open the mode but has tighter folder-watching restrictions.</div>`;document.getElementById('openTetherMode').onclick=()=>{location.href='./tether/'};document.getElementById('openShotListFromTether').onclick=()=>{tab='shotlist';renderWorkspace()}}'''
          text, n3 = re.subn(r"function renderLiveShootTab\(W,s,c\)\{.*?\}\n\nfunction renderHistoryTab", render_fn + "\n\nfunction renderHistoryTab", text, flags=re.S)

          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f'Function patch failed: {n1}, {n2}, {n3}')

          text = text.replace('<button class="btn secondary small" id="undoTop"', '<button class="btn secondary small" id="backShoots">← Shoots</button><button class="btn secondary small" id="undoTop"', 1)
          text = text.replace("document.getElementById('deleteShoot').onclick=()=>confirmDeleteShoot(s);", "document.getElementById('backShoots').onclick=()=>navigate('shoots');document.getElementById('deleteShoot').onclick=()=>confirmDeleteShoot(s);", 1)

          smooth_css = '''
/* High Style Match 0.6 — smoother movement and standard Tether Mode */
html{scroll-behavior:smooth}
.tabs{position:sticky;top:68px;z-index:14;background:rgba(245,244,247,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;padding-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;transition:background .16s ease,color .16s ease,border-color .16s ease,transform .16s ease}
.tabs button:hover{color:var(--ink);background:#f0ecff;border-radius:10px 10px 0 0}
.tabs button:active{transform:scale(.98)}
#workspaceBody{animation:hsmPageIn .18s ease both;scroll-margin-top:132px}
.btn,.icon-btn,.shoot-row,.workflow-step{transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
.btn:active,.icon-btn:active{transform:scale(.98)}
@keyframes hsmPageIn{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:760px){.tabs{margin-left:-2px;margin-right:-2px}.tabs button{padding:11px 12px}.content{padding-left:18px;padding-right:18px}}
'''
          text = text.replace('</style>', smooth_css + '\n</style>', 1)
          main.write_text(text)

          t = tether.read_text()
          t = t.replace('Tether Mode · public beta', 'Tether Mode · standard feature')
          t = t.replace('Tether Mode · Public Beta', 'Tether Mode · Standard Feature')
          t = t.replace('Available to everyone', 'Standard feature')
          t = t.replace('html,body{margin:0;', 'html,body{margin:0;scroll-behavior:smooth;', 1)
          tether_css = '''
.btn,.q,.card{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
.btn:active{transform:scale(.98)}
.q:hover{border-color:#cfc5ff;background:#fbf9ff}
'''
          t = t.replace('</style>', tether_css + '\n</style>', 1)
          tether.write_text(t)
          PY
          python3 /tmp/patch_hsm.py

      - name: Validate JavaScript
        shell: bash
        run: |
          grep -q "APP_VERSION='0.6.0'" high-style-match/index.html
          grep -q "Open Tether Mode" high-style-match/index.html
          grep -q "Standard feature" high-style-match/tether/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          for src, out in [('high-style-match/index.html','/tmp/main.js'),('high-style-match/tether/index.html','/tmp/tether.js')]:
              html=Path(src).read_text()
              scripts=[]
              for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S|re.I):
                  head=m.group(0).split('>')[0].lower()
                  if 'src=' not in head:
                      scripts.append(m.group(1))
              Path(out).write_text('\n'.join(scripts))
          PY
          node --check /tmp/main.js
          node --check /tmp/tether.js

      - name: Commit release and remove one-time patcher
        shell: bash
        run: |
          rm -f .github/workflows/patch-high-style-match-standard-tether-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html high-style-match/tether/index.html .github/workflows/patch-high-style-match-standard-tether-once.yml
          git commit -m "Make Tether Mode standard and smooth navigation"
          git push origin HEAD:main
