name: Inspect High Style Match Tethered Source

on:
  push:
    branches:
      - high-style-match-tethered-build
    paths:
      - '.github/workflows/inspect-high-style-match-tethered.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: |
          cat build/source-parts/*.b64 | python3 -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > /tmp/high-style-match-source.tar.xz
          tar -xJf /tmp/high-style-match-source.tar.xz
      - name: Print tether helper source
        run: |
          for f in high-style-match/src-tauri/src/thumbnails.rs high-style-match/src-tauri/src/lib.rs high-style-match/src/services/desktop.ts; do
            echo "=== $f ==="
            sed -n '1,260p' "$f"
          done
