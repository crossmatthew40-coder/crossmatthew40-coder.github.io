name: Fix High Style Match Navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hsm-navigation.yml'
      - 'publish/fix-hsm-navigation.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair navigation
        run: python3 publish/fix-hsm-navigation.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('high-style-match/index.html').read_text()
          scripts=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              head=m.group(0).split('>')[0].lower()
              if 'src=' not in head:
                  scripts.append(m.group(1))
          Path('/tmp/hsm.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/hsm.js
      - name: Check navigation markers
        run: |
          grep -q "function wireWorkspaceTabs" high-style-match/index.html
          grep -q "data-nav" high-style-match/index.html
          grep -q "\['live','Tether'\]" high-style-match/index.html
          grep -q "APP_VERSION='0.9.2'" high-style-match/index.html
      - name: Publish fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add high-style-match/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix High Style Match navigation and project tabs'
          git push origin HEAD:main
