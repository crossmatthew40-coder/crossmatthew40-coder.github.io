name: Theme High Style Match Black Purple Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theme-high-style-match-black-purple-once.yml'

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply black and purple theme
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('high-style-match/index.html')
          tether = Path('high-style-match/tether/index.html')

          main_css = r'''
/* High Style Match Black + Purple Theme */
:root{
  color-scheme:dark;
  --accent:#9a72ff;--accent-2:#7c4dff;--ink:#f7f4ff;--muted:#aaa3b8;--muted-2:#81798e;
  --bg:#07070a;--surface:#101015;--surface-2:#15141b;--line:#2b2535;--dark:#050506;--dark-2:#0b0a0f;
  --success:#63d7a2;--success-bg:#10231c;--warn:#d7a955;--warn-bg:#2a2112;--danger:#ff8181;--danger-bg:#2b1417;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 18px 55px rgba(0,0,0,.32);
}
html,body,.main{background:#07070a!important;color:var(--ink)!important}
.sidebar{background:linear-gradient(180deg,#050506 0%,#0c0911 100%)!important;border-right:1px solid #201a28}
.brandmark{background:linear-gradient(145deg,#9a72ff,#6330e8)!important;box-shadow:0 12px 32px rgba(124,77,255,.34)!important}
.topbar{background:rgba(7,7,10,.9)!important;border-bottom-color:#231d2c!important;color:var(--ink)!important}
.crumb,.hero-copy,.workspace-head p,.panel-head p,.shot-note,.meta,.muted,.field-hint{color:var(--muted)!important}
.content{background:transparent!important}
.panel,.stat,.mini-stat,.workflow-step,.shoot-row,.workspace-head,.review-block,.setting-card,.template-row,.provider-card,.delivery-summary>div,.activity-item,.delivery-event,.live-pro-card,.live-launch,.live-current,.live-next-card,.live-queue-panel,.empty,.upload-zone,.preview-strip,.table-row,.format-badges span,.photo-card,.rename-card,.history-card{background:#101015!important;border-color:#2b2535!important;color:var(--ink)!important;box-shadow:var(--shadow)}
.workspace-head{background:linear-gradient(135deg,#111017 0%,#171221 100%)!important}
.callout{background:linear-gradient(135deg,#0b0910,#171020)!important;border:1px solid #2d2340!important}
.callout:after{background:radial-gradient(circle,rgba(154,114,255,.32),transparent 67%)!important}
.tabs{background:rgba(7,7,10,.96)!important;border-bottom-color:#2b2535!important}
.tabs button{color:#928b9e!important}
.tabs button.on{color:#fff!important;border-bottom-color:#9a72ff!important}
.tabs button:hover{background:#171220!important;color:#fff!important}
.btn.primary{background:linear-gradient(135deg,#9a72ff,#6c38e8)!important;box-shadow:0 10px 26px rgba(124,77,255,.24)!important}
.btn.secondary,.icon-btn{background:#121018!important;border-color:#342941!important;color:#e9e3f5!important}
.btn.secondary:hover,.icon-btn:hover{background:#1b1525!important;border-color:#5e4287!important}
.btn.ghost{color:#aaa3b8!important}
.field input,.field textarea,.field select,.select,input,textarea,select{background:#0d0c11!important;border-color:#342d3d!important;color:#f7f4ff!important}
.field input:focus,.field textarea:focus,.field select:focus,.select:focus,input:focus,textarea:focus,select:focus{border-color:#9a72ff!important;box-shadow:0 0 0 4px rgba(154,114,255,.13)!important}
input::placeholder,textarea::placeholder{color:#6f687a!important}
.upload-zone{background:linear-gradient(180deg,#100d16,#0c0b10)!important}
.preview-strip{background:#15111c!important}
.empty{background:#0d0c11!important;border-color:#342d3d!important}
.pill{background:#1c1822!important;color:#bbb3c7!important}
.pill.purple,.live-pro-tag{background:#211833!important;color:#c7b3ff!important}
.pill.success,.live-pro-tag.active{background:#10231c!important;color:#63d7a2!important}
.pill.warn{background:#2a2112!important;color:#d7a955!important}
.notice.info{background:#171125!important;color:#c7b3ff!important;border-color:#3a2855!important}
.notice.success{background:#10231c!important;color:#79e0b0!important;border-color:#244a3b!important}
.notice.warn{background:#2a2112!important;color:#e2b86c!important;border-color:#58451e!important}
.wp{background:#17151c!important;color:#8f8999!important}
.wp.done{background:#10231c!important;color:#63d7a2!important}
.wp.active{background:#211833!important;color:#c7b3ff!important}
.progress,.live-meter{background:#211c29!important}
.progress i,.live-meter i{background:linear-gradient(90deg,#9a72ff,#6c38e8)!important}
.table-row.header{background:#0b0a0e!important;color:#8f879a!important}
.match-dot{background:#4b4352!important}.match-dot.yes{background:#63d7a2!important}
.modal{background:#101015!important;border:1px solid #342941!important;color:#f7f4ff!important}
.modalback{background:rgba(0,0,0,.78)!important}
.live-paywall{background:linear-gradient(135deg,#0e0b14,#1a1126)!important;border-color:#342941!important;color:#fff!important}
.live-feature,.live-launch-stat,.live-check-stat{background:#15111c!important;border-color:#342941!important;color:#f7f4ff!important}
.live-top{background:linear-gradient(135deg,#0c0910,#1a1225)!important;border-color:#342941!important}
.live-queue-row{background:#0f0d14!important;border-color:#2b2535!important;color:#f7f4ff!important}
.live-queue-row.current{background:#1b1328!important;border-color:#7655b7!important}
.provider-logo{background:#8f63ff!important;color:#fff!important}
a{color:#bd9fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#09090c}::-webkit-scrollbar-thumb{background:#33283f;border-radius:999px}::-webkit-scrollbar-thumb:hover{background:#513b6d}
'''

          tether_css = r'''
/* Tether Mode Black + Purple Theme */
:root{color-scheme:dark;--p:#9a72ff;--p2:#7c4dff;--ink:#f7f4ff;--muted:#aaa3b8;--bg:#07070a;--card:#101015;--line:#2b2535;--dark:#050506;--good:#63d7a2;--warn:#d7a955;--bad:#ff8181;--shadow:0 18px 55px rgba(0,0,0,.35)}
html,body{background:#07070a!important;color:#f7f4ff!important}
.top{background:rgba(5,5,6,.96)!important;border-bottom-color:#241d2d!important}
.mark{background:linear-gradient(145deg,#9a72ff,#6330e8)!important}
.card,.stat,.current,.queuecard{background:#101015!important;border-color:#2b2535!important;color:#f7f4ff!important}
.hero p,.variant,.q small,.vstat label,.counts span,.conn small,.modal p{color:#aaa3b8!important}
.connect{background:linear-gradient(135deg,#09080c,#181020)!important;border:1px solid #2d2340!important}
.btn.primary{background:linear-gradient(135deg,#9a72ff,#6c38e8)!important}
.btn.dark,.btn.light,.btn.soft{background:#121018!important;color:#eee8f7!important;border:1px solid #342941!important}
.btn.dark:hover,.btn.light:hover,.btn.soft:hover{background:#1b1525!important;border-color:#5e4287!important}
.viewer-head,.vstat{background:#101015!important;border-color:#2b2535!important}
.viewer-stage{background:radial-gradient(circle at 50% 38%,#21192c,#100d16 48%,#07070a 100%)!important}
.brief,.note{background:#181125!important;color:#c7b3ff!important;border-color:#3a2855!important}
.counts div{background:#0d0c11!important;border-color:#342d3d!important}
.q{background:#0f0d14!important;border-color:#2b2535!important;color:#f7f4ff!important}
.q.on{background:#1b1328!important;border-color:#7655b7!important;box-shadow:0 0 0 3px rgba(154,114,255,.09)!important}
.q:hover{background:#17111f!important;border-color:#5e4287!important}
.count,.state{background:#1c1822!important;color:#bbb3c7!important}
.state.good,.badge.public{background:#10231c!important;color:#63d7a2!important}
.state.warn{background:#2a2112!important;color:#d7a955!important}
.badge{background:#211833!important;color:#c7b3ff!important}
.modal{background:#101015!important;border:1px solid #342941!important;color:#f7f4ff!important}
.modalback{background:rgba(0,0,0,.8)!important}
.rawtile{background:linear-gradient(145deg,#1d1726,#0d0c11)!important;border-color:#392b4b!important}
input,select{background:#0d0c11!important;border:1px solid #342d3d!important;color:#f7f4ff!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#09090c}::-webkit-scrollbar-thumb{background:#33283f;border-radius:999px}
'''

          mt = main.read_text()
          if 'High Style Match Black + Purple Theme' not in mt:
              mt = mt.replace('</style>', main_css + '\n</style>', 1)
          main.write_text(mt)

          tt = tether.read_text()
          if 'Tether Mode Black + Purple Theme' not in tt:
              tt = tt.replace('</style>', tether_css + '\n</style>', 1)
          tether.write_text(tt)
          PY

      - name: Validate theme release
        run: |
          grep -q 'High Style Match Black + Purple Theme' high-style-match/index.html
          grep -q 'Tether Mode Black + Purple Theme' high-style-match/tether/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          for src,out in [('high-style-match/index.html','/tmp/main.js'),('high-style-match/tether/index.html','/tmp/tether.js')]:
              html=Path(src).read_text()
              scripts=[]
              for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
                  if 'src=' not in m.group(0).split('>')[0].lower(): scripts.append(m.group(1))
              Path(out).write_text('\n'.join(scripts))
          PY
          node --check /tmp/main.js
          node --check /tmp/tether.js

      - name: Commit black and purple theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html high-style-match/tether/index.html
          git commit -m "Theme High Style Match black and purple"
          git push origin HEAD:main
