name: Theme High Style Match Black Purple Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theme-high-style-match-black-purple-once.yml'

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply black and purple theme
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('high-style-match/index.html'); t=p.read_text(); css=base64.b64decode('').decode(); p.write_text(t if 'High Style Match Black + Purple Theme' in t else t.replace('</style>',css+'</style>',1))"
          python3 -c "from pathlib import Path; import base64; p=Path('high-style-match/tether/index.html'); t=p.read_text(); css=base64.b64decode('').decode(); p.write_text(t if 'Tether Mode Black + Purple Theme' in t else t.replace('</style>',css+'</style>',1))"

      - name: Validate theme release
        run: |
          grep -q 'High Style Match Black + Purple Theme' high-style-match/index.html
          grep -q 'Tether Mode Black + Purple Theme' high-style-match/tether/index.html

      - name: Commit black and purple theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html high-style-match/tether/index.html
          git commit -m "Theme High Style Match black and purple"
          git push origin HEAD:main
