name: Add High Style Match Delivery Icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hsm-delivery-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply delivery icon patch
        run: python3 publish/add-hsm-delivery-icons.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('high-style-match/index.html').read_text()
          scripts=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              head=m.group(0).split('>')[0].lower()
              if 'src=' not in head:
                  scripts.append(m.group(1))
          Path('/tmp/hsm.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/hsm.js
      - name: Publish delivery icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add high-style-match/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add icons to High Style Match delivery process'
          git push origin HEAD:main
