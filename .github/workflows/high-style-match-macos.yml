name: Build High Style Match macOS

on:
  push:
    branches:
      - high-style-match-macos-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: High Style Match — macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct High Style Match source
        run: |
          cat build/source-parts/*.b64 | python3 -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > /tmp/high-style-match-source.tar.xz
          tar -xJf /tmp/high-style-match-source.tar.xz
          test -f high-style-match/package.json
          test -f high-style-match/src-tauri/Cargo.toml

      - name: Correct RAW preview regression fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('high-style-match/src-tauri/src/thumbnails.rs')
          text = p.read_text()
          old = '        let image = DynamicImage::new_rgb8(320, 180);'
          new = '''        let image = DynamicImage::ImageRgb8(image::RgbImage::from_fn(320, 180, |x, y| {
            image::Rgb([
                ((x * 13 + y * 7) % 256) as u8,
                ((x * 5 + y * 17) % 256) as u8,
                ((x * 19 + y * 3) % 256) as u8,
            ])
        }));'''
          if old not in text:
              raise SystemExit('RAW preview test fixture pattern was not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: high-style-match/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: high-style-match
        run: npm install --no-audit --no-fund

      - name: Generate native app icons
        working-directory: high-style-match
        run: |
          cat > src/assets/high-style-app-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
            <rect width="300" height="300" rx="62" fill="#0b0b0d"/>
            <g fill="#ffffff" transform="translate(0 90)">
              <path d="M34 84 72 36h54L88 84H34Z"/>
              <path d="M105 84 143 36h54l-38 48h-54Z"/>
              <path d="M176 84 214 36h54l-38 48h-54Z"/>
            </g>
          </svg>
          SVG
          npm run tauri -- icon src/assets/high-style-app-icon.svg

      - name: Run TypeScript core tests
        working-directory: high-style-match
        run: npm run test:core

      - name: Run Rust tests
        working-directory: high-style-match
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build High Style Match DMG
        working-directory: high-style-match
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles dmg

      - name: Show built bundles
        if: always()
        run: find high-style-match/src-tauri/target -path '*release/bundle*' -maxdepth 9 -type f -print || true

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: High-Style-Match-macOS-Apple-Silicon
          path: high-style-match/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
