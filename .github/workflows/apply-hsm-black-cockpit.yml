name: Apply High Style Match Black Cockpit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hsm-black-cockpit.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply black cockpit redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path=Path('high-style-match/index.html')
          tether_path=Path('high-style-match/tether/index.html')
          signin_path=Path('high-style-match/sign-in/index.html')
          customer_path=Path('high-style-match/customer/index.html')

          main=main_path.read_text()
          main=main.replace("APP_VERSION='0.8.0'","APP_VERSION='0.9.0'")
          main=re.sub(r':root\{.*?\}', ''':root{
            --accent:#FFFFFF;--accent-2:#D9DCE2;--ink:#F5F7FA;--muted:#9A9FA8;--muted-2:#6E737D;
            --bg:#08090B;--surface:#111317;--surface-2:#16191E;--line:#25282E;--dark:#060708;--dark-2:#0D0F12;
            --success:#54B97A;--success-bg:#102219;--warn:#D39A37;--warn-bg:#241B0B;--danger:#E06060;--danger-bg:#2B1114;
            --shadow:0 14px 40px rgba(0,0,0,.28);--radius:14px;--radius-sm:10px;
          }''',main,count=1,flags=re.S)

          top_old='<header class="topbar"><div class="crumb" id="crumb"></div><div class="top-actions" id="topActions"></div></header>'
          top_new='<header class="topbar"><div class="global-search"><span>⌕</span><input id="hsmSearch" type="search" placeholder="Search projects, clients or shoots…" autocomplete="off"></div><div class="crumb" id="crumb"></div><div class="top-actions" id="topActions"></div></header>'
          if top_old in main:
            main=main.replace(top_old,top_new,1)

          css='''
/* HSM 0.9 — black cockpit */
html,body{background:#08090B!important;color:#F5F7FA!important}
body{color-scheme:dark}.app{grid-template-columns:272px minmax(0,1fr);background:#08090B}.sidebar{background:#060708!important;border-right:1px solid #1B1D22;padding:24px 14px 18px;box-shadow:none!important}.brand{padding:4px 12px 28px}.brandmark{width:38px;height:38px;border-radius:9px;background:#F5F7FA!important;box-shadow:none!important}.brandmark i{background:#08090B;box-shadow:0 -7px 0 #08090B,0 7px 0 #08090B}.brand strong{letter-spacing:.19em;font-size:12px}.brand small{color:#6F747D!important;text-transform:uppercase;letter-spacing:.15em;font-size:8px}.nav-label{display:none}.nav{gap:4px}.nav button{border-radius:9px;padding:11px 12px;color:#A3A8B1;font-size:12px;font-weight:590}.nav button:hover{background:#111318;color:#fff}.nav button.on{background:#17191E!important;color:#fff!important;box-shadow:inset 0 0 0 1px #23262C!important}.nav button.on svg{color:#fff}.sidebar-bottom{border-color:#1E2025}.storage-card{background:#0D0F12!important;border:1px solid #1F2228!important;color:#737982!important;border-radius:10px}.storage-card b{color:#DDE0E5}
.main{background:#08090B}.topbar{height:74px;padding:0 26px;background:rgba(8,9,11,.92)!important;border-bottom:1px solid #202228!important;display:grid;grid-template-columns:minmax(280px,420px) minmax(0,1fr) auto;gap:18px;backdrop-filter:blur(18px)}.global-search{height:40px;border:1px solid #272A31;border-radius:9px;background:#0D0F12;display:flex;align-items:center;gap:9px;padding:0 12px;color:#747A84}.global-search input{width:100%;border:0;outline:0;background:transparent;color:#F5F7FA;font-size:12px}.global-search input::placeholder{color:#777C85}.crumb{justify-self:start;color:#777C85}.crumb b{color:#DDE0E5}.top-actions{justify-self:end}.content{max-width:1500px;padding:28px 34px 44px}.eyebrow{color:#8D929B!important}.hero-title,.workspace-head h1,.panel h2,.card h2{color:#F5F7FA}.hero-copy,.muted,.panel-head p,.workspace-head p,.shot-note{color:#9398A2!important}
.btn{border-radius:9px;box-shadow:none!important}.btn.primary{background:#F5F7FA!important;color:#090A0C!important;border:1px solid #F5F7FA}.btn.primary:hover{background:#FFFFFF!important;transform:none!important}.btn.secondary{background:#111317!important;color:#E7E9ED!important;border:1px solid #2A2D33!important}.btn.secondary:hover{background:#181B20!important}.btn.ghost{color:#A0A5AE}.btn.danger{background:#261214!important;color:#F07A7A!important}.icon-btn{background:#111317!important;border-color:#282B31!important;color:#B5BAC3!important}
.panel,.stat,.workspace-head,.mini-stat,.setting-card,.template-row,.photo-card,.workflow-step,.shoot-row,.table-row,.review-block,.cull-stat,.download-box,.shot-preview-table,.shot-create-card,.live-launch,.live-pro-card{background:#111317!important;border-color:#25282E!important;color:#F5F7FA!important;box-shadow:none!important}.panel,.workspace-head,.stat{border-radius:12px}.panel-pad{padding:18px}.workspace-head{padding:0!important;background:transparent!important;border:0!important}.workspace-progress{display:none!important}.tabs{position:sticky;top:74px;z-index:14;margin:18px 0 20px;padding:0;background:rgba(8,9,11,.96)!important;border:0!important;border-bottom:1px solid #22252B!important;border-radius:0!important;gap:24px;backdrop-filter:blur(12px)}.tabs button{padding:12px 2px 11px!important;border:0!important;border-bottom:2px solid transparent!important;border-radius:0!important;background:transparent!important;color:#858A93!important;font-size:11px}.tabs button:hover{color:#DDE0E5!important}.tabs button.on{background:transparent!important;color:#FFFFFF!important;border-bottom-color:#FFFFFF!important}
.field input,.field textarea,.field select,.select,.photo-body select,.rename-row input{background:#0D0F12!important;color:#F5F7FA!important;border-color:#292C33!important}.field input:focus,.field textarea:focus,.field select:focus,.select:focus{border-color:#5A606A!important;box-shadow:0 0 0 3px rgba(255,255,255,.06)!important}.upload-zone,.empty,.shot-empty-note{background:#0D0F12!important;border-color:#2B2E35!important;color:#A3A8B1!important}.upload-zone .upload-icon,.empty .empty-icon,.stat .stat-icon{background:#1B1E23!important;color:#F5F7FA!important}.filters{background:#0D0F12!important}.filters button{color:#7F858E!important}.filters button.on{background:#22252A!important;color:#fff!important;box-shadow:none!important}.progress,.cull-progress{background:#202329!important}.progress i,.cull-progress i{background:#F5F7FA!important}.pill{background:#1B1E23!important;color:#B8BDC5!important}.pill.success{background:#102219!important;color:#64C88A!important}.pill.warn{background:#241B0B!important;color:#E0AA4A!important}.pill.purple{background:#1B1E23!important;color:#C9CDD3!important}.notice.info{background:#101318!important;color:#AEB4BD!important;border-color:#2A2E35!important}.notice.warn{background:#241B0B!important;color:#D9AD5A!important;border-color:#4A3612!important}.notice.success{background:#102219!important;color:#74CA95!important;border-color:#214831!important}.modal{background:#111317!important;color:#F5F7FA!important;border-color:#2A2D33!important}.toast{background:#F5F7FA!important;color:#090A0C!important;border:0!important}
.cockpit-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding:6px 0 4px}.cockpit-back{display:inline-flex;align-items:center;gap:7px;color:#A0A5AE;font-size:11px;margin-bottom:16px;cursor:pointer}.cockpit-head h1{font-size:42px;line-height:1;letter-spacing:-.045em;margin:0 0 8px;color:#fff}.cockpit-client{font-size:17px;color:#A1A6AF}.cockpit-meta{display:flex;gap:18px;align-items:center;color:#8E949D;font-size:11px;margin-bottom:14px;justify-content:flex-end}.cockpit-top-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px}.cockpit-status{font-size:10px;border:1px solid #2A2D33;border-radius:999px;padding:6px 9px;color:#A8ADB5;background:#0D0F12}
.cockpit-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.cockpit-main{min-width:0}.dash-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.dash-stat{background:#111317;border:1px solid #25282E;border-radius:11px;padding:18px}.dash-stat-top{display:flex;align-items:center;gap:12px}.dash-stat-icon{width:38px;height:38px;border-radius:50%;background:#202329;display:grid;place-items:center;font-size:17px}.dash-stat.good .dash-stat-icon{background:#10311F;color:#69D894}.dash-stat.warn .dash-stat-icon{background:#30230B;color:#F1B748}.dash-stat.bad .dash-stat-icon{background:#351416;color:#FF7777}.dash-stat b{display:block;font-size:28px;line-height:1;margin-bottom:4px}.dash-stat span{font-size:11px;color:#A0A5AE}.dash-meter{height:5px;background:#1E2126;border-radius:99px;margin-top:14px;overflow:hidden}.dash-meter i{display:block;height:100%;background:#777D86;border-radius:99px}.dash-stat.good .dash-meter i{background:#54B97A}.dash-stat.warn .dash-meter i{background:#D39A37}.dash-stat.bad .dash-meter i{background:#E06060}
.dash-section{margin-top:24px}.dash-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.dash-section-head h2{font-size:18px;margin:0;color:#fff}.dash-link{border:0;background:transparent;color:#A3A8B1;font-size:10px;font-weight:700}.recent-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.recent-card{min-width:0}.recent-thumb{aspect-ratio:1/1;background:#111317;border:1px solid #2A2D33;border-radius:8px;overflow:hidden;display:grid;place-items:center;color:#555B64}.recent-thumb img{width:100%;height:100%;object-fit:cover}.recent-card strong{display:block;font-size:10px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recent-card span{display:block;font-size:9px;color:#8E949D;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot-progress-card{border:1px solid #25282E;background:#0E1013;border-radius:10px;overflow:hidden}.shot-progress-row{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid #202329}.shot-progress-row:first-child{border-top:0}.shot-progress-title{display:flex;align-items:center;gap:11px}.shot-progress-mini{width:44px;height:34px;border-radius:6px;background:#171A1F;display:grid;place-items:center;color:#686E77;font-size:10px}.shot-progress-row strong{font-size:11px}.shot-progress-count{font-size:10px;color:#A0A5AE}.shot-progress-state{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#1C2025;color:#80858E;font-size:11px}.shot-progress-state.done{background:#1B5B38;color:#BFF2CF}.shot-progress-state.warn{background:#5B3D0B;color:#FFD58E}
.cockpit-side{display:grid;gap:14px;align-content:start}.side-card{background:#111317;border:1px solid #25282E;border-radius:11px;padding:17px}.side-card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.side-card-head h3{margin:0;font-size:16px}.next-shot-body{display:grid;grid-template-columns:126px minmax(0,1fr);gap:15px;align-items:center}.next-shot-thumb{height:126px;border-radius:8px;background:#0B0D10;border:1px solid #25282E;display:grid;place-items:center;color:#626873;overflow:hidden}.next-shot-thumb img{width:100%;height:100%;object-fit:cover}.next-shot-body h4{font-size:20px;margin:0 0 5px}.next-shot-body p{margin:0;color:#A1A6AF}.next-shot-count{font-size:10px;color:#A1A6AF;margin-top:14px}.side-primary{width:100%;margin-top:14px}.side-split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.shoot-notes{display:grid;gap:0}.shoot-note-row{padding:11px 0;border-top:1px solid #202329}.shoot-note-row:first-child{border-top:0}.shoot-note-row strong{display:block;font-size:10px;font-weight:600}.shoot-note-row span{display:block;font-size:8px;color:#717781;margin-top:4px}.leave-card{cursor:pointer}.leave-status{display:flex;align-items:flex-start;gap:11px}.leave-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#331517;color:#FF7272}.leave-card.ready .leave-icon{background:#12311E;color:#65CE89}.leave-status b{display:block;font-size:11px}.leave-status span{display:block;color:#90959E;font-size:9px;line-height:1.5;margin-top:4px}
@media(max-width:1200px){.cockpit-grid{grid-template-columns:1fr}.cockpit-side{grid-template-columns:repeat(3,minmax(0,1fr))}.recent-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:10px 12px}.brand{padding:4px 6px 12px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.sidebar-bottom{display:none}.topbar{top:0;grid-template-columns:minmax(180px,1fr) auto;height:64px;padding:0 12px}.crumb{display:none}.content{padding:18px 14px}.tabs{top:64px;overflow-x:auto}.cockpit-head{align-items:flex-start}.cockpit-head h1{font-size:31px}.cockpit-meta{justify-content:flex-start;flex-wrap:wrap}.cockpit-top-actions{align-items:flex-start}.dash-stats{grid-template-columns:1fr 1fr}.cockpit-side{grid-template-columns:1fr}.recent-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.topbar{grid-template-columns:1fr}.top-actions{display:none}.cockpit-head{display:block}.cockpit-top-actions{margin-top:14px}.dash-stats{grid-template-columns:1fr 1fr}.recent-strip{grid-template-columns:repeat(2,1fr)}.next-shot-body{grid-template-columns:92px 1fr}.next-shot-thumb{height:92px}}
'''
          if 'HSM 0.9 — black cockpit' not in main:
            main=main.replace('</style>',css+'\n</style>',1)

          const_marker="const fileURLs=new Map(),C=document.getElementById('content'),NAV=document.getElementById('nav'),CRUMB=document.getElementById('crumb'),TOP=document.getElementById('topActions'),SHOT=document.getElementById('shotFile'),PHOTOS=document.getElementById('photoFiles'),BACKUP=document.getElementById('backupFile');"
          if const_marker in main and "const SEARCH=document.getElementById('hsmSearch')" not in main:
            main=main.replace(const_marker,const_marker+"\nconst SEARCH=document.getElementById('hsmSearch');\nif(SEARCH)SEARCH.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=SEARCH.value.trim().toLowerCase();if(!q)return;const hit=D.shoots.find(s=>String(s.client||'').toLowerCase().includes(q)||String(s.name||'').toLowerCase().includes(q)||String(s.location||'').toLowerCase().includes(q));if(hit)openShoot(hit.id);else{navigate('shoots');toast('No matching project found')}});",1)

          setnav='''function navTo(id){if(id==='home'||id==='shoots'||id==='settings'||id==='clients'||id==='globalhistory'){navigate(id);return}if(['live','photos','cull','review','deliver'].includes(id)){let s=getShoot();if(!s){s=D.shoots[0];if(!s){navigate('shoots');toast('Create or open a project first.');return}shootId=String(s.id)}screen='workspace';tab=id;render();return}}
function setNav(){const items=[['home','home','Dashboard'],['shoots','folder','Projects'],['live','spark','Tether Mode'],['photos','photo','Photos'],['cull','star','Cull'],['review','eye','Review'],['deliver','send','Deliver'],['clients','template','Clients'],['globalhistory','archive','History'],['settings','settings','Settings']];NAV.innerHTML=items.map(([id,ic,label])=>{const active=screen===id||(screen==='workspace'&&tab===id)||(id==='shoots'&&['shotlist','new'].includes(screen));return `<button data-nav="${id}" class="${active?'on':''}">${icon(ic)}<span>${label}</span></button>`}).join('');NAV.querySelectorAll('button').forEach(b=>b.onclick=()=>navTo(b.dataset.nav))}
function renderClients(){setTop('<b>Clients</b>','');const map=new Map();for(const s of D.shoots){const key=s.client||'Unnamed client';if(!map.has(key))map.set(key,[]);map.get(key).push(s)}const rows=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0]));C.innerHTML=head('Clients','Your clients','Open the latest project for each client.')+`<div class="panel panel-pad">${rows.length?`<div class="shoot-list">${rows.map(([name,shoots])=>{const latest=[...shoots].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];return `<div class="shoot-row"><div><strong>${esc(name)}</strong><div class="meta">${shoots.length} project${shoots.length===1?'':'s'}</div></div><div class="meta">${esc(latest.name||'Latest project')}</div><div class="actions"><button class="btn secondary small client-open" data-id="${esc(latest.id)}">Open ${icon('arrow')}</button></div></div>`}).join('')}</div>`:`<div class="empty"><h3>No clients yet</h3><p>Create a project and the client will appear here.</p></div>`}</div>`;document.querySelectorAll('.client-open').forEach(b=>b.onclick=()=>openShoot(b.dataset.id))}
function renderGlobalHistory(){setTop('<b>History</b>','');const a=(D.activity||[]).slice(0,120);C.innerHTML=head('History','Recent activity','Project changes, exports and delivery events across High Style Match.')+`<div class="panel panel-pad">${a.length?`<div class="activity-list">${a.map(x=>`<div class="activity-item"><strong>${esc(x.label||'Activity')}</strong><span>${x.at?new Date(x.at).toLocaleString():''}${x.detail?' · '+esc(x.detail):''}</span></div>`).join('')}</div>`:`<div class="empty"><h3>No activity yet</h3><p>Your project activity will appear here.</p></div>`}</div>`}
'''
          main,n=re.subn(r'function setNav\(\)\{.*?\}\nfunction navigate',setnav+'function navigate',main,count=1,flags=re.S)
          if n!=1: raise SystemExit('setNav patch failed')

          render_new="function render(){setNav();if(screen==='shotlist')renderShotListHub();else if(screen==='home')renderHome();else if(screen==='shoots')renderShoots();else if(screen==='new')renderWizard();else if(screen==='templates')renderTemplates();else if(screen==='settings')renderSettings();else if(screen==='clients')renderClients();else if(screen==='globalhistory')renderGlobalHistory();else if(screen==='workspace')renderWorkspace();else renderHome()}"
          main,n=re.subn(r'function render\(\)\{.*?\}\nfunction setTop',render_new+'\nfunction setTop',main,count=1,flags=re.S)
          if n!=1: raise SystemExit('render patch failed')

          workspace='''function renderWorkspace(){const s=getShoot();if(!s)return navigate('shoots');normalizeData(D);const c=coverage(s),stage=workflowStage(s),ex=latestExport(s);setTop(`<span>Projects</span><span>›</span><b>${esc(s.client)}</b>`,`<button class="btn secondary small" id="undoTop" ${s.undoStack?.length?'':'disabled'}>${icon('undo')}Undo</button><button class="btn secondary small" id="deleteShoot">${icon('trash')}Delete</button>`);C.innerHTML=`<div class="workspace-head"><div class="cockpit-head"><div><button class="cockpit-back" id="backShoots" style="border:0;background:transparent;padding:0">← Projects</button><h1>${esc(s.name)}</h1><div class="cockpit-client">${esc(s.client)}</div></div><div class="cockpit-top-actions"><div class="cockpit-meta"><span>▣ ${esc(s.date||'No date')}</span>${s.location?`<span>⌖ ${esc(s.location)}</span>`:''}<span class="cockpit-status">${esc(statusText(s))}</span></div><button class="btn primary" id="startTether">Start Tether Mode →</button></div></div></div><div class="tabs" id="tabs">${[['overview','Overview'],['shotlist','Shot List'],['photos','Photos'],['cull','Cull'],['review','Review'],['rename','Rename'],['deliver','Deliver'],['history','History']].map(([id,l])=>`<button data-tab="${id}" class="${tab===id?'on':''}">${l}</button>`).join('')}</div><div id="workspaceBody"></div>`;document.getElementById('backShoots').onclick=()=>navigate('shoots');document.getElementById('deleteShoot').onclick=()=>confirmDeleteShoot(s);document.getElementById('undoTop').onclick=()=>undoLast(s);document.getElementById('startTether').onclick=()=>{location.href='./tether/?shoot='+encodeURIComponent(s.id)};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renameDraft=[];renderWorkspace()});renderTab(s,c)}'''
          main,n=re.subn(r'function renderWorkspace\(\)\{.*?\nfunction renderTab',workspace+'\nfunction renderTab',main,count=1,flags=re.S)
          if n!=1: raise SystemExit('workspace patch failed')

          overview='''function dashboardCovered(s,shot){const it=liveItem(s,shot.id);return it.state==='done'||s.photos.some(p=>p.shotId===shot.id&&!p.cullExcluded)}
function dashboardGroups(s){const map=new Map();for(const shot of s.shots.filter(x=>!x.skip)){if(!map.has(shot.subject))map.set(shot.subject,{subject:shot.subject,total:0,done:0,reshoot:0});const g=map.get(shot.subject);g.total++;if(dashboardCovered(s,shot))g.done++;else if(liveItem(s,shot.id).state==='reshoot')g.reshoot++}return[...map.values()]}
async function hydrateDashboardThumbs(arr){for(const p of arr){const u=await photoURL(p);if(!u)continue;const el=document.getElementById(`dashthumb-${p.id}`);if(el)el.innerHTML=`<img src="${u}" alt="">`;const n=document.getElementById('dash-next-thumb');if(n&&n.dataset.photo===p.id)n.innerHTML=`<img src="${u}" alt="">`}}
function renderOverview(W,s,c){const active=s.shots.filter(x=>!x.skip),st=liveState(s),covered=active.filter(x=>dashboardCovered(s,x)).length,reshoot=active.filter(x=>!dashboardCovered(s,x)&&liveItem(s,x.id).state==='reshoot').length,missing=active.filter(x=>!dashboardCovered(s,x)&&!['reshoot','skipped'].includes(liveItem(s,x.id).state)).length,total=active.length,pct=total?Math.round(covered/total*100):0;let current=active.find(x=>x.id===st.currentShotId&&!dashboardCovered(s,x))||active.find(x=>!dashboardCovered(s,x)&&liveItem(s,x.id).state!=='skipped')||active.find(x=>x.id===st.currentShotId)||active[0]||null;const currentItem=current?liveItem(s,current.id):null,currentPhotos=current?s.photos.filter(p=>p.shotId===current.id).sort((a,b)=>(b.captureAt||b.lastModified||0)-(a.captureAt||a.lastModified||0)):[],nextPhoto=currentPhotos[0]||null,recent=[...s.photos].sort((a,b)=>(b.captureAt||b.lastModified||0)-(a.captureAt||a.lastModified||0)).slice(0,6),groups=dashboardGroups(s),notes=active.map(x=>({shot:x,item:liveItem(s,x.id)})).filter(x=>x.item.note).sort((a,b)=>(b.item.updatedAt||0)-(a.item.updatedAt||0)).slice(0,4),leaveCount=missing+reshoot;W.innerHTML=`<div class="cockpit-grid"><div class="cockpit-main"><div class="dash-stats"><div class="dash-stat"><div class="dash-stat-top"><div class="dash-stat-icon">▣</div><div><b>${total}</b><span>Total Shots</span></div></div><div class="dash-meter"><i style="width:100%"></i></div></div><div class="dash-stat good"><div class="dash-stat-top"><div class="dash-stat-icon">✓</div><div><b>${covered}</b><span>Captured</span></div></div><div class="dash-meter"><i style="width:${pct}%"></i></div></div><div class="dash-stat warn"><div class="dash-stat-top"><div class="dash-stat-icon">◷</div><div><b>${reshoot}</b><span>Need Another</span></div></div><div class="dash-meter"><i style="width:${total?Math.round(reshoot/total*100):0}%"></i></div></div><div class="dash-stat bad"><div class="dash-stat-top"><div class="dash-stat-icon">×</div><div><b>${missing}</b><span>Missing</span></div></div><div class="dash-meter"><i style="width:${total?Math.round(missing/total*100):0}%"></i></div></div></div><section class="dash-section"><div class="dash-section-head"><h2>Recent Captures</h2><button class="dash-link" id="dashViewPhotos">View All →</button></div>${recent.length?`<div class="recent-strip">${recent.map(p=>{const shot=s.shots.find(x=>x.id===p.shotId);return `<div class="recent-card"><div class="recent-thumb" id="dashthumb-${esc(p.id)}">${esc((p.ext||'IMG').toUpperCase())}</div><strong>${esc(p.name)}</strong><span>${shot?esc(shot.subject):'Unassigned'}</span><span>${shot?esc(shot.variant):esc(p.orientation||'')}</span></div>`}).join('')}</div>`:`<div class="empty"><h3>No photographs yet</h3><p>Start Tether Mode or import photographs to see recent captures here.</p></div>`}</section><section class="dash-section"><div class="dash-section-head"><h2>Shot List Progress</h2><button class="dash-link" id="dashShotList">View Full Shot List →</button></div><div class="shot-progress-card">${groups.length?groups.map(g=>`<div class="shot-progress-row"><div class="shot-progress-title"><div class="shot-progress-mini">${esc(g.subject.slice(0,2).toUpperCase())}</div><strong>${esc(g.subject)}</strong></div><div class="shot-progress-count">${g.done} / ${g.total}</div><div class="shot-progress-state ${g.done===g.total?'done':g.reshoot?'warn':''}">${g.done===g.total?'✓':g.reshoot?'◷':'›'}</div></div>`).join(''):`<div class="shot-progress-row"><strong>No shot list added yet</strong><span></span><span></span></div>`}</div></section></div><aside class="cockpit-side"><section class="side-card"><div class="side-card-head"><h3>Next Shot</h3><span style="font-size:9px;color:#777D86">Auto-assign</span></div>${current?`<div class="next-shot-body"><div class="next-shot-thumb" id="dash-next-thumb" ${nextPhoto?`data-photo="${esc(nextPhoto.id)}"`:''}>${nextPhoto?esc((nextPhoto.ext||'IMG').toUpperCase()):'No frame yet'}</div><div><h4>${esc(current.subject)}</h4><p>${esc(current.variant)}</p><div class="next-shot-count">${currentItem?.captures||currentPhotos.length||0} captured</div></div></div><button class="btn primary side-primary" id="dashMark">Mark as Covered</button><div class="side-split"><button class="btn secondary" id="dashReshoot">Needs Another</button><button class="btn secondary" id="dashSkip">Skip</button></div>`:`<div class="empty" style="padding:22px"><p>No outstanding shot-list requirements.</p></div>`}</section><section class="side-card"><div class="side-card-head"><h3>Shoot Notes</h3>${current?`<button class="dash-link" id="dashAddNote">+ Add Note</button>`:''}</div><div class="shoot-notes">${notes.length?notes.map(n=>`<div class="shoot-note-row"><strong>${esc(n.item.note)}</strong><span>${esc(n.shot.subject)} · ${n.item.updatedAt?new Date(n.item.updatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</span></div>`).join(''):`<div class="shoot-note-row"><strong>No notes yet</strong><span>Add notes while shooting to keep client and styling requests together.</span></div>`}</div></section><section class="side-card leave-card ${leaveCount?'':'ready'}" id="dashLeave"><div class="side-card-head"><h3>Before You Leave</h3><span>→</span></div><div class="leave-status"><div class="leave-icon">${leaveCount?'!':'✓'}</div><div><b>${leaveCount?`${leaveCount} shot${leaveCount===1?'':'s'} need attention`:'Ready to leave'}</b><span>${leaveCount?`${missing} missing · ${reshoot} need another. Check the brief before leaving.`:'All required shots are accounted for.'}</span></div></div></section></aside></div>`;const vp=document.getElementById('dashViewPhotos');if(vp)vp.onclick=()=>{tab='photos';renderWorkspace()};const sl=document.getElementById('dashShotList');if(sl)sl.onclick=()=>{tab='shotlist';renderWorkspace()};const mark=document.getElementById('dashMark');if(mark&&current)mark.onclick=()=>liveMark(s,current.id,'done');const rs=document.getElementById('dashReshoot');if(rs&&current)rs.onclick=()=>liveMark(s,current.id,'reshoot');const sk=document.getElementById('dashSkip');if(sk&&current)sk.onclick=()=>liveMark(s,current.id,'skipped');const an=document.getElementById('dashAddNote');if(an&&current)an.onclick=()=>liveNoteModal(s,current.id);document.getElementById('dashLeave').onclick=()=>{for(const shot of active){if(s.photos.some(p=>p.shotId===shot.id)&&liveItem(s,shot.id).state==='pending')liveItem(s,shot.id).state='done'}save();liveShootCheck(s)};hydrateDashboardThumbs([...recent,...(nextPhoto?[nextPhoto]:[])])}'''
          main,n=re.subn(r'function renderOverview\(W,s,c\)\{.*?\nfunction renderShotListTab',overview+'\nfunction renderShotListTab',main,count=1,flags=re.S)
          if n!=1: raise SystemExit('overview patch failed')

          main_path.write_text(main)

          # Make the supporting web pages use the same matte-black visual system.
          for path in [tether_path,signin_path,customer_path]:
            text=path.read_text()
            marker='/* HSM black system 0.9 */'
            if marker in text: continue
            black='''
/* HSM black system 0.9 */
:root{--p:#fff;--p2:#d9dce2;--accent:#fff;--accent2:#d9dce2;--ink:#f5f7fa;--muted:#9a9fa8;--bg:#08090b;--card:#111317;--surface:#111317;--line:#25282e;--dark:#060708;--good:#54b97a;--success:#54b97a;--warn:#d39a37;--bad:#e06060;--danger:#e06060;--shadow:0 14px 40px rgba(0,0,0,.28)}
html,body{background:#08090b!important;color:#f5f7fa!important;color-scheme:dark}.top,.brand-panel{background:#060708!important}.card,.current,.queuecard,.modal,.login-panel,.login-wrap,.project-row,.empty,.setup{background:#111317!important;color:#f5f7fa!important;border-color:#25282e!important;box-shadow:none!important}.btn.primary,.primary{background:#fff!important;color:#090a0c!important;box-shadow:none!important}.btn.light,.btn.soft,.btn.dark,.secondary,.open,.signout{background:#15181c!important;color:#f5f7fa!important;border-color:#2a2d33!important}.field input,.project-select,.mini select{background:#0d0f12!important;color:#f5f7fa!important;border-color:#292c33!important}.eyebrow,.portal-label{color:#d9dce2!important}.badge{background:#1b1e23!important;color:#dfe2e7!important}.badge.good,.badge.public{background:#102219!important;color:#69c98b!important}.brief,.status.info{background:#15181c!important;color:#b8bdc5!important;border-color:#2a2d33!important}.viewer-foot,.thumbs{background:#111317!important}.vstat{background:#111317!important}.q,.thumb{background:#111317!important;color:#f5f7fa!important;border-color:#282b31!important}.q.on{background:#181b20!important;border-color:#4a4f58!important;box-shadow:none!important}.mark{background:#fff!important;box-shadow:none!important}.mark i{background:#08090b!important;box-shadow:0 -7px #08090b,0 7px #08090b!important}
'''
            text=text.replace('</style>',black+'\n</style>',1)
            path.write_text(text)
          PY

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['high-style-match/index.html','high-style-match/tether/index.html','high-style-match/sign-in/index.html','high-style-match/customer/index.html']:
              html=Path(name).read_text()
              scripts=[]
              for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
                  head=m.group(0).split('>')[0].lower()
                  if 'src=' not in head:
                      scripts.append(m.group(1))
              out=Path('/tmp')/(Path(name).parent.name+'-'+Path(name).stem+'.js')
              out.write_text('\n'.join(scripts))
          PY
          for f in /tmp/high-style-match-index.js /tmp/tether-index.js /tmp/sign-in-index.js /tmp/customer-index.js; do
            [ -f "$f" ] && node --check "$f"
          done
          grep -q 'HSM 0.9 — black cockpit' high-style-match/index.html
          grep -q 'Recent Captures' high-style-match/index.html
          grep -q 'Before You Leave' high-style-match/index.html

      - name: Publish redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html high-style-match/tether/index.html high-style-match/sign-in/index.html high-style-match/customer/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply black cockpit dashboard to High Style Match"
          git push origin HEAD:main
