name: Apply High Style Match Black Cockpit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hsm-black-cockpit.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply redesign
        run: python3 publish/apply-hsm-black-cockpit.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['high-style-match/index.html','high-style-match/tether/index.html','high-style-match/sign-in/index.html','high-style-match/customer/index.html']
          for i,name in enumerate(files):
              html=Path(name).read_text()
              scripts=[]
              for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
                  head=m.group(0).split('>')[0].lower()
                  if 'src=' not in head:
                      scripts.append(m.group(1))
              Path(f'/tmp/hsm-{i}.js').write_text('\n'.join(scripts))
          PY
          for f in /tmp/hsm-*.js; do node --check "$f"; done
          grep -q 'HSM 0.9 — black cockpit' high-style-match/index.html
          grep -q 'Recent Captures' high-style-match/index.html
          grep -q 'Before You Leave' high-style-match/index.html
      - name: Publish redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html high-style-match/tether/index.html high-style-match/sign-in/index.html high-style-match/customer/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply black cockpit dashboard to High Style Match"
          git push origin HEAD:main
