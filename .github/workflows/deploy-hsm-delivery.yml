name: Deploy High Style Match Delivery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HSM_DELIVERY_ADMIN_KEY: ${{ secrets.HSM_DELIVERY_ADMIN_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$HSM_DELIVERY_ADMIN_KEY" || { echo "Missing HSM_DELIVERY_ADMIN_KEY"; exit 1; }

      - name: Install Worker dependencies
        working-directory: high-style-match/delivery-worker
        run: npm install

      - name: Create R2 bucket if needed
        working-directory: high-style-match/delivery-worker
        shell: bash
        run: npx wrangler r2 bucket create high-style-match-deliveries || true

      - name: Deploy Worker
        id: deploy
        working-directory: high-style-match/delivery-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -1 || true)
          test -n "$URL" || { echo "Could not determine the workers.dev URL from Wrangler output."; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"

      - name: Set private delivery key
        working-directory: high-style-match/delivery-worker
        shell: bash
        run: printf '%s' "$HSM_DELIVERY_ADMIN_KEY" | npx wrangler secret put ADMIN_KEY

      - name: Verify delivery API
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --silent --show-error "$WORKER_URL/api/health"

      - name: Connect High Style Match to deployed Worker
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          path = pathlib.Path('high-style-match/delivery-config.js')
          text = path.read_text()
          url = os.environ['WORKER_URL'].rstrip('/')
          text = re.sub(r"apiBase:\s*'[^']*'", "apiBase: '" + url + "'", text)
          path.write_text(text)
          PY

      - name: Save Worker URL to main branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- high-style-match/delivery-config.js; then
            echo "Delivery config already points at $WORKER_URL"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/delivery-config.js
          git commit -m "Connect High Style Match delivery API"
          git push
