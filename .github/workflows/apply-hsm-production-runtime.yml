name: Apply High Style Match Production Runtime

on:
  push:
    paths:
      - 'scripts/apply-hsm-production-runtime.py'
      - '.github/workflows/apply-hsm-production-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production integration
        run: python3 scripts/apply-hsm-production-runtime.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for file in ['high-style-match/index.html','high-style-match/tether/index.html','high-style-match/sign-in/index.html','high-style-match/customer/index.html']:
              text=Path(file).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
              for i,s in enumerate(scripts):
                  if not s.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                      f.write(s); name=f.name
                  subprocess.run(['node','--check',name],check=True)
          PY
      - name: Publish production integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html high-style-match/tether/index.html high-style-match/sign-in/index.html high-style-match/customer/index.html
          git commit -m "Connect High Style Match production runtime"
          git push
