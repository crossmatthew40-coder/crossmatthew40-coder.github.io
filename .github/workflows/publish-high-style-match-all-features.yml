name: Publish High Style Match Complete Workflow

on:
  push:
    branches:
      - high-style-match-all-features
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify complete app
        run: |
          cat publish/all-features-parts/*.b64 | base64 --decode > /tmp/high-style-match.br
          python3 -m pip install --quiet brotli
          python3 - <<'PY'
          from pathlib import Path
          import brotli
          src = Path('/tmp/high-style-match.br').read_bytes()
          out = brotli.decompress(src)
          Path('/tmp/high-style-match-all-features.html').write_bytes(out)
          PY
          echo "434d28082857a015c559287d01fe2ca1a67ec763b4e3f017e2846e3330d107ac  /tmp/high-style-match-all-features.html" | sha256sum -c -
          test "$(wc -c < /tmp/high-style-match-all-features.html | tr -d ' ')" = "130893"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/high-style-match-all-features.html').read_text()
          checks = [
              "APP_VERSION='0.4.0'",
              'function renderReviewTab',
              'function extractEmbeddedJpeg',
              'function downloadFullArchive',
              'function renderSettings',
              'function runSmartCull',
              'function autoMatch',
              'Rename Studio',
          ]
          for item in checks:
              assert item in html, f'missing: {item}'
          m = re.search(r'<script>(.*)</script>', html, re.S)
          assert m, 'script block missing'
          Path('/tmp/high-style-match-all-features.js').write_text(m.group(1))
          PY
          node --check /tmp/high-style-match-all-features.js

      - name: Publish only High Style Match to main
        run: |
          git fetch origin main
          git switch -C main origin/main
          mkdir -p high-style-match
          cp /tmp/high-style-match-all-features.html high-style-match/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html
          if git diff --cached --quiet; then
            echo "High Style Match is already current."
          else
            git commit -m "Launch complete High Style Match workflow"
            git push origin main
          fi
