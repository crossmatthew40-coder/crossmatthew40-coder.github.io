name: Publish Current High Style Match Web

on:
  push:
    branches:
      - high-style-match-web-publish
    paths:
      - .github/workflows/update-high-style-match-shot-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify High Style Match
        shell: bash
        run: |
          cat publish/hsm-v4/*.b64 | base64 --decode > /tmp/high-style-match-index.html
          echo "ce1f68e7e8d54352a3c217b1783b2dc91d2d1a252f06b7d078f65c1aa9f9c6a6  /tmp/high-style-match-index.html" | sha256sum -c -
          test "$(wc -c < /tmp/high-style-match-index.html | tr -d ' ')" = "26135"
          grep -q 'id="uploadShotBtn"' /tmp/high-style-match-index.html
          grep -q 'Upload Existing Shot List' /tmp/high-style-match-index.html
          grep -q '.tsv' /tmp/high-style-match-index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/high-style-match-index.html').read_text()
          m = re.search(r'<script>([\s\S]*?)</script>', html)
          if not m:
              raise SystemExit('script block missing')
          Path('/tmp/high-style-match-app.js').write_text(m.group(1))
          PY
          node --check /tmp/high-style-match-app.js

      - name: Publish only High Style Match to main
        shell: bash
        run: |
          git fetch origin main
          git switch -C main origin/main
          mkdir -p high-style-match
          cp /tmp/high-style-match-index.html high-style-match/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/index.html
          if git diff --cached --quiet; then
            echo "High Style Match is already current."
          else
            git commit -m "Add existing shot list upload to High Style Match"
            git push origin main
          fi
