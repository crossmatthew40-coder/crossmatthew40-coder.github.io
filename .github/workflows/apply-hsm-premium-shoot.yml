name: Apply High Style Match Premium Shoot Mode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hsm-premium-shoot.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply premium shoot mode
        run: python3 publish/premium-hsm-shoot-mode.py

      - name: Validate Tether Mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('high-style-match/tether/index.html').read_text()
          scripts=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              head=m.group(0).split('>')[0].lower()
              if 'src=' not in head:
                  scripts.append(m.group(1))
          Path('/tmp/hsm-tether.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/hsm-tether.js
          grep -q 'HSM PREMIUM SHOOT MODE 0.10' high-style-match/tether/index.html
          grep -q 'id="premiumHud"' high-style-match/tether/index.html
          grep -q 'id="premiumRail"' high-style-match/tether/index.html
          grep -q 'timer=setInterval(scan,500)' high-style-match/tether/index.html

      - name: Publish premium shoot mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/tether/index.html high-style-match/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Create premium High Style Match shoot mode"
          git push origin HEAD:main
