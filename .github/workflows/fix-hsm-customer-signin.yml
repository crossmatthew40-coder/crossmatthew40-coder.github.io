name: Fix High Style Match Customer Sign In

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hsm-customer-signin.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Load auth config before sign-in logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('high-style-match/sign-in/index.html')
          text=p.read_text()
          old='<script>\n(()=>{'
          new='<script src="../auth-config.js"></script>\n<script>\n(()=>{'
          if new not in text:
              if old not in text:
                  raise SystemExit('sign-in script marker not found')
              text=text.replace(old,new,1)
          text=text.replace('\n<script src="../auth-config.js"></script>\n</body>','\n</body>',1)
          p.write_text(text)
          PY
      - name: Validate sign-in JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('high-style-match/sign-in/index.html').read_text()
          scripts=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              head=m.group(0).split('>')[0].lower()
              if 'src=' not in head:
                  scripts.append(m.group(1))
          Path('/tmp/signin.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/signin.js
          grep -q '<script src="../auth-config.js"></script>' high-style-match/sign-in/index.html
      - name: Publish fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-style-match/sign-in/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix customer sign-in authentication loading"
          git push origin HEAD:main
