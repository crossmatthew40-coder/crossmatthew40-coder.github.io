name: Verify High Style Live

on:
  push:
    paths:
      - 'high-style/**'
      - '.github/workflows/verify-high-style-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live High Style pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://crossmatthew40-coder.github.io/high-style"
          ok=0
          for attempt in {1..12}; do
            home="$(curl -fsSL --max-time 20 "$base/" || true)"
            if grep -q "Capturing" <<<"$home" && grep -q "High Style Creative" <<<"$home"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "High Style homepage is not live with expected content."
            exit 1
          fi

          curl -fsSL --max-time 20 "$base/work.html" | grep -q "Selected portfolio"
          curl -fsSL --max-time 20 "$base/about.html" | grep -q "About High Style"
          curl -fsSL --max-time 20 "$base/services.html" | grep -q "What High Style does"
          curl -fsSL --max-time 20 "$base/book.html" | grep -q "Start a project"

          echo "High Style live verification passed."
