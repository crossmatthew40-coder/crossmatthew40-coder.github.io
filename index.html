<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>High Style Creative</title>
<meta name="description" content="High Style Creative digital contact card">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
body{display:flex;justify-content:center;padding:16px 12px 36px}
.wrap{width:min(100%,520px);text-align:center}
.logo{display:block;width:min(82vw,360px);height:auto;margin:0 auto 20px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#777;font-weight:800;margin-bottom:10px}
h1{font-size:clamp(38px,10vw,58px);line-height:.92;letter-spacing:-.06em;margin:0}
.tag{color:#aaa;font-size:15px;line-height:1.55;margin:14px auto 26px;max-width:380px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;justify-content:space-between;min-height:82px;padding:15px 18px;border:1px solid #2b2b2b;border-radius:20px;background:#080808;color:#fff;text-decoration:none;text-align:left}
.link.primary{background:#fff;color:#000;border-color:#fff}
.link.primary .label,.link.primary .note{color:#555}
.label{display:block;color:#888;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin-bottom:5px}
.value{display:block;font-size:21px;font-weight:800}
.note{display:block;color:#777;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.arrow{font-size:27px}
.footer{color:#555;font-size:10px;letter-spacing:.17em;text-transform:uppercase;margin-top:24px;padding-top:18px;border-top:1px solid #141414}
@media(max-width:420px){.value{font-size:18px}.link{min-height:76px;padding:13px 14px}.logo{width:min(88vw,340px)}}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="high-style-logo.svg" alt="High Style Creative logo">
  <div class="eyebrow">Digital contact card</div>
  <h1>High Style<br>Creative</h1>
  <p class="tag">Capturing Culinary Creativity<br>Hospitality Photography &amp; Content</p>
  <div class="links">
    <a class="link primary" href="booking.html">
      <div>
        <span class="label">Bookings</span>
        <span class="value">Book a Shoot</span>
        <span class="note">Send a booking request</span>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="link" href="https://www.instagram.com/high_style_creative/" target="_blank" rel="noopener">
      <div>
        <span class="label">Instagram</span>
        <span class="value">@high_style_creative</span>
        <span class="note">Tap to view profile</span>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="link" href="tel:+447555481441">
      <div>
        <span class="label">Phone</span>
        <span class="value">07555 481441</span>
        <span class="note">Tap to call</span>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
  <div class="footer">Powered by High Style Cards</div>
</main>
</body>
</html>
