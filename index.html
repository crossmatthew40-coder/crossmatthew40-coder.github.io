<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{--fg:#fff;--muted:#aaa;--panel:rgba(12,12,12,.88);--line:#2b2b2b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}body{display:flex;justify-content:center;padding:20px 12px 34px;overflow-x:hidden;background:linear-gradient(145deg,#000 0%,#050505 42%,#111 68%,#000 100%)}.wrap{width:min(100%,520px);text-align:center;position:relative;z-index:1;opacity:0;transform:translateY(8px) scale(.985)}.brand-logo{display:block;width:min(72vw,250px);height:auto;margin:2px auto 14px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#777;font-weight:800;margin:0 0 10px}h1{font-size:clamp(38px,10vw,58px);line-height:.92;letter-spacing:-.06em;margin:0;color:#fff}.tag{color:var(--muted);font-size:15px;line-height:1.55;margin:14px auto 28px;max-width:360px}.links{display:grid;gap:14px}.link{display:flex;align-items:center;justify-content:space-between;min-height:88px;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:#fff;text-decoration:none;text-align:left;overflow:hidden;opacity:0;transform:translateY(14px)}.link.primary{background:#fff;color:#000;border-color:#fff}.left{display:flex;align-items:center;gap:14px;min-width:0}.icon-wrap{width:44px;height:44px;border:1px solid #313131;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;background:#050505}.link.primary .icon-wrap{border-color:#d0d0d0;background:#fff}.icon{width:22px;height:22px;display:block}.label{display:block;color:#888;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin-bottom:6px}.link.primary .label,.link.primary .note{color:#555}.value{display:block;font-size:22px;font-weight:800}.note{display:block;color:#777;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:7px}.arrow{font-size:28px;flex:0 0 auto}.footer{color:#555;font-size:10px;letter-spacing:.17em;text-transform:uppercase;margin-top:24px;padding-top:18px;border-top:1px solid #141414;opacity:0;transform:translateY(8px)}
.camera-intro{position:fixed;inset:0;z-index:9999;background:#000;pointer-events:none;overflow:hidden}.shutter{position:absolute;top:0;bottom:0;width:52%;background:#000;z-index:2;transform:translateX(0);will-change:transform}.shutter.left{left:0}.shutter.right{right:0}.camera-mark{position:absolute;left:50%;top:50%;width:128px;height:128px;transform:translate(-50%,-50%) scale(.78);z-index:5;opacity:0}.lens{position:absolute;inset:18px;border:2px solid rgba(255,255,255,.82);border-radius:50%;box-shadow:0 0 0 10px rgba(255,255,255,.05),inset 0 0 0 12px rgba(255,255,255,.04)}.lens:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}.focus span{position:absolute;width:28px;height:28px;border-color:#fff}.focus .tl{left:0;top:0;border-left:2px solid;border-top:2px solid}.focus .tr{right:0;top:0;border-right:2px solid;border-top:2px solid}.focus .bl{left:0;bottom:0;border-left:2px solid;border-bottom:2px solid}.focus .br{right:0;bottom:0;border-right:2px solid;border-bottom:2px solid}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8}
body.animating .camera-mark{animation:markIn .7s .10s ease forwards;-webkit-animation:markIn .7s .10s ease forwards}body.animating .flash{animation:flash .30s .70s ease-out forwards;-webkit-animation:flash .30s .70s ease-out forwards}body.animating .shutter.left{animation:openLeft .72s .92s cubic-bezier(.18,.86,.22,1) forwards;-webkit-animation:openLeft .72s .92s cubic-bezier(.18,.86,.22,1) forwards}body.animating .shutter.right{animation:openRight .72s .92s cubic-bezier(.18,.86,.22,1) forwards;-webkit-animation:openRight .72s .92s cubic-bezier(.18,.86,.22,1) forwards}body.animating .camera-intro{animation:introGone .01s 1.70s forwards;-webkit-animation:introGone .01s 1.70s forwards}body.animating .wrap{animation:pageIn .55s 1.05s ease forwards;-webkit-animation:pageIn .55s 1.05s ease forwards}body.animating .link:nth-child(1){animation:itemIn .36s 1.18s ease forwards;-webkit-animation:itemIn .36s 1.18s ease forwards}body.animating .link:nth-child(2){animation:itemIn .36s 1.30s ease forwards;-webkit-animation:itemIn .36s 1.30s ease forwards}body.animating .link:nth-child(3){animation:itemIn .36s 1.42s ease forwards;-webkit-animation:itemIn .36s 1.42s ease forwards}body.animating .footer{animation:itemIn .34s 1.54s ease forwards;-webkit-animation:itemIn .34s 1.54s ease forwards}
@keyframes markIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}45%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:1;transform:translate(-50%,-50%) scale(.94)}}@-webkit-keyframes markIn{0%{opacity:0;-webkit-transform:translate(-50%,-50%) scale(.72)}45%{opacity:1;-webkit-transform:translate(-50%,-50%) scale(1)}100%{opacity:1;-webkit-transform:translate(-50%,-50%) scale(.94)}}@keyframes flash{0%{opacity:0}35%{opacity:.95}100%{opacity:0}}@-webkit-keyframes flash{0%{opacity:0}35%{opacity:.95}100%{opacity:0}}@keyframes openLeft{to{transform:translateX(-105%)}}@-webkit-keyframes openLeft{to{-webkit-transform:translateX(-105%)}}@keyframes openRight{to{transform:translateX(105%)}}@-webkit-keyframes openRight{to{-webkit-transform:translateX(105%)}}@keyframes introGone{to{visibility:hidden}}@-webkit-keyframes introGone{to{visibility:hidden}}@keyframes pageIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@-webkit-keyframes pageIn{from{opacity:0;-webkit-transform:translateY(8px) scale(.985)}to{opacity:1;-webkit-transform:translateY(0) scale(1)}}@keyframes itemIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@-webkit-keyframes itemIn{from{opacity:0;-webkit-transform:translateY(14px)}to{opacity:1;-webkit-transform:translateY(0)}}
@media(max-width:420px){.value{font-size:19px}.link{min-height:80px;padding:14px}.icon-wrap{width:40px;height:40px}.icon{width:20px;height:20px}.brand-logo{width:min(70vw,225px)}}@media(prefers-reduced-motion:reduce){body.animating .camera-mark{animation:markIn .28s .05s ease forwards!important;-webkit-animation:markIn .28s .05s ease forwards!important}body.animating .flash{animation:flash .22s .30s ease-out forwards!important;-webkit-animation:flash .22s .30s ease-out forwards!important}body.animating .shutter.left{animation:openLeft .42s .46s ease forwards!important;-webkit-animation:openLeft .42s .46s ease forwards!important}body.animating .shutter.right{animation:openRight .42s .46s ease forwards!important;-webkit-animation:openRight .42s .46s ease forwards!important}body.animating .camera-intro{animation:introGone .01s .92s forwards!important;-webkit-animation:introGone .01s .92s forwards!important}body.animating .wrap{animation:pageIn .01s .70s forwards!important;-webkit-animation:pageIn .01s .70s forwards!important}body.animating .link,body.animating .footer{animation:itemIn .01s .72s forwards!important;-webkit-animation:itemIn .01s .72s forwards!important}}
</style>
<noscript><style>.camera-intro{display:none}.wrap,.link,.footer{opacity:1!important;transform:none!important}</style></noscript>
</head>

<script>
(function(){
var running=false;
function reset(){
  document.body.classList.remove('animating');
  var old=document.querySelector('.camera-intro');
  if(old){var fresh=old.cloneNode(true);old.parentNode.replaceChild(fresh,old)}
  var wrap=document.querySelector('.wrap');
  var items=document.querySelectorAll('.link,.footer');
  if(wrap){wrap.style.opacity='0';wrap.style.transform='translateY(8px) scale(.985)'}
  items.forEach(function(el){el.style.opacity='0';el.style.transform='translateY(14px)'})
}
function start(){
  if(running)return;running=true;reset();
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    document.body.classList.add('animating');
    setTimeout(function(){running=false},1800);
  })});
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(start,80)})}else{setTimeout(start,80)}
window.addEventListener('pageshow',function(e){if(e.persisted)setTimeout(start,60)});
})();
</script>
