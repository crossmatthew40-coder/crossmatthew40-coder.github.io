<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>High Style Creative</title>
<meta name="description" content="High Style Creative digital contact card">
<style>
:root{--bg:#000;--fg:#fff;--muted:#9b9b9b;--panel:rgba(12,12,12,.84);--line:#2b2b2b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
body{display:flex;justify-content:center;padding:20px 12px 34px;overflow-x:hidden;background:linear-gradient(145deg,#000 0%,#060606 45%,#111 70%,#000 100%);background-size:220% 220%;animation:bgDrift 18s ease-in-out infinite}
.wrap{width:min(100%,520px);text-align:center;position:relative;z-index:1;opacity:0;filter:blur(12px);transform:scale(.965)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#777;font-weight:800;margin:0 0 10px}
h1{font-size:clamp(38px,10vw,58px);line-height:.92;letter-spacing:-.06em;margin:0;color:#fff}
.tag{color:#aaa;font-size:15px;line-height:1.55;margin:14px auto 28px;max-width:360px}
.links{display:grid;gap:14px}
.link{display:flex;align-items:center;justify-content:space-between;min-height:88px;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:#fff;text-decoration:none;text-align:left;overflow:hidden;opacity:0;transform:translateY(12px) scale(.99);transition:transform .24s ease,border-color .24s ease,background .24s ease}
.link.primary{background:#fff;color:#000;border-color:#fff}
.left{display:flex;align-items:center;gap:14px;min-width:0}
.icon-wrap{width:44px;height:44px;border:1px solid #313131;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;background:#050505}
.link.primary .icon-wrap{border-color:#d0d0d0;background:#fff}
.icon{width:22px;height:22px;display:block}
.label{display:block;color:#888;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.link.primary .label,.link.primary .note{color:#555}
.value{display:block;font-size:22px;font-weight:800}
.note{display:block;color:#777;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:7px}
.arrow{font-size:28px;flex:0 0 auto}
.footer{color:#555;font-size:10px;letter-spacing:.17em;text-transform:uppercase;margin-top:24px;padding-top:18px;border-top:1px solid #141414;opacity:0}

/* CAMERA INTRO — built to work reliably on iPhone Safari */
.camera-intro{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;background:#000}
.shutter{position:absolute;left:0;width:100%;height:51%;background:#000;z-index:4}
.shutter.top{top:0}
.shutter.bottom{bottom:0}
.focus-ui{position:absolute;left:50%;top:50%;width:116px;height:116px;transform:translate(-50%,-50%) scale(.78);opacity:0;z-index:7}
.corner{position:absolute;width:27px;height:27px;border-color:#fff;opacity:.9}
.corner.tl{left:0;top:0;border-left:2px solid;border-top:2px solid}
.corner.tr{right:0;top:0;border-right:2px solid;border-top:2px solid}
.corner.bl{left:0;bottom:0;border-left:2px solid;border-bottom:2px solid}
.corner.br{right:0;bottom:0;border-right:2px solid;border-bottom:2px solid}
.focus-dot{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.lens-ring{position:absolute;left:50%;top:50%;width:158px;height:158px;border:2px solid rgba(255,255,255,.28);border-radius:50%;transform:translate(-50%,-50%) scale(.62);opacity:0;z-index:6;box-shadow:0 0 0 10px rgba(255,255,255,.025),0 0 38px rgba(255,255,255,.08)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:9}

body.play-intro .focus-ui{animation:focusAppear .42s .12s ease forwards,focusLock .22s .48s ease forwards}
body.play-intro .lens-ring{animation:lensIn .52s .12s ease forwards,lensOut .52s .58s ease forwards}
body.play-intro .flash{animation:flash .34s .62s ease-out forwards}
body.play-intro .shutter.top{animation:shutterTop .62s .78s cubic-bezier(.2,.85,.2,1) forwards}
body.play-intro .shutter.bottom{animation:shutterBottom .62s .78s cubic-bezier(.2,.85,.2,1) forwards}
body.play-intro .camera-intro{animation:introOff .01s 1.45s forwards}
body.play-intro .wrap{animation:focusPage .58s .88s cubic-bezier(.16,.9,.25,1) forwards}
body.play-intro .links .link:nth-child(1){animation:cardIn .38s 1.12s ease forwards}
body.play-intro .links .link:nth-child(2){animation:cardIn .38s 1.23s ease forwards}
body.play-intro .links .link:nth-child(3){animation:cardIn .38s 1.34s ease forwards}
body.play-intro .footer{animation:fadeUp .35s 1.47s ease forwards}

@keyframes focusAppear{from{opacity:0;transform:translate(-50%,-50%) scale(.72)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes focusLock{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(.92)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes lensIn{from{opacity:0;transform:translate(-50%,-50%) scale(.62)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes lensOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(1.34)}}
@keyframes flash{0%,28%{opacity:0}40%{opacity:.92}60%{opacity:.22}100%{opacity:0}}
@keyframes shutterTop{from{transform:translateY(0)}to{transform:translateY(-102%)}}
@keyframes shutterBottom{from{transform:translateY(0)}to{transform:translateY(102%)}}
@keyframes introOff{to{visibility:hidden}}
@keyframes focusPage{0%{opacity:0;filter:blur(12px);transform:scale(.965)}70%{opacity:1;filter:blur(1px);transform:scale(1.006)}100%{opacity:1;filter:blur(0);transform:scale(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bgDrift{0%{background-position:0% 45%}50%{background-position:100% 55%}100%{background-position:0% 45%}}

@media (hover:hover) and (pointer:fine){.link:hover{transform:translateY(-5px) scale(1.025);border-color:#fff;background:rgba(28,28,28,.96)}.link.primary:hover{background:#fff}}
@media(max-width:420px){.value{font-size:19px}.link{min-height:80px;padding:14px}.icon-wrap{width:40px;height:40px}.icon{width:20px;height:20px}}
@media(prefers-reduced-motion:reduce){.camera-intro{display:none}.wrap,.link,.footer{opacity:1!important;transform:none!important;filter:none!important;animation:none!important}}
</style>
</head>
<body class="play-intro">
<div class="camera-intro" aria-hidden="true">
  <div class="shutter top"></div>
  <div class="shutter bottom"></div>
  <div class="lens-ring"></div>
  <div class="focus-ui">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><span class="focus-dot"></span>
  </div>
  <div class="flash"></div>
</div>

<main class="wrap">
  <div class="eyebrow">Digital contact card</div>
  <h1>High Style<br>Creative</h1>
  <p class="tag">Capturing Culinary Creativity<br>Hospitality Photography &amp; Content</p>

  <div class="links">
    <a class="link primary" href="booking.html">
      <div class="left"><div class="icon-wrap"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><div><span class="label">Bookings</span><span class="value">Book a Shoot</span><span class="note">Send a booking request</span></div></div><div class="arrow">→</div>
    </a>

    <a class="link" href="https://www.instagram.com/high_style_creative/" target="_blank" rel="noopener">
      <div class="left"><div class="icon-wrap"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg></div><div><span class="label">Instagram</span><span class="value">@high_style_creative</span><span class="note">Tap to view profile</span></div></div><div class="arrow">→</div>
    </a>

    <a class="link" href="tel:+447555481441">
      <div class="left"><div class="icon-wrap"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.7 4.5h2.5c.5 0 .9.3 1 .8l.6 3c.1.4 0 .8-.3 1.1l-1.6 1.6a14 14 0 0 0 4.6 4.6l1.6-1.6c.3-.3.7-.4 1.1-.3l3 .6c.5.1.8.5.8 1v2.5c0 .6-.4 1-.9 1.1-.8.1-1.7.2-2.5.2C10.2 20.6 3.4 13.8 3.4 5.9c0-.8.1-1.7.2-2.5.1-.5.5-.9 1.1-.9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></div><div><span class="label">Phone</span><span class="value">07555 481441</span><span class="note">Tap to call</span></div></div><div class="arrow">→</div>
    </a>
  </div>
  <div class="footer">Powered by High Style Cards</div>
</main>

<script>
(function(){
  function replayIntro(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.body.classList.remove('play-intro');
    void document.body.offsetWidth;
    document.body.classList.add('play-intro');
  }
  window.addEventListener('pageshow', replayIntro);
})();
</script>
</body>
</html>
