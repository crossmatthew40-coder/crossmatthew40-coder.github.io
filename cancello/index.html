<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f0ec">
<title>Cancello Bar & Restaurant</title>
<meta name="description" content="Cancello Bar & Restaurant digital card">
<style>
:root{--navy:#22266f;--gold:#c69a52;--ink:#171717;--muted:#6e6e6e;--line:rgba(25,25,25,.12);--glass:rgba(255,255,255,.78)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{display:flex;justify-content:center;align-items:flex-start;padding:28px 12px 40px;background:
radial-gradient(circle at 12% 18%,rgba(255,255,255,.96) 0 10%,transparent 36%),
radial-gradient(circle at 88% 12%,rgba(205,205,205,.42),transparent 28%),
linear-gradient(118deg,transparent 0 24%,rgba(105,105,105,.10) 25%,transparent 26% 50%,rgba(135,135,135,.13) 51%,transparent 52% 74%,rgba(120,120,120,.08) 75%,transparent 76%),
linear-gradient(145deg,#f7f6f3 0%,#e8e6e1 42%,#faf9f7 68%,#e5e3de 100%);background-attachment:fixed}
.wrap{width:min(100%,520px);text-align:center}
.shell{background:var(--glass);border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:30px;padding:34px 20px 24px;box-shadow:0 18px 55px rgba(20,20,20,.10)}
.logo{display:block;width:min(70vw,285px);height:auto;margin:0 auto 16px;mix-blend-mode:multiply}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#777;font-weight:800;margin:4px 0 10px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(31px,8vw,44px);line-height:1.02;margin:0;color:var(--navy);letter-spacing:-.035em}
.tag{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#6e604e;font-size:15px;line-height:1.5;margin:12px auto 26px;max-width:360px}
.link{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:80px;padding:15px 17px;border:1px solid var(--navy);border-radius:19px;background:var(--navy);color:#fff;text-decoration:none;text-align:left;box-shadow:0 8px 24px rgba(34,38,111,.16)}
.left{display:flex;align-items:center;gap:13px;min-width:0}.iconbox{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.09)}
.icon{width:22px;height:22px;display:block}.label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.64);font-weight:800;margin-bottom:5px}.value{display:block;font-size:18px;font-weight:800;line-height:1.16}.note{display:block;font-size:11px;color:rgba(255,255,255,.65);margin-top:4px}.arrow{font-size:24px;opacity:.72;flex:0 0 auto}
.address{margin:22px auto 4px;padding-top:18px;border-top:1px solid rgba(0,0,0,.08);font-size:12px;color:#727272;line-height:1.55}.address strong{color:var(--navy)}
.footer{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#8c8c8c;margin-top:18px}.footer b{color:#666}
@media(max-width:390px){.shell{padding:28px 14px 20px}.logo{width:min(76vw,265px)}.link{min-height:74px;padding:13px 14px}.value{font-size:17px}}
</style>
</head>
<body>
<main class="wrap">
<section class="shell">
<img class="logo" src="https://static.wixstatic.com/media/8e77a0_14d664a9ae2245329222d55691ced44d~mv2.jpg" alt="Cancello Bar & Restaurant logo">
<div class="eyebrow">Digital restaurant card</div>
<h1>Cancello<br>Bar &amp; Restaurant</h1>
<p class="tag">Authentic Italian dining in the heart of Newton-le-Willows.</p>
<a class="link" href="https://www.cancellorestaurant.com" target="_blank" rel="noopener">
<div class="left"><div class="iconbox"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><path d="M3.8 12h16.4M12 3.5c2.4 2.4 3.7 5.2 3.7 8.5S14.4 18.1 12 20.5C9.6 18.1 8.3 15.3 8.3 12S9.6 5.9 12 3.5Z" stroke="currentColor" stroke-width="1.6"/></svg></div><div><span class="label">Website</span><span class="value">Visit Cancello</span><span class="note">Menu, bookings & more</span></div></div><div class="arrow">→</div>
</a>
<div class="address"><strong>Cancello Bar &amp; Restaurant</strong><br>136 High Street, Newton-le-Willows, WA12 9SG</div>
<div class="footer">Powered by <b>High Style Cards</b></div>
</section>
</main>
</body>
</html>
