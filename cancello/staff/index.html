<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22266f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cancello Staff">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Cancello Staff</title>
<style>
:root{--navy:#22266f;--ink:#181818;--muted:#6d6d74;--paper:#f5f5f2;--card:#fff;--line:#e7e7e4;--green:#237447;--amber:#a66a12;--red:#a13e3e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink)}html{overscroll-behavior-y:none}body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit}.hidden{display:none!important}
.login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(18,18,24,.46);backdrop-filter:blur(10px)}.login-card{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.18)}.brand{font-family:Georgia,serif;color:var(--navy);font-size:36px;letter-spacing:-.04em;margin:0}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 22px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#666}.field input,.field textarea{width:100%;border:1px solid #d9d9d5;border-radius:13px;background:#fafafa;padding:13px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(34,38,111,.08);background:#fff}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:13px 15px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:white}.secondary{margin-top:8px;background:#efeff6;color:var(--navy)}.msg{font-size:12px;line-height:1.45;margin-top:12px;color:var(--muted)}
.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.top-in{max-width:1180px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 18px 12px}.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-family:Georgia,serif;color:var(--navy);font-size:30px;letter-spacing:-.03em;margin:0}.top small{display:block;color:#777;margin-top:2px}.signout{border:1px solid #dadada;background:#fff;border-radius:11px;padding:9px 11px;font-weight:700;color:#555;cursor:pointer}.install-app{border:0;background:var(--navy);color:#fff;border-radius:11px;padding:10px 12px;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap}.sync-pill{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;font-weight:800;color:#666}.sync-dot{width:8px;height:8px;border-radius:50%;background:#aaa}.sync-dot.live{background:#2c8b57}.sync-dot.error{background:#b84b4b}.tabs{display:flex;gap:7px;overflow:auto;padding-top:13px}.tab{white-space:nowrap;border:1px solid #dedede;background:#fff;color:#555;border-radius:999px;padding:9px 13px;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}
.main{max-width:1180px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{display:block;color:var(--navy);font:500 30px/1 Georgia,serif}.stat span{font-size:11px;color:#777;font-weight:700}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0 14px;flex-wrap:wrap}.toolbar h2{margin:0;font-family:Georgia,serif;color:var(--navy);font-size:26px}.toolbar-actions{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end}.search{width:min(330px,100%);border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 12px;outline:none}.search:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(34,38,111,.08)}.refresh{border:1px solid #ddd;background:#fff;border-radius:11px;padding:9px 12px;font-weight:800;color:var(--navy);cursor:pointer}
.orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.order{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 5px 18px rgba(0,0,0,.035)}.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.code{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#777;font-weight:900}.order h3{margin:3px 0 4px;color:var(--navy);font:500 23px/1.1 Georgia,serif}.phone{color:#555;font-size:12px;text-decoration:none}.badge{border-radius:999px;padding:6px 9px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;background:#eef0f8;color:var(--navy)}.badge.confirmed{background:#edf7ef;color:var(--green)}.badge.preparing{background:#fff3dd;color:var(--amber)}.badge.complete{background:#e9f4ed;color:var(--green)}.badge.cancelled{background:#faeaea;color:var(--red)}
.items{margin:14px 0;padding:11px 0;border-top:1px solid #eee;border-bottom:1px solid #eee}.item{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}.item b{color:var(--navy)}.allergy{margin:10px 0;padding:11px 12px;border-radius:12px;background:#fff3df;border-left:4px solid #d38919;color:#674c1d;font-size:12px;line-height:1.45}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{border:1px solid #e1e1de;border-radius:11px;padding:9px;background:#fafafa}.mini label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:#777;margin-bottom:4px}.mini input{width:100%;border:0;background:transparent;padding:0;outline:0;font-size:12px}.notes{margin-top:8px}.notes textarea{width:100%;min-height:58px;border:1px solid #e1e1de;background:#fafafa;border-radius:11px;padding:9px;resize:vertical;outline:0;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.action{border:1px solid #dedede;background:#fff;border-radius:10px;padding:9px 10px;font-size:11px;font-weight:800;cursor:pointer;color:#444}.action.primary-action{background:var(--navy);border-color:var(--navy);color:#fff}.action.good{background:#edf7ef;color:var(--green);border-color:#d8eadc}.action.warn{background:#fff4df;color:#8b5d12;border-color:#eeddb9}.action.danger{color:var(--red)}
.empty{grid-column:1/-1;padding:42px 20px;text-align:center;color:#777;background:#fff;border:1px dashed #d7d7d2;border-radius:18px}.setup-note{background:#fff;border:1px solid var(--line);padding:16px;border-radius:18px;color:#555;font-size:13px;line-height:1.55}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.orders{grid-template-columns:1fr}.main{padding:12px}.top-in{padding:13px 12px 10px}.top h1{font-size:25px}.stat{padding:13px}.stat b{font-size:26px}.meta{grid-template-columns:1fr}.toolbar-actions{width:100%;justify-content:stretch}.search{flex:1;width:auto}}
.print-docket{display:none}
@media print{
  @page{margin:4mm}
  html,body{background:#fff!important;width:80mm;margin:0!important;padding:0!important}
  body *{visibility:hidden!important}
  .print-docket,.print-docket *{visibility:visible!important}
  .print-docket{display:block!important;position:absolute;left:0;top:0;width:72mm;padding:2mm 1mm;background:#fff;color:#000;font-family:"Courier New",monospace}
  .docket-brand{text-align:center;font-weight:900;font-size:25px;letter-spacing:2px;margin:0 0 2mm}
  .docket-type{text-align:center;font-weight:900;font-size:16px;border-top:2px solid #000;border-bottom:2px solid #000;padding:2mm 0;margin-bottom:3mm}
  .docket-order{text-align:center;font-size:25px;font-weight:900;margin:2mm 0}
  .docket-name{text-align:center;font-size:18px;font-weight:900;margin-bottom:3mm;text-transform:uppercase}
  .docket-rule{border-top:2px dashed #000;margin:3mm 0}
  .docket-row{display:flex;justify-content:space-between;gap:4mm;font-size:12px;line-height:1.35;margin:1mm 0}
  .docket-row strong{text-align:right}
  .docket-section{font-size:13px;font-weight:900;margin:3mm 0 1.5mm;text-transform:uppercase}
  .docket-item{display:grid;grid-template-columns:12mm 1fr;gap:2mm;align-items:start;font-size:17px;font-weight:900;line-height:1.25;padding:2mm 0;border-bottom:1px dashed #000}
  .docket-qty{font-size:20px}
  .docket-alert{border:3px solid #000;padding:2.5mm;margin:3mm 0;font-size:15px;font-weight:900;line-height:1.3}
  .docket-none{font-size:13px}
  .docket-notes{font-size:13px;line-height:1.4;white-space:pre-wrap}
  .docket-footer{text-align:center;border-top:2px dashed #000;margin-top:4mm;padding-top:2mm;font-size:10px}
}
</style>
</head>
<body>


<div class="app" id="app">
<header class="top"><div class="top-in">
  <div class="top-row"><div><h1>Cancello Pre-Orders</h1><small id="updated">Every pre-order in one place</small><div class="sync-pill"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Connecting…</span></div></div><button class="install-app" id="install-app" type="button">Install App</button></div>
  <nav class="tabs">
    <button class="tab active" data-view="all">All Pre-Orders</button>
    <button class="tab" data-view="today">Today</button>
    <button class="tab" data-view="new">New Orders</button>
    <button class="tab" data-view="kitchen">Kitchen</button>
    <button class="tab" data-view="upcoming">Upcoming</button>
    <button class="tab" data-view="completed">Completed</button>
  </nav>
</div></header>
<main class="main">
  <section class="stats" id="stats"></section>
  <div class="toolbar"><h2 id="view-title">All Pre-Orders</h2><div class="toolbar-actions"><input class="search" id="search" type="search" placeholder="Search name, phone or PRE number"><button class="refresh" id="refresh">↻ Refresh</button></div></div>
  <section class="orders" id="orders"><div class="empty">Opening Cancello Staff…</div></section>
</main>
</div>
<section class="print-docket" id="print-docket" aria-hidden="true"></section>

<script type="module">
const STAFF_API="https://wmuuvcrrmzftayyynhki.supabase.co/functions/v1/cancello-staff-api";
const el=id=>document.getElementById(id);
let rows=[],view="all",searchTerm="",installPrompt=null,staffKey="";
const isiOSDevice=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standaloneNow=()=>window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
if(!isiOSDevice){
  const manifestLink=document.createElement("link");
  manifestLink.rel="manifest";
  manifestLink.href="./manifest.webmanifest";
  document.head.appendChild(manifestLink);
}
const ACCESS_CACHE="cancello-staff-device";
const ACCESS_REQ="/cancello/staff/__device_access__";
function getCookie(name){return document.cookie.split(";").map(v=>v.trim()).find(v=>v.startsWith(name+"="))?.slice(name.length+1)||"";}
async function saveStaffKey(key){
  if(!key)return;
  staffKey=key;
  try{localStorage.setItem("cancello_staff_key",key);}catch(e){}
  try{document.cookie="cancello_staff_key="+encodeURIComponent(key)+"; Max-Age=63072000; Path=/cancello/staff/; Secure; SameSite=Strict";}catch(e){}
  try{const cache=await caches.open(ACCESS_CACHE);await cache.put(ACCESS_REQ,new Response(key,{headers:{"Content-Type":"text/plain"}}));}catch(e){}
}
async function recoverStaffKey(){
  const qs=new URLSearchParams(location.search);
  const queryKey=qs.get("access")||"";
  const hashKey=location.hash.startsWith("#access=")?decodeURIComponent(location.hash.slice(8)):"";
  let key=queryKey||hashKey;
  if(!key){try{key=localStorage.getItem("cancello_staff_key")||"";}catch(e){}}
  if(!key){try{key=decodeURIComponent(getCookie("cancello_staff_key")||"");}catch(e){}}
  if(!key){try{const cache=await caches.open(ACCESS_CACHE);const hit=await cache.match(ACCESS_REQ);if(hit)key=(await hit.text()).trim();}catch(e){}}
  if(key){
    await saveStaffKey(key);
    if(hashKey && !queryKey){
      const u=new URL(location.href);
      u.hash="";
      u.searchParams.set("access",key);
      history.replaceState(null,"",u.pathname+"?"+u.searchParams.toString());
    }
  }
  return key;
}

function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function toInput(iso){if(!iso)return"";const d=new Date(iso),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());}
function isToday(iso){if(!iso)return false;const d=new Date(iso),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function orderDate(r){return r.booking_time||r.created_at;}
function lastName(name=""){const parts=String(name).trim().split(/\s+/).filter(Boolean);return parts.length?parts[parts.length-1]:"Guest";}
function docketDateTime(iso){
  if(!iso)return {date:"Not set",time:"Not set"};
  const d=new Date(iso);
  return {
    date:d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),
    time:d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})
  };
}
function badge(s){return '<span class="badge '+esc(s)+'">'+esc(s)+'</span>';}
async function api(body){
  if(!staffKey) throw new Error("This device is not connected to Cancello Staff.");
  const r=await fetch(STAFF_API,{method:"POST",headers:{"Content-Type":"application/json","X-Cancello-Staff-Key":staffKey},body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||"Staff Hub request failed");
  return data;
}
function accessError(message){
  el("stats").innerHTML="";
  el("view-title").textContent="All Pre-Orders";
  el("orders").className="orders";
  el("orders").innerHTML='<div class="empty"><strong>Orders are safe, but this phone is not connected.</strong><br><br>'+esc(message)+'<br><br>Open the private staff link on this phone once, then reopen the app.</div>';
  el("updated").textContent="Staff connection needed";
  el("sync-dot").className="sync-dot error";
  el("sync-text").textContent="Not connected";
}
const installBtn=el("install-app");
const isStandalone=standaloneNow;
function updateInstallButton(){installBtn.classList.toggle("hidden",isStandalone());}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;updateInstallButton();});
installBtn.onclick=async()=>{
  if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;updateInstallButton();return;}
  if(isiOSDevice) alert("On iPhone: keep this private Staff page open, tap Share, choose Add to Home Screen, keep Open as Web App switched on, then tap Add. The private access stays attached to the app.");
  else alert("Use your browser menu and choose Install app or Add to Home screen.");
};
window.addEventListener("appinstalled",updateInstallButton);
updateInstallButton();

if("serviceWorker" in navigator){
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js?v=3");
      await reg.update();
    }catch(e){}
  });
}

el("refresh").onclick=load;
el("search").addEventListener("input",e=>{searchTerm=e.target.value.trim().toLowerCase();render();});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");view=t.dataset.view;render();});

async function load(){
 el("updated").textContent="Updating…";
 try{
   const data=await api({action:"list"});
   rows=data.orders||[];
   el("updated").textContent=rows.length+" pre-order"+(rows.length===1?"":"s")+" • Updated "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
   el("sync-dot").className="sync-dot live";
   el("sync-text").textContent="Live";
   render();
 }catch(error){accessError(error.message);}
}
function filtered(){
 let list;
 if(view==="new")list=rows.filter(r=>r.status==="new");
 else if(view==="kitchen")list=rows.filter(r=>["confirmed","preparing"].includes(r.status));
 else if(view==="completed")list=rows.filter(r=>["complete","cancelled"].includes(r.status));
 else if(view==="upcoming")list=rows.filter(r=>r.booking_time&&new Date(r.booking_time)>new Date()&&!isToday(r.booking_time)&&!["complete","cancelled"].includes(r.status));
 else if(view==="today")list=rows.filter(r=>isToday(orderDate(r))&&!["complete","cancelled"].includes(r.status));
 else list=rows.slice();
 if(searchTerm){
   list=list.filter(r=>("pre-"+r.order_no+" "+(r.booking_name||"")+" "+(r.phone||"")+" "+(r.status||"")).toLowerCase().includes(searchTerm));
 }
 return list.sort((a,b)=>{
   const rank={new:0,confirmed:1,preparing:2,complete:3,cancelled:4};
   const ra=rank[a.status]??9, rb=rank[b.status]??9;
   if(ra!==rb)return ra-rb;
   return new Date(b.created_at)-new Date(a.created_at);
 });
}
function renderStats(){
 const today=rows.filter(r=>isToday(orderDate(r))&&!["complete","cancelled"].includes(r.status));
 const dishes=today.reduce((n,r)=>n+(r.items||[]).reduce((x,i)=>x+(Number(i.qty)||1),0),0);
 el("stats").innerHTML=[
  ["All orders",rows.length],["New",rows.filter(r=>r.status==="new").length],["Today",today.length],["Allergy alerts",rows.filter(r=>r.dietary&&!["complete","cancelled"].includes(r.status)).length]
 ].map(([l,n])=>'<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>').join("");
}
function orderCard(r){
 const items=(r.items||[]).map(i=>'<div class="item"><span>'+esc(i.dish)+'</span><b>× '+esc(i.qty||1)+'</b></div>').join("");
 return '<article class="order" data-id="'+r.id+'">'+
 '<div class="order-head"><div><span class="code">PRE-'+r.order_no+'</span><h3>Pre-order '+esc(lastName(r.booking_name))+'</h3><div class="phone">Booked under '+esc(r.booking_name)+'</div><a class="phone" href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a></div>'+badge(r.status)+'</div>'+
 '<div class="items">'+items+'</div>'+
 (r.dietary?'<div class="allergy"><strong>⚠ Allergy / dietary</strong><br>'+esc(r.dietary)+'</div>':'')+
 '<div class="meta"><div class="mini"><label>Booking date & time</label><input class="booking-time" type="datetime-local" value="'+toInput(r.booking_time)+'"></div><div class="mini"><label>Phone call</label><input class="phone-check" type="text" readonly value="'+(r.phone_confirmed?"Confirmed":"Not marked")+'"></div></div>'+
 '<div class="notes"><textarea class="staff-notes" placeholder="Private staff notes">'+esc(r.staff_notes||"")+'</textarea></div>'+
 '<div class="actions">'+
 '<button class="action good" data-act="phone">✓ Call confirmed</button>'+
 '<button class="action" data-act="save">Save details</button>'+
 '<button class="action primary-action" data-act="confirmed">Confirm order</button>'+
 '<button class="action warn" data-act="preparing">Preparing</button>'+
 '<button class="action good" data-act="complete">Complete</button>'+
 '<button class="action" data-act="print">Print</button>'+
 '<button class="action danger" data-act="cancelled">Cancel</button>'+
 '</div></article>';
}

function buildDocket(r,card){
  const dt=docketDateTime(r.booking_time);
  const notes=(card?.querySelector(".staff-notes")?.value||r.staff_notes||"").trim();
  const items=(r.items||[]).map(i=>'<div class="docket-item"><div class="docket-qty">'+esc(i.qty||1)+' ×</div><div>'+esc(i.dish)+'</div></div>').join("");
  const dietary=(r.dietary||"").trim();
  return '<div class="docket-brand">CANCELLO</div>'+
    '<div class="docket-type">KITCHEN PRE-ORDER</div>'+
    '<div class="docket-order">PRE-'+esc(r.order_no)+'</div>'+
    '<div class="docket-name">Pre-order '+esc(lastName(r.booking_name))+'</div>'+
    '<div class="docket-rule"></div>'+
    '<div class="docket-row"><span>Booked under</span><strong>'+esc(r.booking_name)+'</strong></div>'+
    '<div class="docket-row"><span>Date</span><strong>'+esc(dt.date)+'</strong></div>'+
    '<div class="docket-row"><span>Time</span><strong>'+esc(dt.time)+'</strong></div>'+
    '<div class="docket-rule"></div>'+
    '<div class="docket-section">Items</div>'+items+
    '<div class="docket-section">Allergies / Dietary</div>'+
    (dietary?'<div class="docket-alert">⚠ '+esc(dietary)+'</div>':'<div class="docket-none">NONE DECLARED</div>')+
    '<div class="docket-section">Kitchen Notes</div>'+
    '<div class="docket-notes">'+(notes?esc(notes):'—')+'</div>'+
    '<div class="docket-footer">Printed '+new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+'</div>';
}
async function printDocket(card){
  const id=card.dataset.id;
  const r=rows.find(x=>String(x.id)===String(id));
  if(!r){alert("Order could not be found.");return;}
  const docket=el("print-docket");
  docket.innerHTML=buildDocket(r,card);
  try{await api({action:"update",id,patch:{printed_at:new Date().toISOString()}});}catch(e){}
  window.print();
}

function render(){
 renderStats();
 const titles={all:"All Pre-Orders",today:"Today",new:"New Orders",kitchen:"Kitchen",upcoming:"Upcoming",completed:"Completed"};
 el("view-title").textContent=titles[view]+(view==="all"?" ("+rows.length+")":"");
 const list=filtered();
 
 el("orders").className="orders";
 el("orders").innerHTML=list.length?list.map(orderCard).join(""):'<div class="empty">Nothing here right now.</div>';
 el("orders").querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.closest(".order"),b.dataset.act));
}
async function act(card,action){
 const id=card.dataset.id;
 if(action==="print"){await printDocket(card);return;}
 const patch={};
 if(action==="phone")patch.phone_confirmed=true;
