<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>High Style Match</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0b0d;color:#f1f0ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.load{width:min(420px,calc(100% - 40px));padding:32px;border-top:1px solid #29292e;text-align:center}.mark{display:flex;gap:5px;justify-content:center;margin-bottom:18px}.mark i{display:block;width:28px;height:5px;background:#8a5cff;transform:skewX(-26deg);animation:p 1.1s ease-in-out infinite}.mark i:nth-child(2){animation-delay:.12s}.mark i:nth-child(3){animation-delay:.24s}@keyframes p{50%{opacity:.25;transform:skewX(-26deg) translateX(5px)}}h1{font-size:18px;margin:0 0 6px;letter-spacing:-.03em}p{margin:0;color:#929197;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}@media(prefers-reduced-motion:reduce){.mark i{animation:none}}</style></head><body><main class="load"><div class="mark" aria-hidden="true"><i></i><i></i><i></i></div><h1>High Style Match</h1><p id="status">OPENING DIGITAL DARKROOM…</p></main><script>(async()=>{const s=document.getElementById('status');try{if(!('DecompressionStream'in window))throw new Error('This browser needs an update to run High Style Match.');const paths=['./app-0.gzpart?v=darkroom3','./app-1.gzpart?v=darkroom3','./app-2.gzpart?v=darkroom3'];const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('Unable to load application files.');return new Uint8Array(await r.arrayBuffer())}));const n=parts.reduce((a,b)=>a+b.length,0),all=new Uint8Array(n);let o=0;for(const p of parts){all.set(p,o);o+=p.length}const stream=new Blob([all]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){s.textContent=e.message||'High Style Match could not open.';console.error(e)}})();</script></body></html>
