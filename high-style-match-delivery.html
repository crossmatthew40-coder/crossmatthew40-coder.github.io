<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dceeff">
<title>High Style Match — Client Review & Delivery</title>
<meta name="description" content="High Style Match secure client review and final delivery prototype">
<style>
:root{
  --ink:#123e74;--ink2:#275783;--muted:#6481a0;--blue:#2d7fe8;--blue2:#66b9ff;
  --glass:rgba(255,255,255,.42);--glass2:rgba(255,255,255,.64);--line:rgba(255,255,255,.7);
  --shadow:0 18px 60px rgba(43,91,135,.16);--radius:24px;--danger:#b44d5b;--ok:#2c7a63;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Arial,sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 83% 7%,rgba(255,214,191,.62),transparent 17%),
    radial-gradient(circle at 15% 76%,rgba(255,185,150,.38),transparent 15%),
    radial-gradient(circle at 55% 95%,rgba(255,230,204,.5),transparent 22%),
    linear-gradient(135deg,#bfdcf5 0%,#edf7ff 46%,#cfe7fb 100%);
  background-attachment:fixed;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:218px 1fr;gap:18px;padding:16px}
.sidebar{
  background:linear-gradient(180deg,rgba(36,80,121,.72),rgba(39,90,137,.48));
  border:1px solid rgba(255,255,255,.5);box-shadow:var(--shadow);border-radius:28px;
  color:#fff;padding:26px 18px;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)
}
.brand{font-size:25px;letter-spacing:-.03em;margin:5px 8px 28px}
.nav{display:grid;gap:8px}.nav button{
  border:0;background:transparent;color:rgba(255,255,255,.82);display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:17px;text-align:left
}
.nav button.active,.nav button:hover{background:rgba(255,255,255,.2);color:#fff}.nav .ico{width:22px;text-align:center;font-size:20px}
.side-quote{margin-top:auto;padding:18px 10px;font-size:18px;line-height:1.2;color:rgba(255,255,255,.9);max-width:130px}
.side-quote:after{content:"";display:block;width:18px;border-top:2px solid #fff;margin-top:16px}
.main{padding:1px 0 24px;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.search{height:48px;max-width:520px;flex:1;border:1px solid var(--line);background:rgba(255,255,255,.28);border-radius:17px;display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--muted);backdrop-filter:blur(18px)}
.top-actions{margin-left:auto;display:flex;gap:10px}.icon-btn,.avatar{height:45px;min-width:45px;border:1px solid var(--line);background:rgba(255,255,255,.32);border-radius:15px;color:var(--ink);display:grid;place-items:center}
.avatar{padding:0 14px;display:flex;gap:10px}.avatar-dot{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f7ac67,#315a8f)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:25px 8px 12px}
.hero h1{font-size:42px;letter-spacing:-.045em;margin:0;font-weight:500}.hero p{margin:6px 0 0;color:var(--muted);font-size:16px}
.primary,.secondary,.ghost,.danger{
  border-radius:14px;padding:13px 18px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:600
}
.primary{background:linear-gradient(135deg,#2f87ef,#2d70d6);color:#fff;box-shadow:0 8px 20px rgba(45,127,232,.22)}
.secondary{background:rgba(255,255,255,.55);color:var(--ink);border-color:rgba(255,255,255,.9)}
.ghost{background:transparent;color:var(--ink);border-color:rgba(70,115,158,.22)}
.danger{background:#fff1f3;color:var(--danger);border-color:#ffd7de}
.card{
  background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)
}
.summary{display:grid;grid-template-columns:1.55fr repeat(4,.53fr);gap:12px;margin:0 4px 14px}
.project-card{padding:18px;display:flex;gap:16px;align-items:center}.project-card img{width:120px;height:105px;object-fit:cover;border-radius:14px}.project-card h3{font-size:26px;margin:0 0 4px;font-weight:500}.project-card p{margin:4px 0;color:var(--muted);font-size:13px}
.stat{padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:142px}.stat .label{font-size:13px}.stat strong{font-size:44px;font-weight:500;letter-spacing:-.05em}.stat small{color:var(--muted)}.meter{height:4px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6bd4ff)}
.workflow{margin:0 4px 16px;padding:17px 18px;overflow:auto}.steps{display:flex;min-width:980px;align-items:flex-start}.step{flex:1;text-align:center;position:relative;font-size:12px}.step:not(:last-child):after{content:"";position:absolute;top:17px;left:63%;right:-37%;height:1px;background:rgba(57,105,148,.25)}.step .num{margin:auto;width:36px;height:36px;border:2px solid rgba(255,255,255,.8);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.25);font-size:15px;position:relative;z-index:2}.step.active .num,.step.done .num{background:linear-gradient(135deg,#3a96f6,#2b6dcc);color:#fff}.step span{display:block;margin-top:8px}
.workspace{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,.7fr);gap:14px;margin:0 4px}
.panel{padding:20px}.panel-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}.panel-head h2{font-size:23px;font-weight:500;margin:0}.panel-head p{color:var(--muted);font-size:13px;margin:5px 0 0}.panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.photo{position:relative;border-radius:15px;overflow:hidden;aspect-ratio:4/3;border:2px solid transparent;background:#d4e7f8}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s transform}.photo:hover img{transform:scale(1.025)}.photo.selected{border-color:var(--blue)}.check{position:absolute;left:10px;top:10px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(40,64,88,.45);border:1.5px solid #fff;z-index:2}.photo.selected .check{background:var(--blue)}.tag{position:absolute;right:8px;bottom:8px;padding:6px 9px;border-radius:9px;background:rgba(16,55,92,.66);color:#fff;font-size:11px;backdrop-filter:blur(10px)}
.preview img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:15px}.preview h4{font-size:14px;margin:10px 0 5px;font-weight:500}.preview p{font-size:12px;color:var(--muted);margin:0}.rating{font-size:20px;letter-spacing:3px;margin-top:12px}
.actionbar{display:flex;justify-content:flex-end;gap:10px;margin:16px 4px 0}
.notice{padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.44);border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status-card{padding:20px}.status-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.status-title h3{margin:0;font-size:20px;font-weight:500}.pill{padding:6px 9px;border-radius:99px;font-size:11px;background:#e9f4ff;color:#226bb4}.timeline{margin:18px 0;display:grid;gap:11px}.timeline .row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.dot{width:20px;height:20px;border-radius:50%;border:1px solid rgba(80,120,160,.3);display:grid;place-items:center;font-size:11px}.row.done{color:var(--ink)}.row.done .dot{background:var(--blue);color:#fff;border-color:var(--blue)}
.approved-list{display:grid;gap:10px}.approved-item{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:14px;padding:10px;border:1px solid rgba(255,255,255,.78);background:rgba(255,255,255,.25);border-radius:16px}.approved-item img{width:90px;height:72px;object-fit:cover;border-radius:10px}.approved-item h4{margin:0 0 5px}.approved-item p{margin:0;color:var(--muted);font-size:12px}
.hidden{display:none!important}

/* Modal */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(42,72,104,.22);backdrop-filter:blur(12px);z-index:50;padding:18px}
.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:rgba(240,249,255,.92);border:1px solid #fff;border-radius:28px;box-shadow:0 25px 90px rgba(31,70,105,.28);padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between}.modal h2{font-weight:500;font-size:26px;margin:0}.close{width:38px;height:38px;border:0;border-radius:50%;background:rgba(36,90,140,.08);color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid rgba(91,135,174,.18);background:rgba(255,255,255,.68);border-radius:13px;padding:13px;color:var(--ink);outline:none}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.invite-result{margin-top:18px;padding:18px;border-radius:17px;background:rgba(255,255,255,.67);border:1px solid #fff}.code-big{font-size:35px;letter-spacing:.22em;margin:8px 0;font-weight:500}.tiny{font-size:12px;color:var(--muted)}

/* client */
.client-shell{min-height:100vh;padding:24px}.client-wrap{width:min(1240px,100%);margin:auto}.client-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.client-brand{font-size:22px}.secure{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}
.gate{min-height:calc(100vh - 100px);display:grid;place-items:center}.gate-card{width:min(620px,100%);text-align:center;padding:44px 28px}.gate-card h1{font-size:46px;letter-spacing:-.05em;font-weight:500;margin:0}.gate-card p{color:var(--muted);line-height:1.55}.otp{display:flex;justify-content:center;gap:8px;margin:28px 0}.digit{
  width:68px;height:78px;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);
  background:rgba(255,255,255,.52);border:0;outline:0;text-align:center;font-size:30px;color:var(--ink);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.95);transition:.2s
}.digit:focus,.digit.filled{background:rgba(255,255,255,.86);filter:drop-shadow(0 8px 14px rgba(45,127,232,.16))}
.gate-error{color:var(--danger);min-height:20px;font-size:13px}.gallery-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:18px}.gallery-head h1{font-size:38px;font-weight:500;letter-spacing:-.04em;margin:0}.gallery-head p{color:var(--muted);margin:5px 0 0}.progressbox{margin-left:auto;text-align:right}.progressbox strong{font-size:22px}.review-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.review-card{overflow:hidden;position:relative}.review-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.review-info{padding:12px}.review-name{font-size:12px;color:var(--muted)}.review-actions{display:flex;gap:8px;margin-top:10px}.mini{border:1px solid rgba(70,110,150,.18);background:rgba(255,255,255,.52);color:var(--ink);border-radius:11px;padding:9px 11px;flex:1}.mini.liked{background:#e6f2ff;color:#155ba8;border-color:#b6d9ff}.note-area{width:100%;margin-top:8px;border:1px solid rgba(70,110,150,.18);background:rgba(255,255,255,.45);border-radius:11px;padding:10px;min-height:62px;resize:vertical;color:var(--ink)}.watermark{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-12deg);font-size:15px;letter-spacing:.18em;color:rgba(255,255,255,.48);text-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap}.client-bottom{position:sticky;bottom:14px;margin-top:22px;padding:13px;display:flex;align-items:center;gap:12px;justify-content:flex-end;background:rgba(239,248,255,.78)}.client-bottom .summary-text{margin-right:auto;font-size:13px;color:var(--muted)}
.final .watermark{display:none}.download{margin-top:8px;width:100%}

/* toasts */
.toast{position:fixed;right:22px;bottom:22px;background:#133f73;color:#fff;padding:13px 16px;border-radius:13px;box-shadow:0 14px 40px rgba(19,63,115,.25);z-index:99;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}
@media(max-width:1120px){.summary{grid-template-columns:1fr 1fr 1fr}.project-card{grid-column:1/-1}.workspace{grid-template-columns:1fr}.gallery,.review-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){
  .shell{display:block;padding:10px}.sidebar{height:auto;position:static;border-radius:21px;padding:14px;margin-bottom:10px}.brand{margin:2px 6px 12px;font-size:20px}.nav{grid-template-columns:repeat(5,1fr);overflow:auto}.nav button{padding:10px;justify-content:center}.nav button span:last-child{display:none}.side-quote{display:none}.topbar{display:none}.hero{padding:16px 4px}.hero h1{font-size:31px}.summary{grid-template-columns:1fr 1fr}.project-card{grid-column:1/-1}.stat{min-height:120px}.stat strong{font-size:36px}.gallery,.review-grid{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.panel-head{display:block}.panel-head .right{margin-top:12px}.fields{grid-template-columns:1fr}.client-shell{padding:14px}.gate-card{padding:32px 14px}.gate-card h1{font-size:35px}.otp{gap:4px}.digit{width:49px;height:62px;font-size:24px}.gallery-head{display:block}.progressbox{text-align:left;margin-top:12px}.client-bottom{align-items:stretch;flex-direction:column}.client-bottom .summary-text{margin:0}.status-grid{grid-template-columns:1fr}.approved-item{grid-template-columns:72px 1fr}.approved-item img{width:72px;height:60px}.approved-item .secondary{grid-column:1/-1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const PHOTOS = Array.from({length:12},(_,i)=>({
 id:i+1,
 name:\`HSM_\${String(784+i).padStart(4,'0')}.RAW\`,
 src:\`https://picsum.photos/seed/highstyle-food-\${i+11}/1000/760\`,
 rating:[5,4,5,4,5,5,4,5,4,5,5,4][i]
}));
const defaults={
 selected:[1,2,3,5,6,8,9,10],
 reviewCode:"482691",finalCode:"731204",
 email:"",client:"",message:"Hi — please review the selected photographs and mark the images you'd like edited.",
 liked:[],notes:{},reviewSubmitted:false,finalSent:false,reviewSent:false
};
let state=Object.assign({},defaults,JSON.parse(localStorage.getItem("hsm_delivery_state")||"{}"));
const save=()=>localStorage.setItem("hsm_delivery_state",JSON.stringify(state));
const toast=(m)=>{const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)};
const qs=new URLSearchParams(location.search);
const mode=qs.get("mode")||"photographer";
const stage=qs.get("stage")||"review";
const app=document.getElementById("app");

function selectedPhotos(){return PHOTOS.filter(p=>state.selected.includes(p.id))}
function likedPhotos(){return PHOTOS.filter(p=>state.liked.includes(p.id))}
function projectUrl(stageName){return location.origin+location.pathname+"?mode=client&stage="+stageName}
function code(){return stage==="final"?state.finalCode:state.reviewCode}

function renderPhotographer(view="best"){
 app.innerHTML=\`
 <div class="shell">
  <aside class="sidebar">
   <div class="brand">High Style Match</div>
   <div class="nav">
    <button class="\${view==='best'?'active':''}" onclick="renderPhotographer('best')"><span class="ico">⌂</span><span>Home</span></button>
    <button><span class="ico">▢</span><span>Projects</span></button>
    <button><span class="ico">◉</span><span>Library</span></button>
    <button><span class="ico">✦</span><span>AI Tools</span></button>
    <button class="\${view==='review'?'active':''}" onclick="renderPhotographer('review')"><span class="ico">✓</span><span>Client Review</span></button>
    <button class="\${view==='approved'?'active':''}" onclick="renderPhotographer('approved')"><span class="ico">✎</span><span>Approved</span></button>
    <button class="\${view==='delivery'?'active':''}" onclick="renderPhotographer('delivery')"><span class="ico">↑</span><span>Delivery</span></button>
   </div>
   <div class="side-quote">Great<br>photos<br>move<br>people.</div>
  </aside>
  <main class="main">
   <div class="topbar"><div class="search">⌕ <span>Search projects, photos, or prompts...</span></div><div class="top-actions"><button class="icon-btn">☼</button><button class="icon-btn">♧</button><div class="avatar"><span class="avatar-dot"></span>Matt⌄</div></div></div>
   <div class="hero"><div><h1>\${view==='best'?'Good morning, Matt':view==='review'?'Client Review':view==='approved'?'Approved for Edit':'Final Delivery'}</h1><p>\${view==='best'?'Turn your vision into remarkable photos.':view==='review'?'Track what the client has selected before editing.':view==='approved'?'Only the client-approved photographs are shown here.':'Send completed photographs securely to your client.'}</p></div><button class="primary" onclick="openSend()">＋ New Client Review</button></div>
   \${summary()}
   \${workflow(view)}
   \${view==='best'?bestView():view==='review'?reviewStatusView():view==='approved'?approvedView():deliveryView()}
  </main>
 </div>\`;
}
function summary(){
 return \`<section class="summary">
 <div class="card project-card"><img src="\${PHOTOS[0].src}"><div><h3>Autumn Menu Shoot</h3><p>Food &nbsp;•&nbsp; 142 photos &nbsp;•&nbsp; Updated 2 hours ago</p><p>Seasonal dishes, warm tones, natural light. Hero shots for web, menu and social.</p></div></div>
 <div class="card stat"><div class="label">☷ &nbsp;Shot list</div><strong>24</strong><small>shots</small><div class="meter"><span style="width:82%"></span></div></div>
 <div class="card stat"><div class="label">⇧ &nbsp;Photos uploaded</div><strong>142</strong><small>photos</small><div class="meter"><span style="width:100%"></span></div></div>
 <div class="card stat"><div class="label">☆ &nbsp;Best Picks</div><strong>\${state.selected.length}</strong><small>selected</small><div class="meter"><span style="width:70%"></span></div></div>
 <div class="card stat"><div class="label">✓ &nbsp;Client picks</div><strong>\${state.liked.length}</strong><small>approved</small><div class="meter"><span style="width:\${Math.min(100,state.liked.length/Math.max(1,state.selected.length)*100)}%"></span></div></div>
 </section>\`;
}
function workflow(view){
 const labels=["Shot List","Upload Photos","Smart Cull","AI Vision","Best Picks","Client Review","Approved for Edit","Editing","Final Delivery"];
 let active=view==="best"?5:view==="review"?6:view==="approved"?7:9;
 return \`<section class="card workflow"><div class="steps">\${labels.map((x,i)=>\`<div class="step \${i+1<active?'done':''} \${i+1===active?'active':''}"><div class="num">\${i+1<active?'✓':i+1}</div><span>\${x}</span></div>\`).join("")}</div></section>\`;
}
function bestView(){
 return \`<div class="workspace">
  <section class="card panel">
   <div class="panel-head"><div><h2>Best Picks</h2><p>Select the photographs you want the client to review before editing.</p></div><div class="right"><button class="secondary" onclick="toggleAll()">□ Select All</button><button class="primary" onclick="openSend()">↗ Send to Client</button></div></div>
   <div class="gallery">\${PHOTOS.map(photoTile).join("")}</div>
  </section>
  <aside class="card panel preview"><img src="\${selectedPhotos()[0]?.src||PHOTOS[0].src}"><h4>\${selectedPhotos()[0]?.name||PHOTOS[0].name}</h4><p>6016 × 4008 &nbsp;•&nbsp; 26.4 MB &nbsp;•&nbsp; f/2.8 &nbsp;•&nbsp; 1/125s</p><div class="rating">★★★★★</div><div class="notice" style="margin-top:16px"><b>New workflow:</b><br>Send these Best Picks to the client first. They can like images and add notes, but cannot download the proofs.</div></aside>
 </div><div class="actionbar"><button class="primary" onclick="openSend()">Send \${state.selected.length} Best Picks to Client →</button></div>\`;
}
function photoTile(p){
 const sel=state.selected.includes(p.id);
 return \`<div class="photo \${sel?'selected':''}" onclick="togglePhoto(\${p.id})"><img src="\${p.src}" alt=""><div class="check">\${sel?'✓':''}</div><div class="tag">\${p.rating}★</div></div>\`;
}
function togglePhoto(id){state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];save();renderPhotographer('best')}
function toggleAll(){state.selected=state.selected.length===PHOTOS.length?[]:PHOTOS.map(p=>p.id);save();renderPhotographer('best')}

function reviewStatusView(){
 const sent=state.reviewSent;
 return \`<div class="status-grid">
  <section class="card status-card"><div class="status-title"><h3>01 — Client Review</h3><span class="pill">\${state.reviewSubmitted?'Submitted':sent?'In progress':'Not sent'}</span></div>
   <div class="timeline">
    <div class="row \${sent?'done':''}"><span class="dot">\${sent?'✓':'1'}</span>Review sent</div>
    <div class="row \${sent?'done':''}"><span class="dot">\${sent?'✓':'2'}</span>Secure link created</div>
    <div class="row \${state.reviewSubmitted?'done':''}"><span class="dot">\${state.reviewSubmitted?'✓':'3'}</span>\${state.liked.length} of \${state.selected.length} selected</div>
    <div class="row \${state.reviewSubmitted?'done':''}"><span class="dot">\${state.reviewSubmitted?'✓':'4'}</span>Review submitted</div>
   </div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="openSend()">\${sent?'Resend / View Access':'Send Review'}</button><button class="secondary" onclick="window.open('\${projectUrl("review")}','_blank')">Open Client Preview</button></div>
  </section>
  <section class="card status-card"><div class="status-title"><h3>Client activity</h3><span class="pill">\${state.email||'No recipient'}</span></div>
   <div class="timeline"><div class="row done"><span class="dot">✓</span>\${state.selected.length} proof images prepared</div><div class="row \${state.liked.length?'done':''}"><span class="dot">\${state.liked.length?'✓':'•'}</span>\${state.liked.length} liked</div><div class="row \${Object.keys(state.notes).length?'done':''}"><span class="dot">\${Object.keys(state.notes).length?'✓':'•'}</span>\${Object.keys(state.notes).length} images with notes</div></div>
  </section>
 </div>\`;
}
function approvedView(){
 const picks=likedPhotos();
 return \`<section class="card panel"><div class="panel-head"><div><h2>Approved for Edit</h2><p>Client-approved photographs and feedback are kept together here.</p></div><div class="right"><button class="secondary">Open Lightroom</button><button class="secondary">Open Photoshop</button></div></div>
 \${!picks.length?'<div class="notice">No client selections yet. Open Client Review to test the approval flow.</div>':'<div class="approved-list">'+picks.map(p=>\`<div class="approved-item"><img src="\${p.src}"><div><h4>\${p.name} &nbsp; ♥ Client selected</h4><p>\${state.notes[p.id]?'“'+escapeHtml(state.notes[p.id])+'”':'No note added.'}</p></div><button class="secondary" onclick="toast('Marked complete')">Mark Complete</button></div>\`).join("")+'</div>'}
 <div class="actionbar"><button class="primary" onclick="renderPhotographer('delivery')">Continue to Final Delivery →</button></div></section>\`;
}
function deliveryView(){
 return \`<div class="status-grid">
  <section class="card status-card"><div class="status-title"><h3>02 — Final Delivery</h3><span class="pill">\${state.finalSent?'Sent':'Ready when edits are complete'}</span></div>
   <p style="color:var(--muted);font-size:13px;line-height:1.5">The final gallery uses a fresh verification code. Downloads are enabled only in this stage.</p>
   <div class="timeline"><div class="row \${state.finalSent?'done':''}"><span class="dot">\${state.finalSent?'✓':'1'}</span>Final gallery sent</div><div class="row \${state.finalSent?'done':''}"><span class="dot">\${state.finalSent?'✓':'2'}</span>New verification code created</div><div class="row"><span class="dot">3</span>Client verifies and downloads</div></div>
   <button class="primary" onclick="sendFinal()">Send Final Gallery</button>
   \${state.finalSent?'<button class="secondary" style="margin-left:8px" onclick="window.open(\\''+projectUrl('final')+'\\',\\'_blank\\')">Open Client Final Gallery</button>':''}
  </section>
  <section class="card status-card"><h3 style="font-weight:500;margin-top:0">Delivery permissions</h3><div class="timeline"><div class="row done"><span class="dot">✓</span>Secure code required</div><div class="row done"><span class="dot">✓</span>Original-quality download allowed</div><div class="row done"><span class="dot">✓</span>Individual and download-all actions</div><div class="row done"><span class="dot">✓</span>Client favourites retained</div></div></section>
 </div>\`;
}
function sendFinal(){
 state.finalSent=true;state.finalCode=String(Math.floor(100000+Math.random()*900000));save();renderPhotographer('delivery');
 setTimeout(()=>showFinalResult(),100);
}
function showFinalResult(){
 app.insertAdjacentHTML("beforeend",\`<div class="overlay" id="finalOverlay"><div class="modal"><div class="modal-head"><h2>Final gallery ready</h2><button class="close" onclick="document.getElementById('finalOverlay').remove()">×</button></div><div class="invite-result"><div class="tiny">FINAL DELIVERY CODE</div><div class="code-big">\${state.finalCode}</div><div class="tiny">Prototype mode: the email provider is not connected yet, so the code is shown here for testing.</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="primary" onclick="window.open('\${projectUrl("final")}','_blank')">Open Final Gallery</button><button class="secondary" onclick="navigator.clipboard.writeText('\${projectUrl("final")}');toast('Gallery link copied')">Copy Link</button></div></div></div></div>\`);
}

function openSend(){
 const count=state.selected.length;
 app.insertAdjacentHTML("beforeend",\`<div class="overlay" id="sendOverlay"><div class="modal"><div class="modal-head"><h2>Send Client Review</h2><button class="close" onclick="document.getElementById('sendOverlay').remove()">×</button></div>
 <div class="notice" style="margin-top:14px"><b>Autumn Menu Shoot</b> &nbsp;•&nbsp; \${count} photographs selected<br>The client can like images and leave notes. Downloads are disabled in review.</div>
 <div class="fields">
  <div class="field"><label>Client name</label><input id="clientName" value="\${escapeAttr(state.client)}" placeholder="Client name"></div>
  <div class="field"><label>Client email</label><input id="clientEmail" type="email" value="\${escapeAttr(state.email)}" placeholder="client@example.com"></div>
  <div class="field"><label>Gallery expiry</label><select><option>7 days</option><option>14 days</option><option>30 days</option></select></div>
  <div class="field"><label>Proof watermark</label><select><option>On — High Style Client Proof</option><option>Off</option></select></div>
  <div class="field full"><label>Message</label><textarea id="clientMessage">\${escapeHtml(state.message)}</textarea></div>
 </div>
 <div id="inviteResult"></div>
 <div class="modal-actions"><button class="secondary" onclick="document.getElementById('sendOverlay').remove()">Cancel</button><button class="primary" onclick="generateInvite()">↗ Send Review</button></div></div></div>\`);
}
function generateInvite(){
 const email=document.getElementById("clientEmail").value.trim(), client=document.getElementById("clientName").value.trim();
 if(!email){toast("Add the client email first");return}
 state.email=email;state.client=client;state.message=document.getElementById("clientMessage").value;
 state.reviewCode=String(Math.floor(100000+Math.random()*900000));state.reviewSent=true;save();
 document.getElementById("inviteResult").innerHTML=\`<div class="invite-result"><div class="tiny">SECURE REVIEW CREATED</div><div class="code-big">\${state.reviewCode}</div><div class="tiny">Prototype mode: email delivery needs a transactional email backend. The full client journey is working here for testing.</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="primary" onclick="window.open('\${projectUrl("review")}','_blank')">Open Client Review</button><button class="secondary" onclick="navigator.clipboard.writeText('\${projectUrl("review")}');toast('Review link copied')">Copy Link</button><button class="secondary" onclick="navigator.clipboard.writeText('\${state.reviewCode}');toast('Code copied')">Copy Code</button></div></div>\`;
}

function renderClient(){
 app.innerHTML=\`<div class="client-shell"><div class="client-wrap"><div class="client-top"><div class="client-brand">High Style Match</div><div class="secure">◉ Secure \${stage==="final"?"Final Delivery":"Client Review"}</div></div><div id="clientContent"></div></div></div>\`;
 renderGate();
}
function renderGate(){
 document.getElementById("clientContent").innerHTML=\`<div class="gate"><section class="card gate-card"><div class="tiny">\${stage==="final"?"FINAL DELIVERY":"PRIVATE CLIENT GALLERY"}</div><h1>Your photos are ready.</h1><p>Enter the six-digit verification code sent to <b>\${state.email||"your email"}</b> to access your private gallery.</p><div class="otp">\${Array.from({length:6},(_,i)=>\`<input class="digit" inputmode="numeric" maxlength="1" data-i="\${i}" aria-label="Digit \${i+1}">\`).join("")}</div><div class="gate-error" id="gateError"></div><button class="ghost" onclick="toast('A new code would be sent by the production email service')">Resend code</button><p class="tiny">For this working prototype, use code <b>\${code()}</b>.</p></section></div>\`;
 const inputs=[...document.querySelectorAll(".digit")];
 inputs.forEach((inp,i)=>{
  inp.addEventListener("input",e=>{e.target.value=e.target.value.replace(/\\D/g,"").slice(0,1);e.target.classList.toggle("filled",!!e.target.value);if(e.target.value&&inputs[i+1])inputs[i+1].focus();checkOtp()});
  inp.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!e.target.value&&inputs[i-1])inputs[i-1].focus()});
  inp.addEventListener("paste",e=>{const d=(e.clipboardData.getData("text")||"").replace(/\\D/g,"").slice(0,6);if(d.length){e.preventDefault();d.split("").forEach((n,j)=>{if(inputs[j]){inputs[j].value=n;inputs[j].classList.add("filled")}});checkOtp()}});
 });
 inputs[0]?.focus();
}
function checkOtp(){
 const val=[...document.querySelectorAll(".digit")].map(x=>x.value).join("");
 if(val.length<6)return;
 if(val===code()){setTimeout(()=>stage==="final"?renderFinalGallery():renderReviewGallery(),250)}
 else{document.getElementById("gateError").textContent="That code is not correct. Please try again."}
}
function renderReviewGallery(){
 const pics=selectedPhotos();
 document.getElementById("clientContent").innerHTML=\`<div class="gallery-head"><div><div class="tiny">CLIENT REVIEW — BEFORE EDITING</div><h1>Autumn Menu Shoot</h1><p>\${pics.length} photographs • Choose the images you'd like High Style to edit.</p></div><div class="progressbox"><strong id="reviewCount">\${state.liked.length} / \${pics.length}</strong><div class="tiny">selected</div></div></div>
 <div class="review-grid">\${pics.map(reviewCard).join("")}</div>
 <div class="card client-bottom"><div class="summary-text"><b id="bottomCount">\${state.liked.length}</b> photographs selected. Add notes directly to any image.</div><button class="secondary" onclick="toast('Your progress is saved automatically')">Save & Return Later</button><button class="primary" onclick="submitReview()">Submit Selections →</button></div>\`;
}
function reviewCard(p){
 const liked=state.liked.includes(p.id), note=state.notes[p.id]||"";
 return \`<article class="card review-card"><div style="position:relative"><img src="\${p.src}" draggable="false" oncontextmenu="return false"><div class="watermark">HIGH STYLE — CLIENT PROOF</div></div><div class="review-info"><div class="review-name">\${p.name}</div><div class="review-actions"><button class="mini \${liked?'liked':''}" onclick="likePhoto(\${p.id},this)">\${liked?'♥ Liked':'♡ Like'}</button><button class="mini" onclick="this.closest('.review-info').querySelector('textarea').focus()">✎ Note</button></div><textarea class="note-area" placeholder="Add a note for the photographer…" oninput="setNote(\${p.id},this.value)">\${escapeHtml(note)}</textarea></div></article>\`;
}
function likePhoto(id,btn){
 state.liked=state.liked.includes(id)?state.liked.filter(x=>x!==id):[...state.liked,id];save();
 const on=state.liked.includes(id);btn.classList.toggle("liked",on);btn.textContent=on?"♥ Liked":"♡ Like";
 document.getElementById("reviewCount").textContent=\`\${state.liked.length} / \${selectedPhotos().length}\`;document.getElementById("bottomCount").textContent=state.liked.length
}
function setNote(id,v){if(v.trim())state.notes[id]=v;else delete state.notes[id];save()}
function submitReview(){
 if(!state.liked.length){toast("Like at least one photograph first");return}
 state.reviewSubmitted=true;save();
 document.getElementById("clientContent").innerHTML=\`<div class="gate"><section class="card gate-card"><div style="font-size:48px">✓</div><h1>Selections sent.</h1><p>High Style has received your \${state.liked.length} choices and any notes you've added. These photographs are now ready to move into editing.</p><div class="notice"><b>\${state.liked.length} photographs approved for editing</b><br>\${Object.keys(state.notes).length} images include client notes.</div></section></div>\`;
}
function renderFinalGallery(){
 const pics=likedPhotos().length?likedPhotos():selectedPhotos();
 document.getElementById("clientContent").innerHTML=\`<div class="gallery-head"><div><div class="tiny">FINAL DELIVERY</div><h1>Autumn Menu Shoot</h1><p>Your finished High Style photographs are ready to download.</p></div><div class="progressbox"><button class="primary" onclick="downloadAll()">↓ Download All</button></div></div>
 <div class="review-grid final">\${pics.map(p=>\`<article class="card review-card"><img src="\${p.src}" alt=""><div class="review-info"><div class="review-name">\${p.name.replace('.RAW','.JPG')}</div><button class="primary download" onclick="downloadPhoto('\${p.src}','\${p.name.replace('.RAW','.JPG')}')">↓ Download</button></div></article>\`).join("")}</div>\`;
}
async function downloadPhoto(src,name){
 try{const r=await fetch(src);const b=await r.blob();const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){window.open(src,"_blank")}
}
function downloadAll(){toast("Production version will package selected finals into a ZIP. Use individual Download buttons in this prototype.")}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(s){return escapeHtml(s)}
if(mode==="client")renderClient();else renderPhotographer("best");
</script>
</body>
</html>
