<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Digital Business Card</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./premium.css">
  <link rel="stylesheet" href="./customer-view-sync.css">
</head>
<body>
  <main class="shell" id="app">
    <section class="hero">
      <div class="eyebrow" id="eyebrow">Digital business card</div>
      <div class="brand-mark" id="brandMark" aria-hidden="true"></div>
      <h1 id="name"></h1>
      <p class="person" id="person"></p>
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
      <p class="location" id="location"></p>
    </section>

    <section class="stack" id="actions"></section>

    <a class="action hidden" id="saveContact" href="#">
      <span class="action-copy">
        <span class="action-label">Contact</span>
        <span class="action-value">Save to Phone</span>
      </span>
      <span class="arrow">＋</span>
    </a>

    <section class="section" id="servicesSection">
      <h2 class="section-title">Services</h2>
      <div class="chips" id="services"></div>
    </section>

    <section class="section" id="socialSection">
      <h2 class="section-title">Connect</h2>
      <div class="socials" id="socials"></div>
    </section>

    <section class="section" id="reviewSection">
      <h2 class="section-title">What people say</h2>
      <blockquote class="quote" id="review"></blockquote>
    </section>

    <section class="section" id="gallerySection">
      <h2 class="section-title">Gallery</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <footer class="footer" id="footer">Powered by High Style Cards</footer>
  </main>

  <script src="./brands.js"></script>
  <script src="./snapshot-loader.js"></script>
  <script src="./app.js"></script>
  <script src="./smart-actions.js"></script>
  <script src="./font-theme.js"></script>
  <script src="./brand-mirror.js"></script>
  <script src="./tripadvisor-reviews.js"></script>
  <script src="./animations-buttons.js"></script>
</body>
</html>
