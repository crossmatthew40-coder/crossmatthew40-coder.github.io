<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Admin — High Style Match</title><script src="../auth-config.js"></script><script src="../app-config.js"></script><script src="../cloud.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding:22px}.wrap{max-width:1180px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 0 24px}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border:1px solid #fff;border-radius:10px;display:grid;place-items:center}.mark i{width:18px;height:4px;background:#fff;border-radius:99px;box-shadow:0 -7px #fff,0 7px #fff;transform:skewX(-22deg)}a{color:#aaa;text-decoration:none;font-size:12px}.head h1{font-size:34px;letter-spacing:-.045em;margin:6px 0}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#999;font-weight:850}.head p{color:#999;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat,.panel{border:1px solid #292929;background:#0b0b0b;border-radius:14px}.stat{padding:16px}.stat span{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.08em}.stat b{font-size:26px;display:block;margin-top:7px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px}.panel h2{font-size:16px;margin:0 0 12px}.row{padding:10px 0;border-top:1px solid #222}.row:first-of-type{border-top:0}.row strong{display:block;font-size:12px}.row small{color:#888;display:block;margin-top:3px;line-height:1.4}.empty,.status{color:#999;font-size:12px;line-height:1.5;padding:12px 0}.btn{border:1px solid #333;background:#111;color:#fff;border-radius:9px;padding:9px 11px;font-weight:750;cursor:pointer}.btn.primary{background:#fff;color:#000;border-color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:520px){body{padding:13px}.grid{grid-template-columns:1fr 1fr}.head h1{font-size:28px}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="mark"><i></i></div><div><b>High Style Match</b><div style="font-size:10px;color:#888">Admin Console</div></div></div><div class="actions"><a class="btn" href="../invite/">Invite customer</a><a class="btn" href="../">Back to app</a></div></div><section class="head"><div class="eyebrow">Production</div><h1>Admin overview.</h1><p>Users, projects, invitations, errors and billing status.</p></section><div id="gate" class="status">Checking admin access…</div><section id="dashboard" style="display:none"><div class="grid"><div class="stat"><span>Users</span><b id="users">0</b></div><div class="stat"><span>Projects</span><b id="projects">0</b></div><div class="stat"><span>Pending invites</span><b id="invites">0</b></div><div class="stat"><span>Errors 24h</span><b id="errors">0</b></div><div class="stat"><span>Subscriptions</span><b id="subs">0</b></div></div><div class="panels"><div class="panel"><h2>Recent errors</h2><div id="errorList" class="empty">No recent errors.</div></div><div class="panel"><h2>Recent invitations</h2><div id="inviteList" class="empty">No invitations.</div></div></div></section></div><script>(async()=>{const gate=document.getElementById('gate'),dash=document.getElementById('dashboard');if(!HSMCloud.configured()){gate.textContent='Cloud is not configured yet. Connect Supabase before using the admin console.';return}try{const session=await HSMCloud.getSession();if(!session){location.href='../account/?returnTo=/high-style-match/admin/';return}const profile=await HSMCloud.getProfile();if(profile.role!=='admin'){gate.textContent='This account does not have admin access.';return}const o=await HSMCloud.adminOverview();users.textContent=o.users;projects.textContent=o.projects;invites.textContent=o.pendingInvites;errors.textContent=o.errors24h;subs.textContent=o.activeSubscriptions;const sb=await HSMCloud.getClient();const [{data:errs},{data:invs}]=await Promise.all([sb.from('app_errors').select('id,message,page_url,created_at,resolved_at').order('created_at',{ascending:false}).limit(10),sb.from('invitations').select('id,email,permission,status,created_at,project_id').order('created_at',{ascending:false}).limit(10)]);errorList.innerHTML=(errs||[]).map(e=>`<div class="row"><strong>${escapeHtml(e.message)}</strong><small>${new Date(e.created_at).toLocaleString()} · ${escapeHtml(e.page_url||'')}</small></div>`).join('')||'<div class="empty">No recent errors.</div>';inviteList.innerHTML=(invs||[]).map(i=>`<div class="row"><strong>${escapeHtml(i.email)} · ${escapeHtml(i.status)}</strong><small>${escapeHtml(i.permission)} · ${new Date(i.created_at).toLocaleString()}</small></div>`).join('')||'<div class="empty">No invitations.</div>';gate.style.display='none';dash.style.display='block'}catch(e){gate.textContent=e.message}function escapeHtml(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}})();</script></body></html>
