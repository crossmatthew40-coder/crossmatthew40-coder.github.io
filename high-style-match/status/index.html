<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Status — High Style Match</title><script src="../auth-config.js"></script><script src="../app-config.js"></script><script src="../cloud.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding:22px}.wrap{max-width:850px;margin:20px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.top a{color:#999;text-decoration:none;font-size:12px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#999;font-weight:850}h1{font-size:34px;letter-spacing:-.045em;margin:7px 0 8px}p{color:#999;font-size:12px;line-height:1.5}.grid{display:grid;gap:9px;margin-top:20px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px;align-items:center;border:1px solid #292929;background:#0b0b0b;border-radius:12px;padding:14px}.row strong{font-size:12px}.row small{display:block;color:#777;margin-top:4px}.badge{border:1px solid #444;background:#151515;color:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800}.badge.ok{background:#fff;color:#000;border-color:#fff}.btn{margin-top:15px;border:1px solid #fff;background:#fff;color:#000;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">Diagnostics</div><h1>System status.</h1><p>Checks the browser, local workspace and production cloud connection.</p></div><a href="../">Back to app</a></div><div id="checks" class="grid"></div><button class="btn" onclick="location.reload()">Run again</button></main><script>(async()=>{const out=document.getElementById('checks');const add=(name,detail,ok)=>out.insertAdjacentHTML('beforeend',`<div class="row"><div><strong>${name}</strong><small>${detail}</small></div><span class="badge ${ok?'ok':''}">${ok?'OK':'CHECK'}</span></div>`);add('Browser online',navigator.onLine?'Internet connection available':'Offline mode active',navigator.onLine);let ls=false;try{localStorage.setItem('__hsm_status','1');localStorage.removeItem('__hsm_status');ls=true}catch{}add('Local project storage',ls?'localStorage is writable':'Browser storage is blocked',ls);add('IndexedDB',('indexedDB'in window)?'Photo preview database available':'IndexedDB unavailable','indexedDB'in window);let sw=false;if('serviceWorker'in navigator){try{const r=await navigator.serviceWorker.register('/high-style-match/sw.js');sw=!!r}catch{}}add('Offline app shell',sw?'Service worker registered':'Service worker not active',sw);add('Cloud configuration',HSMCloud.configured()?'Supabase public configuration present':'Not configured — local mode only',HSMCloud.configured());if(HSMCloud.configured()){try{const sb=await HSMCloud.getClient();const {error}=await sb.from('profiles').select('id',{head:true,count:'exact'}).limit(1);add('Supabase API',error?error.message:'Database reachable',!error);const session=await HSMCloud.getSession();add('Signed-in session',session?session.user.email:'No account signed in',!!session)}catch(e){add('Supabase API',e.message,false)}}add('Production runtime',window.HSM_APP?.version||'Configuration missing',!!window.HSM_APP)})();</script></body></html>
