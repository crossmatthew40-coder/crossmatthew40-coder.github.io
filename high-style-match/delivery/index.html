<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Delivery — High Style Match</title>
<style>
:root{--bg:#000;--panel:#0b0b0b;--line:#292929;--ink:#fff;--muted:#9a9a9a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100vh}.shell{max-width:920px;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:116px;height:38px;display:block;object-fit:contain}.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#929292}.hero{padding:74px 0 28px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:850;color:#fff}.hero h1{font-size:clamp(42px,7vw,68px);line-height:.94;letter-spacing:-.055em;margin:10px 0 12px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.card{background:#0b0b0b;border:1px solid var(--line);border-radius:5px;padding:20px}.status{color:var(--muted);font-size:12px;line-height:1.55}.password{display:none;gap:10px;margin-top:16px}.password.on{display:flex}.password input{flex:1;background:#050505;color:#fff;border:1px solid #333;border-radius:3px;padding:11px}.password input:focus{outline:none;border-color:#fff;box-shadow:0 0 0 1px #fff}.btn{border-radius:3px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000;border:1px solid #fff}.primary:hover{background:#e8e8e8}.secondary{background:#111;color:#fff;border:1px solid #333}.secondary:hover{background:#1a1a1a}.meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;color:#8f8f8f;font-size:10px}.files{display:grid;gap:9px;margin-top:16px}.file{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;background:#080808;border:1px solid #292929;border-radius:3px;padding:12px}.file strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file small{display:block;color:#858585;font-size:10px;margin-top:4px}.empty{padding:34px 18px;text-align:center;color:#858585;border:1px dashed #333;border-radius:4px}.error{color:#fff}@media(max-width:620px){.shell{padding:18px 14px}.hero{padding-top:52px}.password{flex-direction:column}.file{grid-template-columns:1fr}.file .btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><img src="../../high-style-logo.svg" alt="High Style"><span>Match Delivery</span></div></header>
  <section class="hero"><div class="eyebrow">Client delivery</div><h1 id="title">Your photographs.</h1><p id="intro">Secure delivery from High Style Match.</p></section>
  <section class="card">
    <div id="status" class="status">Loading delivery…</div>
    <div id="password" class="password"><input id="passwordInput" type="password" placeholder="Delivery password"><button id="unlock" class="btn primary">Unlock</button></div>
    <div id="meta" class="meta"></div>
    <div id="files" class="files"></div>
  </section>
</div>
<script src="../delivery-config.js"></script>
<script>
(()=>{
  const cfg=window.HSM_DELIVERY||{},api=(cfg.apiBase||'').replace(/\/+$/,'');
  const qs=new URLSearchParams(location.search),id=qs.get('id')||'',token=qs.get('token')||'';
  const status=document.getElementById('status'),files=document.getElementById('files'),meta=document.getElementById('meta'),pwWrap=document.getElementById('password'),pw=document.getElementById('passwordInput');
  let delivery=null,password='';
  const fmt=n=>n<1024**2?`${(n/1024).toFixed(1)} KB`:n<1024**3?`${(n/1024**2).toFixed(1)} MB`:`${(n/1024**3).toFixed(2)} GB`;
  function setError(text){status.className='status error';status.textContent=text;files.innerHTML=''}
  async function load(){
    if(!api)return setError('This delivery server has not been connected yet.');
    if(!id||!token)return setError('This delivery link is incomplete.');
    status.className='status';status.textContent='Loading delivery…';
    try{
      const res=await fetch(`${api}/api/deliveries/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`,{headers:password?{'X-HSM-Delivery-Password':password}:{}});
      const data=await res.json().catch(()=>({}));
      if(res.status===401&&data.error==='password_required'){pwWrap.classList.add('on');status.textContent='This delivery is password protected.';return}
      if(res.status===401&&data.error==='invalid_password'){pwWrap.classList.add('on');status.textContent='That password is not correct.';return}
      if(!res.ok)throw new Error(data.error||`Delivery unavailable (${res.status})`);
      delivery=data;pwWrap.classList.remove('on');document.getElementById('title').textContent=data.name||'Your photographs.';status.textContent='Ready to download.';
      const total=(data.files||[]).reduce((a,f)=>a+(Number(f.size)||0),0),expiry=data.expiresAt?new Date(data.expiresAt).toLocaleString():'No expiry';
      meta.innerHTML=`<span>${data.files?.length||0} files</span><span>${fmt(total)}</span><span>Expires: ${expiry}</span>`;
      files.innerHTML=(data.files||[]).map(f=>`<div class="file"><div><strong>${escapeHtml(f.name)}</strong><small>${fmt(Number(f.size)||0)}</small></div><button class="btn secondary" data-download="${f.id}">Download</button></div>`).join('')||'<div class="empty">No files are available in this delivery.</div>';
      files.querySelectorAll('[data-download]').forEach(btn=>btn.onclick=()=>download(btn.dataset.download,btn));
    }catch(e){setError(e.message||String(e))}
  }
  async function download(fileId,btn){
    btn.disabled=true;const old=btn.textContent;btn.textContent='Preparing…';
    try{
      const res=await fetch(`${api}/api/deliveries/${encodeURIComponent(id)}/download?token=${encodeURIComponent(token)}`,{method:'POST',headers:{'Content-Type':'application/json',...(password?{'X-HSM-Delivery-Password':password}:{})},body:JSON.stringify({fileId})});
      const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Could not prepare download.');location.href=data.url;
    }catch(e){status.textContent=e.message||String(e)}finally{btn.disabled=false;btn.textContent=old}
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  document.getElementById('unlock').onclick=()=>{password=pw.value;load()};pw.addEventListener('keydown',e=>{if(e.key==='Enter'){password=pw.value;load()}});load();
})();
</script>
</body>
</html>
