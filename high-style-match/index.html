<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark"><i></i></div><div class="brand-text"><strong>High Style Match</strong><small>High Style Group</small></div></div>

  </aside>
  <div class="main">

</div>
<input id="shotFile" type="file" accept=".txt,.csv,.tsv,.md,text/plain,text/csv,text/tab-separated-values,text/markdown" hidden>
<input id="photoFiles" type="file" multiple accept="image/*,.cr3,.cr2,.nef,.arw,.raf,.dng,.orf,.rw2" hidden>
<div id="modalRoot"></div><div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const KEY='hsmPremium1', OLD_KEY='hsmWeb3', DB_NAME='hsm-files-v1', DB_STORE='files';
const defaults={shoots:[],templates:[
  {id:'t1',name:'Client · Subject · Orientation',pattern:'{client}_{subject}_{orientation}_{number}'},
  {id:'t2',name:'Shoot · Shot',pattern:'{shoot}_{shotListItem}_{number}'},
  {id:'t3',name:'Client · Subject',pattern:'{client}_{subject}_{number}'}
],history:[],settings:{defaultTemplate:'t1'}};
const safeStorage=(()=>{try{const x=localStorage,k='__hsm_probe__';x.setItem(k,'1');x.removeItem(k);return x}catch{const m=new Map();return{getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k)}}})();
let D=loadData(),screen='shotlist',shootId=null,tab='overview',photoFilter='all',cullFilter='all',wizardStep=1,draft=freshDraft(),renameDraft=[],shotInputTarget='wizard',activeDownload=false;
const fileURLs=new Map(),C=document.getElementById('content'),NAV=document.getElementById('nav'),CRUMB=document.getElementById('crumb'),TOP=document.getElementById('topActions'),SHOT=document.getElementById('shotFile'),PHOTOS=document.getElementById('photoFiles');

function icon(name){const paths={home:'<path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',shoots:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M8 5V3m8 2V3M3 9h18"/>',plus:'<path d="M12 5v14M5 12h14"/>',template:'<path d="M4 5h16M4 12h10M4 19h16"/>',upload:'<path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 20h14"/>',photo:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',spark:'<path d="m12 3 1.7 4.3L18 9l-4.3 1.7L12 15l-1.7-4.3L6 9l4.3-1.7z"/><path d="m19 14 .8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"/>',download:'<path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M4 20h16"/>',check:'<path d="m5 12 4 4L19 6"/>',trash:'<path d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 14H7L6 7"/>',arrow:'<path d="m9 18 6-6-6-6"/>',edit:'<path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',folder:'<path d="M3 6h7l2 2h9v11H3z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',back:'<path d="m15 18-6-6 6-6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',copy:'<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',refresh:'<path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0-1 6"/>',save:'<path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4m-7 16v-6h6v6"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.info}</svg>`}
function uid(prefix='id'){return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`}
function freshDraft(){return{client:'',name:'',date:new Date().toISOString().slice(0,10),location:'',shotText:'',shotSourceName:'',shots:[]}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){safeStorage.setItem(KEY,JSON.stringify(D))}
function loadData(){try{const cur=JSON.parse(safeStorage.getItem(KEY)||'null');if(cur)return cur;const old=JSON.parse(safeStorage.getItem(OLD_KEY)||'null');if(old){const migrated=structuredClone(defaults);migrated.shoots=(old.shoots||[]).map(s=>({id:String(s.id),client:s.client||'',name:s.name||'',date:s.date||'',location:s.location||'',createdAt:Date.now(),shotText:'',shotSourceName:'Migrated shot list',shots:(s.shots||[]).map(x=>({id:String(x.id),subject:x.subject||'Shot',variant:x.variant||'Shot',skip:!!x.skip})),photos:(s.photos||[]).map(p=>({id:String(p.id),name:p.name,ext:p.ext||extOf(p.name),orientation:p.ori||'Unknown',width:0,height:0,size:0,lastModified:0,shotId:p.shot?String(p.shot):null,fileKey:null,needsReconnect:true})),templateId:'t1',renameOverrides:{}}));safeStorage.setItem(KEY,JSON.stringify(migrated));return migrated}}catch{}return structuredClone(defaults)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2800)}
function getShoot(){return D.shoots.find(s=>String(s.id)===String(shootId))}
function extOf(name){const m=String(name).match(/\.([^.]+)$/);return m?m[1].toLowerCase():''}
function baseOf(name){return String(name).replace(/\.[^.]+$/,'')}
function pad(n){return String(n).padStart(3,'0')}
function cleanName(v){let x=String(v||'').normalize('NFKC').replace(/[<>:"/\\|?*\x00-\x1F]/g,' ').replace(/\s+/g,'_').replace(/_+/g,'_').replace(/^[._ ]+|[._ ]+$/g,'');if(!x)x='photo';if(/^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/i.test(x))x='_'+x;return x.slice(0,170)}

const memoryFiles=new Map();
function openDB(){return new Promise((resolve,reject)=>{try{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}catch(err){reject(err)}})}
async function dbPut(key,file){try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(file,key);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}})}catch{memoryFiles.set(key,file)}}
async function dbGet(key){if(!key)return null;try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const q=tx.objectStore(DB_STORE).get(key);q.onsuccess=()=>{db.close();res(q.result||memoryFiles.get(key)||null)};q.onerror=()=>{db.close();rej(q.error)}})}catch{return memoryFiles.get(key)||null}}
async function dbDeletePrefix(prefix){for(const key of [...memoryFiles.keys()])if(String(key).startsWith(prefix))memoryFiles.delete(key);try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite'),store=tx.objectStore(DB_STORE),q=store.openCursor();q.onsuccess=()=>{const c=q.result;if(!c)return;if(String(c.key).startsWith(prefix))c.delete();c.continue()};tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}})}catch{}}

function parseShotList(text){const out=[];let subject='';const variants='Landscape|Portrait|Overhead|Detail|Square|Wide|Interior|Exterior|Hero|Close Up|Close-up';const vr=new RegExp(`^(${variants})$`,'i');const add=(sub,v='Shot',count=1)=>{for(let i=0;i<count;i++)out.push({id:uid('shot'),subject:sub.trim(),variant:v.trim(),skip:false})};const split=line=>{const delim=line.includes('\t')?'\t':',';const cells=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===delim&&!quoted){cells.push(cur.trim());cur=''}else cur+=ch}cells.push(cur.trim());return cells};const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(let i=0;i<lines.length;i++){let line=lines[i].replace(/^[-•▪◦]\s*/,'').replace(/^\d+[.)]\s*/,'').trim();if(!line)continue;let count=1;const cm=line.match(/(?:\s+x\s*|\s*\()(\d+)\)?$/i);if(cm){count=Math.max(1,+cm[1]);line=line.slice(0,cm.index).trim()}const exp=line.match(new RegExp(`^(.+?)\\s*[—–-]\\s*(${variants})$`,'i'));if(exp){subject=exp[1].trim();add(subject,exp[2],count);continue}if(line.includes(',')||line.includes('\t')){const z=split(line),a=(z[0]||'').trim(),b=(z[1]||'').trim(),q=parseInt(z[2],10);if(/^(subject|shot|shot item|item|dish|name|photo)$/i.test(a)&&/^(orientation|variant|format|type|view)$/i.test(b))continue;if(a&&b){subject=a;add(a,b,Number.isFinite(q)&&q>0?q:count);continue}if(a){subject=a;add(a,'Shot',count);continue}}if(vr.test(line)&&subject){add(subject,line,count);continue}const group=line.match(/^(.+):$/);if(group){subject=group[1].trim();continue}const next=(lines[i+1]||'').replace(/^[-•▪◦]\s*/,'').replace(/^\d+[.)]\s*/,'').trim().replace(/(?:\s+x\s*|\s*\()(\d+)\)?$/i,'').trim();if(next&&vr.test(next)){subject=line;continue}subject=line;add(line,'Shot',count)}return out}

function coverage(s){const counts=new Map();s.photos.forEach(p=>p.shotId&&counts.set(p.shotId,(counts.get(p.shotId)||0)+1));const active=s.shots.filter(x=>!x.skip);const matched=active.filter(x=>counts.get(x.id)).length;return{matched,total:active.length,missing:Math.max(0,active.length-matched),counts,percent:active.length?Math.round(matched/active.length*100):0}}
function workflowStage(s){if(!s.shots.length)return 1;if(!s.photos.length)return 2;if(!s.cullCompleted)return 3;const c=coverage(s);if(c.matched<c.total)return 4;return 5}
function statusText(s){const st=workflowStage(s);return ['','Add shot list','Add photographs','Run Smart Cull','Review matching','Ready to rename'][st]}
function stats(){return{shoots:D.shoots.length,photos:D.shoots.reduce((a,s)=>a+s.photos.length,0),ready:D.shoots.filter(s=>workflowStage(s)===5).length,downloads:D.history.reduce((a,h)=>a+(h.count||0),0)}}

function setNav(){NAV.innerHTML=[['shotlist','upload','Shot List'],['shoots','shoots','Shoots'],['home','home','Dashboard'],['templates','template','Templates']].map(([id,ic,label])=>`<button data-screen="${id}" class="${screen===id?'on':''}">${icon(ic)}<span>${label}</span></button>`).join('');NAV.querySelectorAll('button').forEach(b=>b.onclick=()=>navigate(b.dataset.screen))}
function navigate(next){screen=next;if(next!=='workspace')shootId=null;if(next==='new'){wizardStep=1;draft=freshDraft()}render()}
function render(){setNav();if(screen==='shotlist')renderShotListHub();else if(screen==='home')renderHome();else if(screen==='shoots')renderShoots();else if(screen==='new')renderWizard();else if(screen==='templates')renderTemplates();else if(screen==='workspace')renderWorkspace();else renderShotListHub()}
function setTop(path,actions=''){CRUMB.innerHTML=path;TOP.innerHTML=actions}
function head(ey,title,copy){return `<div class="page-head"><div><div class="eyebrow">${esc(ey)}</div><h1 class="hero-title">${esc(title)}</h1><p class="hero-copy">${esc(copy)}</p></div></div>`}

function renderShotListHub(){
 setTop('<b>Shot List</b>','<button class="btn secondary small" id="hubShoots">'+icon('folder')+'View Shoots</button>');
 const rows=draft.shots;
 C.innerHTML=`<div class="shot-hub-hero"><div class="eyebrow">The core of High Style Match</div><h1>Start with the shot list.</h1><p>Upload the client’s existing shot list first. High Style Match turns it into structured requirements, then uses those requirements to organise, match and rename the photographs.</p><div class="core-badge">${icon('spark')} Shot list → photos → matched filenames</div></div>
 <div class="shot-hub-grid section">
   <div class="grid" style="gap:18px">
     <div class="panel panel-pad"><div class="panel-head"><div><h2>1. Upload the shot list</h2><p>Every job starts here.</p></div>${draft.shots.length?'<span class="pill success">'+draft.shots.length+' requirements</span>':''}</div>
       <div class="upload-zone" id="hubShotDrop"><div class="upload-icon">${icon('upload')}</div><b>Drop your shot list here</b><p>TXT, CSV, TSV or Markdown · or choose a file</p><div class="shot-hub-actions" style="justify-content:center"><button class="btn primary" id="hubChooseShot">${icon('folder')}Choose Shot List</button>${draft.shots.length?'<button class="btn secondary" id="hubClearShot">'+icon('trash')+'Clear</button>':''}</div></div>
       ${draft.shotSourceName?`<div class="shot-count"><div><b>${esc(draft.shotSourceName)}</b><div class="shot-source">Loaded and ready to review</div></div><span>${draft.shots.length} requirements detected</span></div>`:''}
       <div class="field section"><label>Or paste / edit the shot list</label><textarea id="hubShotText" placeholder="Burger — Landscape\nBurger — Portrait\nCarbonara — Overhead x2">${esc(draft.shotText)}</textarea><div class="field-hint" id="hubParseHint">${draft.shots.length?`${draft.shots.length} requirements detected`:'Add a shot list to begin.'}</div></div>
     </div>
     <div class="panel panel-pad"><div class="panel-head"><div><h2>2. Review the requirements</h2><p>These are the names High Style Match will use when matching and renaming.</p></div></div>
       ${rows.length?`<div class="shot-preview-table"><div class="table"><div class="table-row header"><span>Requirement</span><span>Variant</span><span>Status</span><span>#</span></div>${rows.map((x,i)=>`<div class="table-row"><div><strong>${esc(x.subject)}</strong></div><div class="muted">${esc(x.variant)}</div><div><span class="pill purple">Ready</span></div><div>${i+1}</div></div>`).join('')}</div></div>`:`<div class="shot-empty-note">Upload or paste a shot list above. As soon as High Style Match recognises the items, they will appear here as structured shoot requirements.</div>`}
     </div>
   </div>
   <div class="panel panel-pad shot-create-card"><div class="panel-head"><div><h2>3. Create the shoot</h2><p>Attach these requirements to a client job, then move straight to the photographs.</p></div></div>
     <div class="form-grid" style="grid-template-columns:1fr"><div class="field"><label>Client</label><input id="hubClient" value="${esc(draft.client)}" placeholder="Cancello Restaurant"></div><div class="field"><label>Shoot name</label><input id="hubName" value="${esc(draft.name)}" placeholder="Autumn Menu Shoot"></div><div class="field"><label>Date</label><input id="hubDate" type="date" value="${esc(draft.date)}"></div><div class="field"><label>Location</label><input id="hubLocation" value="${esc(draft.location)}" placeholder="Manchester"></div></div>
     <div class="notice info section">${icon('info')}The shot list stays attached to this shoot and drives matching and filename generation.</div>
     <button class="btn primary section" style="width:100%" id="hubCreate" ${draft.shots.length?'':'disabled'}>${icon('arrow')}Create Shoot & Add Photos</button>
   </div>
 </div>`;
 document.getElementById('hubShoots').onclick=()=>navigate('shoots');
 const sync=()=>{draft.client=document.getElementById('hubClient').value.trim();draft.name=document.getElementById('hubName').value.trim();draft.date=document.getElementById('hubDate').value;draft.location=document.getElementById('hubLocation').value.trim()};
 ['hubClient','hubName','hubDate','hubLocation'].forEach(id=>document.getElementById(id).oninput=sync);
 const ta=document.getElementById('hubShotText');ta.oninput=()=>{draft.shotText=ta.value;draft.shots=parseShotList(draft.shotText);draft.shotSourceName=draft.shotText.trim()?'Pasted / edited in High Style Match':'';renderShotListHub()};
 document.getElementById('hubChooseShot').onclick=()=>{shotInputTarget='hub';SHOT.click()};
 const clear=document.getElementById('hubClearShot');if(clear)clear.onclick=()=>{draft.shotText='';draft.shots=[];draft.shotSourceName='';renderShotListHub()};
 const drop=document.getElementById('hubShotDrop');['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readShotFile(f,'hub')});
 document.getElementById('hubCreate').onclick=()=>{sync();if(!draft.shots.length)return toast('Upload a shot list first.');if(!draft.client||!draft.name)return toast('Add a client and shoot name.');const s={id:uid('shoot'),client:draft.client,name:draft.name,date:draft.date,location:draft.location,createdAt:Date.now(),shotText:draft.shotText,shotSourceName:draft.shotSourceName||'Shot list',shots:draft.shots,photos:[],templateId:D.settings.defaultTemplate||'t1',renameOverrides:{}};D.shoots.unshift(s);save();draft=freshDraft();shootId=String(s.id);screen='workspace';tab='photos';photoFilter='all';renameDraft=[];render();toast('Shoot created — add the photographs next')};
}

function renderHome(){setTop('<b>High Style Match</b>','<button class="btn primary" id="topNew">'+icon('plus')+'Upload Shot List</button>');const q=stats();C.innerHTML=head('High Style Group','Rename a full shoot from the shot list.','Upload the client list, add your photographs, match them in seconds and export professionally named copies without touching the originals.')+`<div class="grid stats"><div class="stat"><div class="stat-top"><span>Shoots</span><div class="stat-icon">${icon('folder')}</div></div><b>${q.shoots}</b><small>Saved on this device</small></div><div class="stat"><div class="stat-top"><span>Photographs</span><div class="stat-icon">${icon('photo')}</div></div><b>${q.photos}</b><small>Stored locally</small></div><div class="stat"><div class="stat-top"><span>Ready</span><div class="stat-icon">${icon('check')}</div></div><b>${q.ready}</b><small>Ready to rename</small></div><div class="stat"><div class="stat-top"><span>Renamed</span><div class="stat-icon">${icon('download')}</div></div><b>${q.downloads}</b><small>Copies exported</small></div></div><div class="grid workflow section">${[['1','Shot list','Upload TXT, CSV or TSV'],['2','Create shoot','Attach it to the client job'],['3','Photographs','Import JPG, HEIC or RAW'],['4','Auto match','Orientation + shoot order'],['5','Rename','Review and download ZIP']].map(x=>`<div class="workflow-step"><span>${x[0]}</span><b>${x[1]}</b><p>${x[2]}</p></div>`).join('')}</div><div class="panel panel-pad section"><div class="panel-head"><div><h2>Recent shoots</h2><p>Pick up exactly where you left off.</p></div><button class="btn secondary small" id="viewAll">View all</button></div>${shootRows(D.shoots.slice(0,5))}</div>`;document.getElementById('topNew').onclick=()=>navigate('shotlist');document.getElementById('viewAll').onclick=()=>navigate('shoots');wireShootRows()}
function shootRows(arr){if(!arr.length)return `<div class="empty"><div class="empty-icon">${icon('folder')}</div><h3>No shoots yet</h3><p>Create your first project, upload a client shot list and High Style Match will guide you through the rest.</p><button class="btn primary" id="emptyNew">${icon('plus')}Upload First Shot List</button></div>`;return `<div class="shoot-list">${arr.map(s=>{const c=coverage(s);return `<div class="shoot-row"><div><strong>${esc(s.client)}</strong><div class="meta">${esc(s.name)}${s.date?' · '+esc(s.date):''}</div></div><div><div class="progress"><i style="width:${c.percent}%"></i></div><div class="meta">${c.matched}/${c.total} requirements</div></div><div class="actions"><span class="pill ${workflowStage(s)===4?'success':'purple'}">${esc(statusText(s))}</span><button class="btn secondary small open-shoot" data-id="${esc(s.id)}">Open ${icon('arrow')}</button></div></div>`}).join('')}</div>`}
function wireShootRows(){const e=document.getElementById('emptyNew');if(e)e.onclick=()=>navigate('shotlist');document.querySelectorAll('.open-shoot').forEach(b=>b.onclick=()=>openShoot(b.dataset.id))}
function openShoot(id){shootId=String(id);screen='workspace';tab='overview';photoFilter='all';renameDraft=[];render()}

function renderShoots(){setTop('<span>High Style Match</span><span>›</span><b>Shoots</b>','<button class="btn primary" id="topNew">'+icon('plus')+'Upload Shot List</button>');C.innerHTML=head('Projects','Your shoots','Each project keeps its shot list, photographs, assignments and naming preferences on this device.')+`<div class="panel panel-pad">${shootRows(D.shoots)}</div>`;document.getElementById('topNew').onclick=()=>navigate('shotlist');wireShootRows()}

function wizardSteps(){return `<div class="wizard-steps"><div class="wizard-step ${wizardStep===1?'on':wizardStep>1?'done':''}"><i>${wizardStep>1?'✓':'1'}</i><span>Details</span></div><div class="wizard-line"></div><div class="wizard-step ${wizardStep===2?'on':wizardStep>2?'done':''}"><i>${wizardStep>2?'✓':'2'}</i><span>Shot List</span></div><div class="wizard-line"></div><div class="wizard-step ${wizardStep===3?'on':''}"><i>3</i><span>Review</span></div></div>`}
function renderWizard(){setTop('<span>High Style Match</span><span>›</span><b>New Shoot</b>','');let body='';if(wizardStep===1)body=`<div class="panel panel-pad"><div class="panel-head"><div><h2>Shoot details</h2><p>Start with the basic project information.</p></div></div><div class="form-grid"><div class="field"><label>Client</label><input id="wClient" value="${esc(draft.client)}" placeholder="Cancello Restaurant"></div><div class="field"><label>Shoot name</label><input id="wName" value="${esc(draft.name)}" placeholder="Autumn Menu Shoot"></div><div class="field"><label>Date</label><input id="wDate" type="date" value="${esc(draft.date)}"></div><div class="field"><label>Location</label><input id="wLocation" value="${esc(draft.location)}" placeholder="Manchester"></div></div><div class="actions section" style="justify-content:flex-end"><button class="btn primary" id="wNext">Continue ${icon('arrow')}</button></div></div>`;if(wizardStep===2)body=`<div class="panel panel-pad"><div class="panel-head"><div><h2>Add the shot list</h2><p>Upload a pre-existing list or paste it below. You can edit it before creating the shoot.</p></div></div><div class="upload-zone" id="shotDrop"><div class="upload-icon">${icon('upload')}</div><b>Drop your shot list here</b><p>TXT, CSV, TSV or Markdown · or choose a file</p><button class="btn secondary" id="chooseShot">${icon('folder')}Choose Shot List</button></div>${draft.shotSourceName?`<div class="preview-strip"><div><strong>${esc(draft.shotSourceName)}</strong><br><span>Loaded into the editor below</span></div><span class="pill success">${draft.shots.length} requirements</span></div>`:''}<div class="field section"><label>Shot list</label><textarea id="wShotText" placeholder="Burger — Landscape\nBurger — Portrait\nCarbonara — Overhead x2">${esc(draft.shotText)}</textarea><div class="field-hint" id="parseHint">${draft.shots.length?`${draft.shots.length} requirements detected`:'Add a list to continue.'}</div></div><div class="actions section" style="justify-content:space-between"><button class="btn secondary" id="wBack">${icon('back')}Back</button><button class="btn primary" id="wNext" ${draft.shots.length?'':'disabled'}>Review Shoot ${icon('arrow')}</button></div></div>`;if(wizardStep===3)body=`<div class="panel panel-pad"><div class="panel-head"><div><h2>Ready to create</h2><p>Check the details. You can change anything later.</p></div></div><div class="review-card"><div class="review-block"><label>Client</label><b>${esc(draft.client)}</b></div><div class="review-block"><label>Shoot</label><b>${esc(draft.name)}</b></div><div class="review-block"><label>Date</label><b>${esc(draft.date||'Not set')}</b></div><div class="review-block"><label>Location</label><b>${esc(draft.location||'Not set')}</b></div><div class="review-block"><label>Shot list</label><b>${draft.shots.length} requirements</b></div><div class="review-block"><label>Source</label><b>${esc(draft.shotSourceName||'Pasted manually')}</b></div></div><div class="notice info section">${icon('info')}After creating the project, add your photographs and use Auto Match. High Style Match will use the shot list to build the output filenames.</div><div class="actions section" style="justify-content:space-between"><button class="btn secondary" id="wBack">${icon('back')}Back</button><button class="btn primary" id="createShoot">${icon('check')}Create Shoot</button></div></div>`;C.innerHTML=`<div class="wizard-shell"><div class="eyebrow">New project</div><h1 class="hero-title" style="margin-bottom:22px">Set up your shoot</h1>${wizardSteps()}${body}</div>`;wireWizard()}
function syncDraftDetails(){const a=document.getElementById('wClient'),b=document.getElementById('wName'),c=document.getElementById('wDate'),d=document.getElementById('wLocation');if(a)draft.client=a.value.trim();if(b)draft.name=b.value.trim();if(c)draft.date=c.value;if(d)draft.location=d.value.trim()}
function wireWizard(){const back=document.getElementById('wBack');if(back)back.onclick=()=>{wizardStep--;renderWizard()};if(wizardStep===1){document.getElementById('wNext').onclick=()=>{syncDraftDetails();if(!draft.client||!draft.name)return toast('Add a client and shoot name first.');wizardStep=2;renderWizard()}}if(wizardStep===2){const ta=document.getElementById('wShotText'),drop=document.getElementById('shotDrop');ta.oninput=()=>{draft.shotText=ta.value;draft.shots=parseShotList(draft.shotText);document.getElementById('parseHint').textContent=draft.shots.length?`${draft.shots.length} requirements detected`:'Add a list to continue.';document.getElementById('wNext').disabled=!draft.shots.length};document.getElementById('chooseShot').onclick=()=>{shotInputTarget='wizard';SHOT.click()};['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readShotFile(f,'wizard')});document.getElementById('wNext').onclick=()=>{draft.shotText=ta.value;draft.shots=parseShotList(draft.shotText);if(!draft.shots.length)return toast('Add at least one shot-list item.');wizardStep=3;renderWizard()}}if(wizardStep===3){document.getElementById('createShoot').onclick=()=>{const s={id:uid('shoot'),client:draft.client,name:draft.name,date:draft.date,location:draft.location,createdAt:Date.now(),shotText:draft.shotText,shotSourceName:draft.shotSourceName||'Pasted shot list',shots:draft.shots,photos:[],templateId:D.settings.defaultTemplate||'t1',renameOverrides:{}};D.shoots.unshift(s);save();draft=freshDraft();openShoot(s.id)}}}

SHOT.onchange=()=>{const f=SHOT.files[0];if(f)readShotFile(f,shotInputTarget);SHOT.value=''};
async function readShotFile(file,target){try{const text=await file.text(),shots=parseShotList(text);if(!shots.length)return toast('No shot-list items were detected in that file.');if(target==='hub'){draft.shotText=text;draft.shots=shots;draft.shotSourceName=file.name;renderShotListHub();toast(`${shots.length} requirements loaded from ${file.name}`)}else if(target==='wizard'){draft.shotText=text;draft.shots=shots;draft.shotSourceName=file.name;renderWizard()}else{const s=getShoot();if(!s)return;s.shotText=text;s.shots=shots;s.shotSourceName=file.name;s.photos.forEach(p=>p.shotId=null);s.renameOverrides={};save();tab='shotlist';renderWorkspace();toast(`${shots.length} requirements loaded from ${file.name}`)}}catch{toast('That shot-list file could not be read.')}}

function renderWorkspace(){const s=getShoot();if(!s)return navigate('shoots');const c=coverage(s),stage=workflowStage(s);setTop(`<span>High Style Match</span><span>›</span><span>Shoots</span><span>›</span><b>${esc(s.client)}</b>`,`<button class="btn secondary small" id="deleteShoot">${icon('trash')}Delete</button>`);const stagePill=stage===5?'Ready to rename':stage===3?'Smart Cull ready':stage===4?`${c.percent}% matched`:statusText(s);C.innerHTML=`<div class="workspace-head"><div class="title-row"><div><div class="eyebrow">${esc(s.client)}</div><h1>${esc(s.name)}</h1><p>${esc(s.date||'No date')}${s.location?' · '+esc(s.location):''} · ${esc(statusText(s))}</p></div><div class="actions"><span class="pill ${stage===5?'success':'purple'}">${esc(stagePill)}</span></div></div><div class="workspace-progress">${[['Shot list',s.shots.length>0],['Photographs',s.photos.length>0],['Smart Cull',!!s.cullCompleted],['Matching',c.matched===c.total&&c.total>0],['Rename',stage===5]].map((x,i)=>`<div class="wp ${x[1]?'done':stage===i+1?'active':''}"><i>${x[1]?'✓':i+1}</i>${x[0]}</div>`).join('')}</div></div><div class="tabs" id="tabs">${[['overview','Overview'],['shotlist','Shot List'],['photos','Photographs'],['cull','Smart Cull'],['rename','Rename'],['history','History']].map(([id,l])=>`<button data-tab="${id}" class="${tab===id?'on':''}">${l}</button>`).join('')}</div><div id="workspaceBody"></div>`;document.getElementById('deleteShoot').onclick=()=>confirmDeleteShoot(s);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renameDraft=[];renderWorkspace()});renderTab(s,c)}
function renderTab(s,c){const W=document.getElementById('workspaceBody');if(tab==='overview')renderOverview(W,s,c);if(tab==='shotlist')renderShotListTab(W,s,c);if(tab==='photos')renderPhotosTab(W,s,c);if(tab==='cull')renderCullTab(W,s,c);if(tab==='rename')renderRenameTab(W,s,c);if(tab==='history')renderHistoryTab(W,s)}
function renderOverview(W,s,c){const stage=workflowStage(s);let title,copy,action,label;if(stage===1){title='Add the client shot list';copy='Upload the pre-existing shot list so High Style Match knows what the finished shoot needs to contain.';action=()=>{tab='shotlist';renderWorkspace()};label='Add Shot List'}else if(stage===2){title='Bring in the photographs';copy='Add the delivered shoot files. Supported browser images get thumbnails; RAW files stay untouched and appear as file cards.';action=()=>PHOTOS.click();label='Add Photographs'}else if(stage===3){title='Cull the shoot before matching';copy='Smart Cull groups similar frames, finds exact and near duplicates, scores technical quality and suggests the strongest picks. Nothing is deleted.';action=()=>{tab='cull';renderWorkspace()};label='Open Smart Cull'}else if(stage===4){title='Match the best images to the shot list';copy='Auto Match now prioritises your Smart Cull picks and higher-scoring photographs, while still letting you correct every assignment.';action=()=>autoMatch(s,false);label='Auto Match Best Picks'}else{title='Everything is ready to rename';copy='Review the generated filenames, adjust anything you want, then export all matched photographs in one ZIP.';action=()=>{tab='rename';renderWorkspace()};label='Review Rename Preview'}W.innerHTML=`<div class="grid overview-grid"><div class="callout"><div><div class="eyebrow">Next best action</div><h2>${esc(title)}</h2><p>${esc(copy)}</p></div><button class="btn primary" id="nextAction">${stage===1?icon('upload'):stage===2?icon('photo'):stage===5?icon('download'):icon('spark')}${esc(label)}</button></div><div class="side-stats"><div class="mini-stat"><label>Shot-list requirements</label><b>${s.shots.length}</b></div><div class="mini-stat"><label>Photographs</label><b>${s.photos.length}</b></div><div class="mini-stat"><label>Matched</label><b>${c.matched} / ${c.total}</b></div></div></div>${s.photos.some(p=>p.needsReconnect)?`<div class="notice warn section">${icon('info')}Some photographs were migrated from an older version and need to be imported again before they can be downloaded.</div>`:''}`;document.getElementById('nextAction').onclick=action}

function renderShotListTab(W,s,c){W.innerHTML=`<div class="panel panel-pad"><div class="panel-head"><div><h2>Shot list</h2><p>${s.shotSourceName?`Source: ${esc(s.shotSourceName)}`:'No file source recorded'}</p></div><div class="actions"><button class="btn secondary small" id="replaceShot">${icon('upload')}Replace Shot List</button><button class="btn secondary small" id="editShot">${icon('edit')}Edit List</button></div></div>${s.shots.length?`<div class="table"><div class="table-row header"><span>Requirement</span><span>Variant</span><span>Status</span><span>Photographs</span></div>${s.shots.map(x=>`<div class="table-row"><div><strong>${esc(x.subject)}</strong></div><div class="muted">${esc(x.variant)}</div><div><span class="match-dot ${c.counts.get(x.id)?'yes':''}"></span> ${c.counts.get(x.id)?'Matched':'Missing'}</div><div>${c.counts.get(x.id)||0}</div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">${icon('upload')}</div><h3>Add a pre-existing shot list</h3><p>Upload TXT, CSV, TSV or Markdown. High Style Match turns every row into a shoot requirement.</p><button class="btn primary" id="emptyShot">${icon('upload')}Upload Shot List</button></div>`}</div>`;const choose=()=>{shotInputTarget='existing';SHOT.click()};document.getElementById('replaceShot').onclick=choose;const es=document.getElementById('emptyShot');if(es)es.onclick=choose;document.getElementById('editShot').onclick=()=>editShotListModal(s)}
function editShotListModal(s){showModal(`<h3>Edit shot list</h3><p>Change the list below. Updating it clears the current photo assignments so they can be matched against the new requirements.</p><div class="field"><textarea id="modalShotText">${esc(s.shotText||s.shots.map(x=>`${x.subject} — ${x.variant}`).join('\n'))}</textarea></div><div class="actions section" style="justify-content:flex-end"><button class="btn secondary" data-close>Cancel</button><button class="btn primary" id="saveShotEdit">${icon('save')}Save Shot List</button></div>`);document.getElementById('saveShotEdit').onclick=()=>{const text=document.getElementById('modalShotText').value,shots=parseShotList(text);if(!shots.length)return toast('The shot list needs at least one item.');s.shotText=text;s.shots=shots;s.shotSourceName='Edited in High Style Match';s.photos.forEach(p=>p.shotId=null);s.renameOverrides={};save();closeModal();renderWorkspace();toast('Shot list updated')}}

PHOTOS.onchange=async()=>{if(!shootId)return;const list=[...PHOTOS.files];PHOTOS.value='';if(list.length)await addPhotos(list)};
async function addPhotos(list){const s=getShoot();if(!s)return;const allowed=/\.(jpe?g|png|webp|heic|cr3|cr2|nef|arw|raf|dng|orf|rw2)$/i;let added=0;toast(`Importing ${list.length} photograph${list.length===1?'':'s'}…`);for(const f of list){if(!allowed.test(f.name))continue;const id=uid('photo'),fileKey=`${s.id}:${id}`;let meta={orientation:'Unknown',width:0,height:0};if(f.type.startsWith('image/')&&!/heic/i.test(f.type)){try{meta=await imageMeta(f)}catch{}}await dbPut(fileKey,f);s.photos.push({id,name:f.name,ext:extOf(f.name),orientation:meta.orientation,width:meta.width,height:meta.height,size:f.size,lastModified:f.lastModified||Date.now(),shotId:null,fileKey,needsReconnect:false,cullStatus:null,cullScore:null,cullGroup:null,cullIssues:[],cullExcluded:false,cullManualPick:false});added++}if(added){s.cullCompleted=false;s.cullSkipped=false;s.cullSummary=null;s.photos.forEach(p=>p.shotId=null);s.renameOverrides={}}save();photoFilter='all';tab='photos';renderWorkspace();toast(`${added} photograph${added===1?'':'s'} added`)}
function imageMeta(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{const w=img.naturalWidth,h=img.naturalHeight;URL.revokeObjectURL(u);res({width:w,height:h,orientation:w===h?'Square':w>h?'Landscape':'Portrait'})};img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}
async function photoURL(p){if(fileURLs.has(p.id))return fileURLs.get(p.id);const f=await dbGet(p.fileKey);if(!f)return null;const u=URL.createObjectURL(f);fileURLs.set(p.id,u);return u}
function renderPhotosTab(W,s,c){const filtered=s.photos.filter(p=>photoFilter==='all'||(photoFilter==='matched'?p.shotId:!p.shotId));W.innerHTML=`<div class="photos-head"><div><h2 style="margin:0;font-size:17px">Photographs</h2><p class="muted" style="margin:4px 0 0;font-size:12px">${s.photos.length} imported · ${s.photos.filter(p=>p.shotId).length} assigned${s.cullCompleted?' · Smart Cull complete':''}</p></div><div class="actions"><div class="filters">${[['all','All'],['matched','Matched'],['unmatched','Unmatched']].map(x=>`<button data-filter="${x[0]}" class="${photoFilter===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><button class="btn secondary small" id="addPhotos">${icon('plus')}Add Photos</button><button class="btn secondary small" id="openCull" ${!s.photos.length?'disabled':''}>${icon('spark')}Smart Cull</button><button class="btn primary small" id="autoMatch" ${!s.photos.length||!s.shots.length||!s.cullCompleted?'disabled':''}>${icon('spark')}Auto Match</button></div></div>${s.photos.length?`<div class="photo-grid">${filtered.map(p=>`<div class="photo-card"><div class="thumb" id="thumb-${esc(p.id)}"><div class="raw"><b>${esc((p.ext||'FILE').toUpperCase())}</b><span>${p.needsReconnect?'Re-import required':'Local file'}</span></div><span class="orientation">${esc(p.orientation)}</span></div><div class="photo-body"><div class="photo-name" title="${esc(p.name)}">${esc(p.name)}</div>${s.cullCompleted?`<div class="cull-mini"><span class="${p.cullManualPick||p.cullStatus==='pick'||p.cullStatus==='unique'?'pick':p.cullStatus==='exact'||p.cullStatus==='near'?'duplicate':''}">${p.cullManualPick?'Your pick':cullLabel(p)}</span>${p.cullExcluded?'<span class="excluded">Excluded</span>':''}${Number.isFinite(p.cullScore)?`<span>${p.cullScore}/100</span>`:''}</div>`:''}<select class="photo-assign" data-id="${esc(p.id)}"><option value="">Unassigned</option>${s.shots.map(x=>`<option value="${esc(x.id)}" ${p.shotId===x.id?'selected':''}>${esc(x.subject)} — ${esc(x.variant)}</option>`).join('')}</select></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">${icon('photo')}</div><h3>Add the photographs from this shoot</h3><p>Choose your finished JPG, HEIC or RAW files. They stay local to this browser and your originals are never renamed.</p><button class="btn primary" id="emptyPhotos">${icon('photo')}Select Photographs</button></div>`}`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{photoFilter=b.dataset.filter;renderWorkspace()});document.getElementById('addPhotos').onclick=()=>PHOTOS.click();const ep=document.getElementById('emptyPhotos');if(ep)ep.onclick=()=>PHOTOS.click();document.getElementById('openCull').onclick=()=>{tab='cull';renderWorkspace()};document.getElementById('autoMatch').onclick=()=>autoMatch(s,false);document.querySelectorAll('.photo-assign').forEach(sel=>sel.onchange=()=>{const p=s.photos.find(x=>x.id===sel.dataset.id);p.shotId=sel.value||null;s.renameOverrides={};save();renderWorkspace()});hydrateThumbs(filtered)}
async function hydrateThumbs(arr){for(const p of arr){if(!/^(jpg|jpeg|png|webp)$/i.test(p.ext))continue;const u=await photoURL(p);if(!u)continue;const el=document.getElementById(`thumb-${p.id}`);if(el)el.innerHTML=`<img src="${u}" alt=""><span class="orientation">${esc(p.orientation)}</span>`}}

function cullLabel(p){const map={pick:'Best pick',unique:'Best pick',exact:'Exact duplicate',near:'Near duplicate',alternate:'Alternate',review:'Needs review',raw:'RAW review'};return map[p.cullStatus]||'Not analysed'}
function cullRank(p){if(p.cullExcluded)return 99;if(p.cullManualPick)return-2;return{pick:0,unique:1,alternate:2,review:3,near:4,exact:5,raw:6}[p.cullStatus]??7}
function hammingHash(a,b){if(!a||!b||a.length!==b.length)return 999;let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n}
async function fileDigest(file){try{const buf=await file.arrayBuffer();if(globalThis.crypto&&crypto.subtle){try{const d=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{}}const a=new Uint8Array(buf);let h1=2166136261>>>0,h2=2246822519>>>0;for(const b of a){h1=Math.imul(h1^b,16777619)>>>0;h2=Math.imul(h2+b,3266489917)>>>0}return`fallback-${a.length}-${h1.toString(16)}-${h2.toString(16)}`}catch{return''}}
function loadImageForCull(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>res({img,url:u});img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};img.src=u})}
async function analyseCullPhoto(file,p){const loaded=await loadImageForCull(file),img=loaded.img;try{const size=96,cv=document.createElement('canvas');cv.width=size;cv.height=size;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,size,size);const data=cx.getImageData(0,0,size,size).data,lums=new Float32Array(size*size);let sum=0,sum2=0,grad=0,k=0;for(let y=0;y<size;y++){for(let x=0;x<size;x++,k++){const i=k*4,l=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];lums[k]=l;sum+=l;sum2+=l*l;if(x){grad+=Math.abs(l-lums[k-1])}if(y){grad+=Math.abs(l-lums[k-size])}}}const mean=sum/lums.length,std=Math.sqrt(Math.max(0,sum2/lums.length-mean*mean)),avgGrad=grad/(lums.length*2-size*2),sharp=Math.max(0,Math.min(1,avgGrad/18)),exposure=Math.max(0,Math.min(1,1-Math.abs(mean-128)/128)),contrast=Math.max(0,Math.min(1,std/64)),resScore=Math.max(0,Math.min(1,Math.sqrt((img.naturalWidth||p.width||1)*(img.naturalHeight||p.height||1))/3000));const score=.46*sharp+.24*exposure+.16*contrast+.14*resScore;const dh=document.createElement('canvas');dh.width=9;dh.height=8;const dx=dh.getContext('2d',{willReadFrequently:true});dx.drawImage(img,0,0,9,8);const dd=dx.getImageData(0,0,9,8).data;let ph='';for(let y=0;y<8;y++)for(let x=0;x<8;x++){const a=(y*9+x)*4,b=(y*9+x+1)*4,la=.2126*dd[a]+.7152*dd[a+1]+.0722*dd[a+2],lb=.2126*dd[b]+.7152*dd[b+1]+.0722*dd[b+2];ph+=la>lb?'1':'0'}const issues=[];if(sharp<.25)issues.push('Possible blur / soft focus');if(mean<42)issues.push('Very dark exposure');if(mean>218)issues.push('Very bright exposure');if(std<18)issues.push('Low contrast');return{hash:await fileDigest(file),phash:ph,score:Math.round(score*100),sharpness:Math.round(sharp*100),exposure:Math.round(exposure*100),mean:Math.round(mean),issues,width:img.naturalWidth,height:img.naturalHeight}}finally{URL.revokeObjectURL(loaded.url)}}
async function runSmartCull(s){if(!s.photos.length)return toast('Add photographs first.');const W=document.getElementById('workspaceBody');W.innerHTML=`<div class="panel panel-pad"><div class="panel-head"><div><h2>Analysing the shoot</h2><p id="cullProgressText">Preparing local image analysis…</p></div><span class="pill purple">Smart Cull</span></div><div class="cull-progress"><i id="cullProgressBar"></i></div><div class="notice info section">${icon('info')}Everything is analysed in this browser. No photograph is uploaded or deleted.</div></div>`;const supported=/^(jpg|jpeg|png|webp)$/i,items=[],decisions=new Map(s.photos.map(p=>[p.id,{excluded:!!p.cullExcluded,manual:!!p.cullManualPick}]));let done=0;for(const p of s.photos){p.cullGroup=null;p.cullStatus=null;p.cullScore=null;p.cullIssues=[];p.cullHash='';p.cullPerceptual='';const f=await dbGet(p.fileKey);if(!f||p.needsReconnect){p.cullStatus='review';p.cullIssues=['File needs to be re-imported'];}else if(!supported.test(p.ext)){p.cullStatus='raw';p.cullIssues=['Browser preview analysis unavailable for this file type'];}else{try{const a=await analyseCullPhoto(f,p);Object.assign(p,{cullHash:a.hash,cullPerceptual:a.phash,cullScore:a.score,cullSharpness:a.sharpness,cullExposure:a.exposure,cullIssues:a.issues,width:p.width||a.width,height:p.height||a.height});items.push(p)}catch{p.cullStatus='review';p.cullIssues=['Image could not be decoded for local analysis'];}}done++;const bar=document.getElementById('cullProgressBar'),txt=document.getElementById('cullProgressText');if(bar)bar.style.width=`${Math.round(done/s.photos.length*100)}%`;if(txt)txt.textContent=`Analysed ${done} of ${s.photos.length} photographs`;await new Promise(r=>setTimeout(r,0))}const parent=items.map((_,i)=>i);const find=i=>parent[i]===i?i:(parent[i]=find(parent[i]));const join=(a,b)=>{a=find(a);b=find(b);if(a!==b)parent[b]=a};for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){if(items[i].orientation!==items[j].orientation)continue;if(i function renderCullTab(W,s,c){if(!s.photos.length){W.innerHTML=`<div class="empty"><div class="empty-icon">${icon('spark')}</div><h3>Add photographs before Smart Cull</h3><p>Smart Cull needs the shoot files before it can find duplicates or suggest the strongest frames.</p><button class="btn primary" id="cullAddPhotos">${icon('photo')}Add Photographs</button></div>`;document.getElementById('cullAddPhotos').onclick=()=>PHOTOS.click();return}if(!s.cullCompleted){W.innerHTML=`<div class="smart-cull-hero"><div><div class="eyebrow">Local intelligent culling</div><h2>Find the strongest frames before matching.</h2><p>Smart Cull compares browser-readable photographs for visual similarity, exact duplicates, sharpness, exposure and technical quality. RAW and unsupported files are clearly sent to review instead of being guessed.</p></div><div class="actions"><button class="btn primary" id="runCull">${icon('spark')}Run Smart Cull</button><button class="btn secondary" id="skipCull">Skip for this shoot</button></div></div><div class="notice info section">${icon('info')}No files are deleted. Smart Cull only groups, scores and recommends. You remain in control.</div>`;document.getElementById('runCull').onclick=()=>runSmartCull(s);document.getElementById('skipCull').onclick=()=>{s.cullCompleted=true;s.cullSkipped=true;s.cullSummary={best:0,exact:0,near:0,review:s.photos.length,analysed:0,at:Date.now()};s.photos.forEach(p=>{p.cullStatus=p.cullStatus||'review';p.cullExcluded=false});save();renderWorkspace();toast('Smart Cull skipped for this shoot')};return}const sum=s.cullSummary||{best:0,exact:0,near:0,review:0,analysed:0};const visible=s.photos.filter(p=>cullFilter==='all'||(cullFilter==='picks'&&(p.cullManualPick||p.cullStatus==='pick'||p.cullStatus==='unique'))||(cullFilter==='duplicates'&&['exact','near','alternate'].includes(p.cullStatus))||(cullFilter==='review'&&(p.cullStatus==='review'||p.cullStatus==='raw'||(p.cullIssues||[]).length))).sort((a,b)=>cullRank(a)-cullRank(b)||(b.cullScore||0)-(a.cullScore||0)||(a.lastModified||0)-(b.lastModified||0));W.innerHTML=`<div class="smart-cull-hero"><div><div class="eyebrow">Smart Cull complete</div><h2>${s.cullSkipped?'Culling was skipped':'Your shoot has been grouped and ranked.'}</h2><p>${s.cullSkipped?'Run Smart Cull whenever you want recommendations.':'Best picks are prioritised for Auto Match. Duplicate and technical flags are suggestions only; nothing has been removed.'}</p></div><div class="actions"><button class="btn primary" id="rerunCull">${icon('refresh')}${s.cullSkipped?'Run Smart Cull':'Run Again'}</button></div></div><div class="grid cull-stats section"><div class="cull-stat"><label>Best picks</label><b>${sum.best||0}</b></div><div class="cull-stat"><label>Exact duplicates</label><b>${sum.exact||0}</b></div><div class="cull-stat"><label>Similar / alternates</label><b>${sum.near||0}</b></div><div class="cull-stat"><label>Needs review</label><b>${sum.review||0}</b></div></div><div class="cull-toolbar"><div class="filters">${[['all','All'],['picks','Best Picks'],['duplicates','Duplicates'],['review','Needs Review']].map(x=>`<button data-cull-filter="${x[0]}" class="${cullFilter===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div class="muted" style="font-size:11px">${sum.analysed||0} files technically analysed · ${s.photos.length} total</div></div>${visible.length?`<div class="photo-grid">${visible.map(p=>`<div class="photo-card cull-card"><div class="thumb" id="thumb-${esc(p.id)}"><div class="raw"><b>${esc((p.ext||'FILE').toUpperCase())}</b><span>${p.cullStatus==='raw'?'Needs visual review':'Local file'}</span></div><span class="orientation">${esc(p.orientation)}</span></div><div class="photo-body"><div class="photo-name" title="${esc(p.name)}">${esc(p.name)}</div><div class="cull-badges"><span class="cull-badge ${p.cullManualPick||p.cullStatus==='pick'||p.cullStatus==='unique'?'pick':p.cullStatus==='exact'||p.cullStatus==='near'?'duplicate':p.cullStatus==='review'||p.cullStatus==='raw'?'review':'purple'}">${p.cullManualPick?'Your pick':cullLabel(p)}</span>${p.cullExcluded?'<span class="cull-badge review">Excluded from match</span>':''}${(p.cullIssues||[]).map(x=>`<span class="cull-badge review">${esc(x)}</span>`).join('')}</div><div class="cull-group-label">Similarity group: ${esc(p.cullGroup||'—')}</div><div class="cull-score"><span>Technical score</span><b>${Number.isFinite(p.cullScore)?p.cullScore+'/100':'Review manually'}</b></div><div class="cull-actions"><button class="btn secondary small" data-pick="${esc(p.id)}">${p.cullManualPick?'Picked':'Mark Pick'}</button><button class="btn ${p.cullExcluded?'primary':'secondary'} small" data-exclude="${esc(p.id)}">${p.cullExcluded?'Use in Match':'Exclude'}</button></div></div></div>`).join('')}</div>`:`<div class="empty"><h3>No photographs in this filter</h3><p>Choose another Smart Cull view above.</p></div>`}<div class="notice success section">${icon('check')}Auto Match will prioritise your picks and stronger Smart Cull scores. Excluded photographs remain stored but will not be assigned.</div>`;document.getElementById('rerunCull').onclick=()=>runSmartCull(s);document.querySelectorAll('[data-cull-filter]').forEach(b=>b.onclick=()=>{cullFilter=b.dataset.cullFilter;renderWorkspace()});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const p=s.photos.find(x=>x.id===b.dataset.pick);if(!p)return;s.photos.filter(x=>x.cullGroup===p.cullGroup).forEach(x=>x.cullManualPick=false);p.cullManualPick=true;p.cullExcluded=false;save();renderWorkspace();toast(`${p.name} marked as your pick`)});document.querySelectorAll('[data-exclude]').forEach(b=>b.onclick=()=>{const p=s.photos.find(x=>x.id===b.dataset.exclude);if(!p)return;p.cullExcluded=!p.cullExcluded;if(p.cullExcluded)p.shotId=null;save();renderWorkspace()});hydrateThumbs(visible)}

function orientationWanted(variant){const v=String(variant||'').toLowerCase();if(v.includes('landscape')||v==='wide')return'Landscape';if(v.includes('portrait'))return'Portrait';if(v.includes('square'))return'Square';return null}
function autoMatch(s,reset=false){if(!s.shots.length||!s.photos.length)return toast('Add a shot list and photographs first.');if(!s.cullCompleted){tab='cull';renderWorkspace();return toast('Run or skip Smart Cull before Auto Match.')}if(reset)s.photos.forEach(p=>p.shotId=null);const used=new Set(s.photos.map(p=>p.shotId).filter(Boolean));const available=()=>s.shots.filter(x=>!x.skip&&!used.has(x.id));const photos=[...s.photos].filter(p=>!p.cullExcluded).sort((a,b)=>cullRank(a)-cullRank(b)||(b.cullScore||0)-(a.cullScore||0)||(a.lastModified||0)-(b.lastModified||0)||a.name.localeCompare(b.name));let matched=0;for(const p of photos){if(p.shotId)continue;let opts=available(),pick=opts.find(x=>orientationWanted(x.variant)===p.orientation);if(!pick)pick=opts.find(x=>!orientationWanted(x.variant));if(!pick)pick=opts[0];if(pick){p.shotId=pick.id;used.add(pick.id);matched++}}s.renameOverrides={};save();tab='photos';photoFilter='all';renderWorkspace();toast(`${matched} best-ranked photograph${matched===1?'':'s'} auto-matched from the shot list`)}

function templateFor(s){return D.templates.find(t=>t.id===s.templateId)||D.templates[0]}
function makePreview(s){const t=templateFor(s),assigned=[...s.photos].filter(p=>p.shotId).sort((a,b)=>(a.lastModified||0)-(b.lastModified||0)||a.name.localeCompare(b.name)),seen=new Map();return assigned.map((p,i)=>{const shot=s.shots.find(x=>x.id===p.shotId),vars={client:s.client,shoot:s.name,subject:shot?.subject||'Unassigned',shotListItem:shot?`${shot.subject}_${shot.variant}`:'Unassigned',orientation:shot?.variant||p.orientation||'Shot',number:pad(i+1),shootDate:s.date||'',originalFilename:baseOf(p.name)};let base=t.pattern.replace(/\{(client|shoot|subject|shotListItem|orientation|number|shootDate|originalFilename)\}/g,(_,k)=>vars[k]||'');base=cleanName(base);let candidate=base,dup=(seen.get(base.toLowerCase())||0)+1;seen.set(base.toLowerCase(),dup);if(dup>1)candidate=`${base}_${String(dup).padStart(2,'0')}`;const ext=p.ext||'jpg',generated=`${candidate}.${ext}`,name=s.renameOverrides?.[p.id]||generated;return{photoId:p.id,old:p.name,name,fileKey:p.fileKey,size:p.size,shot}})}
function renderRenameTab(W,s,c){if(!renameDraft.length)renameDraft=makePreview(s);const unassigned=s.photos.filter(p=>!p.shotId).length;W.innerHTML=`<div class="rename-toolbar"><div class="field"><label>Naming template</label><select id="renameTemplate">${D.templates.map(t=>`<option value="${esc(t.id)}" ${t.id===s.templateId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="actions"><button class="btn secondary small" id="regen">${icon('refresh')}Regenerate</button></div></div>${unassigned?`<div class="notice warn">${icon('info')}${unassigned} photograph${unassigned===1?' is':'s are'} unassigned and will not be included in the rename export.</div>`:''}${renameDraft.length?`<div class="rename-list section">${renameDraft.map(r=>`<div class="rename-row"><div class="old">${esc(r.old)}</div><div class="arrow">→</div><input class="rename-edit" data-id="${esc(r.photoId)}" value="${esc(r.name)}"></div>`).join('')}</div><div class="download-box section"><h3>Export renamed copies</h3><p>High Style Match builds one ZIP containing the matched photographs under the names above. Source files stay unchanged.</p><div class="actions"><button class="btn primary" id="downloadZip" ${activeDownload?'disabled':''}>${icon('download')}<span id="downloadLabel">${activeDownload?'Preparing…':`Download ${renameDraft.length} Renamed Photos`}</span></button><button class="btn secondary" id="copyNames">${icon('copy')}Copy Filename List</button></div></div>`:`<div class="empty"><div class="empty-icon">${icon('spark')}</div><h3>Nothing is ready to rename yet</h3><p>Assign photographs to shot-list items first, or use Auto Match from the Photographs tab.</p><button class="btn primary" id="goPhotos">Go to Photographs</button></div>`}`;document.getElementById('renameTemplate').onchange=e=>{s.templateId=e.target.value;s.renameOverrides={};save();renameDraft=makePreview(s);renderWorkspace()};document.getElementById('regen').onclick=()=>{s.renameOverrides={};save();renameDraft=m async function downloadZip(s,rows){if(activeDownload)return;activeDownload=true;const btn=document.getElementById('downloadZip'),label=document.getElementById('downloadLabel');if(btn)btn.disabled=true;const entries=[];try{for(let i=0;i<rows.length;i++){if(label)label.textContent=`Preparing ${i+1} of ${rows.length}…`;const r=rows[i],file=await dbGet(r.fileKey);if(!file)throw new Error(`Missing file: ${r.old}`);entries.push({name:r.name,file})}if(label)label.textContent='Building ZIP…';const zip=await buildStoredZip(entries,(i,n)=>{if(label)label.textContent=`Packaging ${i} of ${n}…`});const a=document.createElement('a'),url=URL.createObjectURL(zip);a.href=url;a.download=`${cleanName(s.client)}_${cleanName(s.name)}_Renamed.zip`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);D.history.unshift({id:uid('hist'),shootId:s.id,at:Date.now(),count:rows.length,template:templateFor(s).name,zipName:a.download});save();toast(`${rows.length} renamed photograph${rows.length===1?'':'s'} exported`)}catch(err){toast(err.message||'The renamed ZIP could not be created.')}finally{activeDownload=false;renderWorkspace()}}
function u16(n){const a=new Uint8Array(2),v=new DataView(a.buffer);v.setUint16(0,n,true);return a}function u32(n){const a=new Uint8Array(4),v=new DataView(a.buffer);v.setUint32(0,n>>>0,true);return a}const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

async function buildStoredZip(entries,progress){const enc=new TextEncoder(),parts=[],central=[];let offset=0;for(let i=0;i<entries.length;i++){const e=entries[i],name=enc.encode(e.name),crc=await crc32Blob(e.file),size=e.file.size,local=new Blob([u32(0x04034b50),u16(20),u16(0x0808),u16(0),u16(0),u16(0),u32(0),u32(0),u32(0),u16(name.length),u16(0),name]);parts.push(local,e.file,u32(0x08074b50),u32(crc),u32(size),u32(size));const cent=new Blob([u32(0x02014b50),u16(20),u16(20),u16(0x0808),u16(0),u16(0),u16(0),u32(crc),u32(size),u32(size),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);central.push(cent);offset+=local.size+size+16;if(progress)progress(i+1,entries.length)}const centralSize=central.reduce((a,b)=>a+b.size,0),centralOffset=offset,eocd=new Blob([u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),u32(centralSize),u32(centralOffset),u16(0)]);return new Blob([...parts,...central,eocd],{type:'application/zip'})}

function renderHistoryTab(W,s){const h=D.history.filter(x=>String(x.shootId)===String(s.id));W.innerHTML=`<div class="panel panel-pad"><div class="panel-head"><div><h2>Export history</h2><p>Every renamed ZIP created for this shoot.</p></div></div>${h.length?`<div class="shoot-list">${h.map(x=>`<div class="shoot-row"><div><strong>${esc(x.zipName||'Renamed export')}</strong><div class="meta">${new Date(x.at).toLocaleString()}</div></div><div><span class="pill success">${x.count} photos</span></div><div class="meta">${esc(x.template||'Template')}</div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">${icon('download')}</div><h3>No exports yet</h3><p>Your renamed ZIP downloads will be recorded here.</p></div>`}</div>`}

function renderTemplates(){setTop('<span>High Style Match</span><span>›</span><b>Naming Templates</b>','<button class="btn primary" id="addTemplate">'+icon('plus')+'New Template</button>');C.innerHTML=head('File naming','Naming templates','Create reusable patterns for how photographs are named after they are matched to the shot list.')+`<div class="notice info">${icon('info')}Available variables: {client}, {shoot}, {subject}, {shotListItem}, {orientation}, {number}, {shootDate}, {originalFilename}</div><div class="template-list section">${D.templates.map(t=>`<div class="template-row"><div><strong>${esc(t.name)}</strong>${t.id===D.settings.defaultTemplate?'<span class="pill purple" style="margin-left:8px">Default</span>':''}<code>${esc(t.pattern)}</code></div><div class="actions"><button class="btn secondary small edit-template" data-id="${esc(t.id)}">${icon('edit')}Edit</button><button class="btn secondary small default-template" data-id="${esc(t.id)}">Make Default</button></div></div>`).join('')}</div>`;document.getElementById('addTemplate').onclick=()=>templateModal();document.querySelectorAll('.edit-template').forEach(b=>b.onclick=()=>templateModal(b.dataset.id));document.querySelectorAll('.default-template').forEach(b=>b.onclick=()=>{D.settings.defaultTemplate=b.dataset.id;save();renderTemplates();toast('Default template updated')})}
function templateModal(id=null){const t=id?D.templates.find(x=>x.id===id):{id:uid('tpl'),name:'New Template',pattern:'{client}_{subject}_{orientation}_{number}'};showModal(`<h3>${id?'Edit':'Create'} naming template</h3><p>Use variables to build a consistent filename. High Style Match always preserves the photograph file extension.</p><div class="field"><label>Template name</label><input id="tplName" value="${esc(t.name)}"></div><div class="field section"><label>Pattern</label><input id="tplPattern" value="${esc(t.pattern)}"></div><div class="actions section" style="justify-content:space-between"><div>${id&&D.templates.length>1?'<button class="btn danger" id="deleteTpl">Delete</button>':''}</div><div class="actions"><button class="btn secondary" data-close>Cancel</button><button class="btn primary" id="saveTpl">Save Template</button></div></div>`);document.getElementById('saveTpl').onclick=()=>{t.name=document.getElementById('tplName').value.trim()||'Template';t.pattern=document.getElementById('tplPattern').value.trim()||'{client}_{subject}_{number}';const i=D.templates.findIndex(x=>x.id===t.id);if(i<0)D.templates.push(t);else D.templates[i]=t;save();closeModal();renderTemplates();toast('Naming template saved')};const del=document.getElementById('deleteTpl');if(del)del.onclick=()=>{D.templates=D.templates.filter(x=>x.id!==t.id);if(D.settings.defaultTemplate===t.id)D.settings.defaultTemplate=D.templates[0]?.id||null;D.shoots.forEach(s=>{if(s.templateId===t.id)s.templateId=D.settings.defaultTemplate});save();closeModal();renderTemplates();toast('Template deleted')}}

function confirmDeleteShoot(s){showModal(`<h3>Delete this shoot?</h3><p>This removes the project, its local photograph copies and its matching history from this browser. Your original files elsewhere on your device are not touched.</p><div class="actions" style="justify-content:flex-end"><button class="btn secondary" data-close>Cancel</button><button class="btn danger" id="confirmDelete">${icon('trash')}Delete Shoot</button></div>`);document.getElementById('confirmDelete').onclick=async()=>{await dbDeletePrefix(`${s.id}:`);D.shoots=D.shoots.filter(x=>x.id!==s.id);D.history=D.history.filter(x=>x.shootId!==s.id);save();closeModal();navigate('shoots');toast('Shoot deleted')}}
function showModal(html){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`;root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);root.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

window.addEventListener('beforeunload',()=>{for(const u of fileURLs.values())URL.revokeObjectURL(u)});
window.__HSM_TEST__={parseShotList,cleanName,coverage,makePreview,autoMatch};
render();
})();
</script>
</body>
</html>
