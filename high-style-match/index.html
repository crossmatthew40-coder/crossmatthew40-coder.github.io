<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Style Match</title>
<style>
:root{--a:#8d6cff;--bg:#f5f5f7;--ink:#111;--muted:#707078;--line:#e2e2e8}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#0f0f13;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin:0 7px 22px}.mark{width:42px;height:42px;border-radius:12px;background:var(--a);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#9a9aa3}nav{display:grid;gap:6px}nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:11px;border-radius:10px;cursor:pointer}nav button.on,nav button:hover{background:#222229;color:#fff}main{padding:30px;min-width:0}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--a);font-weight:800}h1{font-size:30px;margin:5px 0}h2{font-size:19px;margin:3px 0}p,.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{font-size:26px;display:block}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.pri{background:var(--a);color:#fff}.sec{background:#ececf0}.danger{background:#ffe8e8;color:#8b2525}.field{display:grid;gap:5px}.field input,.field textarea,.field select,select{border:1px solid #d7d7dc;border-radius:10px;padding:10px;background:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.section{margin-top:16px}.tabs{display:flex;gap:6px;border-bottom:1px solid #ddd;margin-bottom:16px;overflow:auto}.tabs button{border:0;background:none;padding:10px;font-weight:700;color:#777;cursor:pointer}.tabs button.on{color:#111;border-bottom:2px solid var(--a)}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.photo{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.thumb{aspect-ratio:4/3;background:#24242c;color:#fff;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.meta{padding:10px;display:grid;gap:7px}.meta strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;background:#eeeef3}.pill.ok{background:#e7f6ed;color:#23613c}.pill.warn{background:#fff2d6;color:#785814}.rename{display:grid;grid-template-columns:1fr 26px 1.2fr;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;padding:9px;border-radius:10px;margin:7px 0}.rename input{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px}.note{background:#fff5d8;border:1px solid #ecd79d;color:#6f5316;border-radius:11px;padding:11px;margin:12px 0}.good{background:#e8f7ef;border:1px solid #b8e4cb;color:#235f3c;border-radius:11px;padding:11px}.empty{text-align:center;padding:35px;border:1px dashed #ccc;border-radius:14px}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:11px 13px;border-radius:10px;display:none;z-index:20}.mini{font-size:12px;color:var(--muted)}@media(max-width:780px){.app{display:block}aside{height:auto;display:flex;position:sticky;z-index:9;padding:8px;align-items:center}.brand{margin:0}.brand div:last-child{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{padding:18px 12px}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.rename{grid-template-columns:1fr}.rename span:nth-child(2){display:none}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand"><div class="mark">///</div><div><b>High Style Match</b><small>High Style Group</small></div></div><nav id="nav"><button data-s="dash" class="on">Dashboard</button><button data-s="shoots">Shoots</button><button data-s="new">New Shoot</button><button data-s="templates">Naming Templates</button></nav></aside>
<main id="main"></main>
</div>
<input id="photosInput" type="file" multiple accept="image/*,.cr3,.cr2,.nef,.arw,.raf,.dng,.orf,.rw2" hidden>
<input id="shotInput" type="file" accept=".txt,.csv,text/plain,text/csv" hidden>
<div class="toast" id="toast"></div>
<script>
(()=>{
const KEY='hsmWeb3';
const defaults={shoots:[],templates:[{id:1,name:'Client · Subject · Orientation',pattern:'{client}_{subject}_{orientation}_{number}'},{id:2,name:'Shoot · Shot',pattern:'{shoot}_{shotListItem}_{number}'},{id:3,name:'Subject only',pattern:'{subject}_{orientation}_{number}'}],history:[]};
const D=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;
let screen='dash',shootId=null,tab='summary',seq=1,shotSeq=1;
const files=new Map(),M=document.getElementById('main'),PI=document.getElementById('photosInput'),SI=document.getElementById('shotInput');
const save=()=>localStorage.setItem(KEY,JSON.stringify(D));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=x=>{const t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};
const head=(a,b,c)=>`<div class="ey">${a}</div><h1>${b}</h1><p>${c}</p>`;
const getShoot=()=>D.shoots.find(x=>x.id===shootId);
document.getElementById('nav').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;screen=b.dataset.s;shootId=null;render()};
PI.onchange=()=>{if(shootId)addPhotos([...PI.files]);PI.value=''};
SI.onchange=async()=>{const f=SI.files[0];if(!f)return;const s=getShoot();if(!s)return;try{s.shots=parseShotList(await f.text());save();tab='shots';work();toast(`${s.shots.length} shot-list requirements loaded`)}catch{toast('Could not read shot list')}SI.value=''};
function stats(){return{shoots:D.shoots.length,photos:D.shoots.reduce((a,s)=>a+s.photos.length,0),renamed:D.history.reduce((a,h)=>a+h.count,0)}}
function coverage(s){const c=new Map();s.photos.forEach(p=>p.shot&&c.set(p.shot,(c.get(p.shot)||0)+1));const active=s.shots.filter(x=>!x.skip);return{matched:active.filter(x=>c.get(x.id)).length,total:active.length,missing:active.filter(x=>!c.get(x.id)).length,c}}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===screen));({dash,shoots,new:newShoot,templates,work}[screen]||dash)()}
function shootRows(arr){return arr.length?`<div class="list">${arr.map(s=>{const c=coverage(s);return `<div class="item"><div><b>${esc(s.client)}</b><div class="muted">${esc(s.name)}</div></div><div>${s.photos.length} photos · ${c.matched}/${c.total} matched</div><button class="btn sec open" data-id="${s.id}">Open</button></div>`}).join('')}</div>`:`<div class="empty"><h2>No shoots yet</h2><p>Create a shoot, add a shot list, then import your photographs.</p></div>`}
function wireOpen(){document.querySelectorAll('.open').forEach(b=>b.onclick=()=>{shootId=+b.dataset.id;screen='work';tab='summary';render()})}
function dash(){const q=stats();M.innerHTML=head('High Style Group','High Style Match','Rename a shoot directly from the client shot list.')+`<div class="grid section"><div class="card stat"><b>${q.shoots}</b><span>Shoots</span></div><div class="card stat"><b>${q.photos}</b><span>Photos</span></div><div class="card stat"><b>${q.renamed}</b><span>Renamed copies</span></div><div class="card stat"><b>Local</b><span>Photo processing</span></div></div><div class="panel section"><div class="row" style="justify-content:space-between"><h2>Recent shoots</h2><button class="btn pri" id="newBtn">+ New Shoot</button></div>${shootRows(D.shoots.slice(0,6))}</div><div class="good section"><b>Core workflow:</b> shot list → photographs → auto match → filename preview → renamed downloads.</div>`;document.getElementById('newBtn').onclick=()=>{screen='new';render()};wireOpen()}
function shoots(){M.innerHTML=head('Projects','Shoots','Every shoot keeps its shot list, assignments and naming template.')+`<div class="row section"><button class="btn pri" id="newBtn">+ New Shoot</button></div>${shootRows(D.shoots)}`;document.getElementById('newBtn').onclick=()=>{screen='new';render()};wireOpen()}
function parseShotList(text){const out=[];let subject='';const add=(sub,variant,count=1)=>{for(let i=0;i<count;i++)out.push({id:Date.now()+shotSeq++,subject:sub.trim(),variant:(variant||'Shot').trim(),skip:false})};text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{let count=1,m=line.match(/(?:\s+x\s*|\s*\()(\d+)\)?$/i);if(m){count=Math.max(1,+m[1]);line=line.slice(0,m.index).trim()}let exp=line.match(/^(.+?)\s*[—–-]\s*(Landscape|Portrait|Overhead|Detail|Square|Wide|Interior|Exterior)$/i);if(!exp&&line.includes(',')){const z=line.split(',');if(z.length>=2)exp=[line,z[0].trim(),z[1].trim()]}if(exp){subject=exp[1];add(exp[1],exp[2],count);return}if(/^(Landscape|Portrait|Overhead|Detail|Square|Wide|Interior|Exterior)$/i.test(line)&&subject){add(subject,line,count);return}const grouped=line.match(/^(.+):$/);if(grouped){subject=grouped[1].trim();return}subject=line.replace(/^[-•]\s*/,'').trim()});return out}
function newShoot(){M.innerHTML=head('Create project','New Shoot','Start with the client details and their shot list.')+`<div class="panel section"><div class="form"><div class="field"><label>Client</label><input id="client" placeholder="Cancello Restaurant"></div><div class="field"><label>Shoot name</label><input id="shootName" placeholder="Autumn Menu Shoot"></div><div class="field"><label>Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Location</label><input id="location" placeholder="Manchester"></div><div class="field full"><label>Shot list</label><textarea id="shotText" rows="11" placeholder="Burger — Landscape\nBurger — Portrait\nCarbonara — Overhead\nAperol Spritz — Portrait"></textarea><span class="mini">Supports Subject — Orientation, CSV lines, grouped lists, and counts such as Landscape x2.</span></div></div><div class="row section"><button class="btn pri" id="createBtn">Create Shoot</button><button class="btn sec" id="sampleBtn">Load Sample</button></div></div>`;document.getElementById('sampleBtn').onclick=()=>{document.getElementById('client').value='Cancello Restaurant';document.getElementById('shootName').value='Autumn Menu Shoot';document.getElementById('location').value='Manchester';document.getElementById('shotText').value='Burger — Landscape\nBurger — Portrait\nBurger — Detail\nCarbonara — Landscape\nCarbonara — Overhead x2\nAperol Spritz — Portrait'};document.getElementById('createBtn').onclick=()=>{const client=document.getElementById('client').value.trim(),name=document.getElementById('shootName').value.trim();if(!client||!name)return toast('Add a client and shoot name');const s={id:Date.now(),client,name,date:document.getElementById('date').value,location:document.getElementById('location').value.trim(),shots:parseShotList(document.getElementById('shotText').value),photos:[],templateId:1};D.shoots.unshift(s);save();shootId=s.id;screen='work';tab='summary';render()}}
function templates(){M.innerHTML=head('Filenames','Naming Templates','Choose how High Style Match builds names from the shot list.')+`<div class="panel section"><div class="note">Variables: {client} {shoot} {subject} {shotListItem} {orientation} {number} {shootDate} {originalFilename}</div><div class="list">${D.templates.map(t=>`<div class="item"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.pattern)}</div></div><button class="btn sec editTpl" data-id="${t.id}">Edit</button></div>`).join('')}</div><button class="btn pri section" id="addTpl">+ Add Template</button></div>`;document.getElementById('addTpl').onclick=()=>editTemplate();document.querySelectorAll('.editTpl').forEach(b=>b.onclick=()=>editTemplate(+b.dataset.id))}
function editTemplate(id){const existing=D.templates.find(x=>x.id===id),t=existing||{id:Date.now(),name:'New Template',pattern:'{client}_{subject}_{orientation}_{number}'};M.innerHTML=head('Template','Edit Naming Template','This pattern will be applied automatically from the shot-list assignment.')+`<div class="panel section"><div class="field"><label>Name</label><input id="tplName" value="${esc(t.name)}"></div><div class="field section"><label>Pattern</label><input id="tplPattern" value="${esc(t.pattern)}"></div><div class="row section"><button class="btn pri" id="saveTpl">Save</button><button class="btn sec" id="cancelTpl">Cancel</button></div></div>`;document.getElementById('cancelTpl').onclick=()=>{screen='templates';render()};document.getElementById('saveTpl').onclick=()=>{t.name=document.getElementById('tplName').value.trim()||'Template';t.pattern=document.getElementById('tplPattern').value.trim()||'{client}_{subject}_{orientation}_{number}';const i=D.templates.findIndex(x=>x.id===t.id);i<0?D.templates.push(t):D.templates[i]=t;save();screen='templates';render()}}
function work(){const s=getShoot();if(!s){screen='shoots';return render()}M.innerHTML=head(esc(s.client),esc(s.name),`${esc(s.date||'')}${s.location?' · '+esc(s.location):''}`)+`<div class="tabs"><button data-t="summary" class="${tab==='summary'?'on':''}">Summary</button><button data-t="shots" class="${tab==='shots'?'on':''}">Shot List</button><button data-t="photos" class="${tab==='photos'?'on':''}">Photographs</button><button data-t="rename" class="${tab==='rename'?'on':''}">Rename</button><button data-t="history" class="${tab==='history'?'on':''}">History</button></div><div id="workspace"></div>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;work()});renderTab(s)}
function renderTab(s){const w=document.getElementById('workspace'),c=coverage(s);if(tab==='summary'){w.innerHTML=`<div class="grid"><div class="card stat"><b>${s.shots.length}</b><span>Shot-list items</span></div><div class="card stat"><b>${s.photos.length}</b><span>Photos</span></div><div class="card stat"><b>${c.matched}</b><span>Matched</span></div><div class="card stat"><b>${c.missing}</b><span>Missing</span></div></div><div class="panel section"><h2>1. Shot list</h2><p>${s.shots.length?`${s.shots.length} requirements loaded.`:'Paste or import the client shot list.'}</p><div class="row"><button class="btn sec" id="editShots">${s.shots.length?'Edit / replace':'Add shot list'}</button><button class="btn sec" id="importShots">Import TXT / CSV</button></div></div><div class="panel section"><h2>2. Photographs</h2><p>Add the final images from the shoot.</p><button class="btn pri" id="pickPhotos">Select Photographs</button></div>${s.photos.length&&s.shots.length?`<div class="panel section"><h2>3. Match from shot list</h2><p>High Style Match can assign the imported photos to the shot-list requirements using orientation and import order.</p><button class="btn pri" id="autoMatch">Auto Match From Shot List</button></div>`:''}${c.missing?`<div class="note">${c.missing} shot-list requirement${c.missing===1?'':'s'} still need a photograph.</div>`:s.shots.length?`<div class="good section">Every shot-list requirement has a photograph assigned.</div>`:''}`;document.getElementById('pickPhotos').onclick=()=>PI.click();document.getElementById('importShots').onclick=()=>SI.click();document.getElementById('editShots').onclick=()=>editShotList(s);const a=document.getElementById('autoMatch');if(a)a.onclick=()=>{autoMatch(s);save();tab='photos';work();toast('Photos matched from the shot list')}}else if(tab==='shots'){w.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>Shot List</h2><p>The shot list is the source of the new filenames.</p></div><div class="row"><button class="btn sec" id="replaceShots">Replace</button><button class="btn sec" id="importShots">Import TXT / CSV</button></div></div>${s.shots.length?`<div class="list section">${s.shots.map((x,i)=>`<div class="item"><div><b>${i+1}. ${esc(x.subject)}</b><div class="muted">${esc(x.variant)}</div></div><span class="pill ${c.c.get(x.id)?'ok':'warn'}">${c.c.get(x.id)?'Matched':'Missing'}</span></div>`).join('')}</div>`:`<div class="empty">No shot list loaded.</div>`}`;document.getElementById('replaceShots').onclick=()=>editShotList(s);document.getElementById('importShots').onclick=()=>SI.click()}else if(tab==='photos'){w.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>Photographs</h2><p>Auto-match first, then correct any assignment with the dropdown.</p></div><div class="row"><button class="btn pri" id="pickPhotos">+ Photos</button><button class="btn sec" id="autoMatch" ${!s.photos.length||!s.shots.length?'disabled':''}>Auto Match</button></div></div>${s.photos.length?`<div class="photos section">${s.photos.map(p=>`<div class="photo"><div class="thumb">${p.url?`<img src="${p.url}">`:esc(p.ext)}</div><div class="meta"><strong title="${esc(p.name)}">${esc(p.name)}</strong><span class="mini">${esc(p.orientation)}</span><select class="assign" data-id="${p.id}"><option value="">Unassigned</option>${s.shots.map((x,i)=>`<option value="${x.id}" ${p.shot===x.id?'selected':''}>${i+1}. ${esc(x.subject)} — ${esc(x.variant)}</option>`).join('')}</select></div></div>`).join('')}</div>`:`<div class="empty section">No photographs added yet.</div>`}`;document.getElementById('pickPhotos').onclick=()=>PI.click();document.getElementById('autoMatch').onclick=()=>{autoMatch(s);save();work();toast('Auto match complete')};document.querySelectorAll('.assign').forEach(q=>q.onchange=()=>{const p=s.photos.find(x=>x.id===+q.dataset.id);p.shot=q.value?+q.value:null;save();work()})}else if(tab==='rename'){const rows=renamePreview(s),tpl=D.templates.find(x=>x.id===s.templateId)||D.templates[0];w.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>Rename From Shot List</h2><p>Every assigned photo receives a filename built from its shot-list item.</p></div><select id="tplSelect">${D.templates.map(x=>`<option value="${x.id}" ${x.id===tpl.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="note"><b>Web safety:</b> browsers cannot silently rename the original files on your Mac. This version creates renamed copies; the originals stay untouched.</div>${rows.length?rows.map((r,i)=>`<div class="rename"><span>${esc(r.old)}</span><span>→</span><input class="renameInput" data-i="${i}" value="${esc(r.newName)}"></div>`).join(''):`<div class="empty">Assign photographs to shot-list items first.</div>`}<div class="row section"><button class="btn pri" id="downloadBtn" ${rows.length?'':'disabled'}>Download Renamed Copies</button><button class="btn sec" id="copyBtn" ${rows.length?'':'disabled'}>Copy Filename List</button></div>`;document.getElementById('tplSelect').onchange=e=>{s.templateId=+e.target.value;save();work()};document.querySelectorAll('.renameInput').forEach(i=>i.oninput=()=>rows[+i.dataset.i].newName=forceExt(i.value,rows[+i.dataset.i].old));document.getElementById('copyBtn').onclick=()=>navigator.clipboard.writeText(rows.map(x=>x.newName).join('\n')).then(()=>toast('Filename list copied'));document.getElementById('downloadBtn').onclick=()=>downloadRenamed(s,rows)}else if(tab==='history'){const h=D.history.filter(x=>x.shootId===s.id);w.innerHTML=h.length?`<div class="list">${h.map(x=>`<div class="item"><div><b>${x.count} renamed copies</b><div class="muted">${new Date(x.at).toLocaleString()}</div></div><span>${esc(x.template)}</span></div>`).join('')}</div>`:`<div class="empty">No rename downloads yet.</div>`}}
function editShotList(s){M.innerHTML=head(esc(s.client),'Edit Shot List','Paste the client shot list exactly as supplied.')+`<div class="panel section"><div class="field"><textarea id="shotEdit" rows="16">${esc(s.shots.map(x=>`${x.subject} — ${x.variant}`).join('\n'))}</textarea></div><div class="row section"><button class="btn pri" id="saveShots">Save Shot List</button><button class="btn sec" id="cancelShots">Cancel</button></div></div>`;document.getElementById('cancelShots').onclick=()=>{screen='work';tab='shots';render()};document.getElementById('saveShots').onclick=()=>{s.shots=parseShotList(document.getElementById('shotEdit').value);s.photos.forEach(p=>p.shot=null);save();screen='work';tab='shots';render();toast('Shot list updated')}}
async function addPhotos(fs){const s=getShoot();for(const f of fs){if(!/\.(jpe?g|png|webp|heic|cr3|cr2|nef|arw|raf|dng|orf|rw2)$/i.test(f.name))continue;const id=Date.now()+seq++,key=`${s.id}:${id}`,ext=(f.name.split('.').pop()||'').toUpperCase(),p={id,name:f.name,ext,shot:null,orientation:'Unknown',key,url:null};files.set(key,f);if(f.type.startsWith('image/')&&!/heic/i.test(f.type)){p.url=URL.createObjectURL(f);try{const d=await imageMeta(p.url);p.orientation=d.w===d.h?'Square':d.w>d.h?'Landscape':'Portrait'}catch{}}s.photos.push(p)}save();tab='photos';work();toast(`${fs.length} photograph${fs.length===1?'':'s'} added`)}
function imageMeta(url){return new Promise((res,rej)=>{const i=new Image;i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight});i.onerror=rej;i.src=url})}
function autoMatch(s){s.photos.forEach(p=>p.shot=null);const open=[...s.shots.filter(x=>!x.skip)];for(const p of s.photos){let idx=-1;if(p.orientation!=='Unknown')idx=open.findIndex(x=>x.variant.toLowerCase()===p.orientation.toLowerCase());if(idx<0)idx=0;if(open[idx]){p.shot=open[idx].id;open.splice(idx,1)}}}
function clean(v){return String(v||'').normalize('NFKC').replace(/[<>:"/\\|?*\x00-\x1F]/g,' ').replace(/\s+/g,'_').replace(/_+/g,'_').replace(/^[._ ]+|[._ ]+$/g,'').slice(0,180)||'image'}
function stem(name){return name.replace(/\.[^.]+$/,'')}
function ext(name){const m=name.match(/(\.[^.]+)$/);return m?m[1]:''}
function forceExt(name,original){return clean(stem(name))+ext(original)}
function filenameFrom(s,p,shot,n){const tpl=D.templates.find(x=>x.id===s.templateId)||D.templates[0],vals={client:s.client,shoot:s.name,subject:shot.subject,shotListItem:`${shot.subject}_${shot.variant}`,orientation:shot.variant,number:String(n).padStart(3,'0'),shootDate:s.date||'',originalFilename:stem(p.name)};let name=tpl.pattern.replace(/\{(\w+)\}/g,(_,k)=>vals[k]??'');return clean(name)+ext(p.name)}
function renamePreview(s){let n=1;return s.photos.filter(p=>p.shot).map(p=>{const shot=s.shots.find(x=>x.id===p.shot);return{photo:p,shot,old:p.name,newName:filenameFrom(s,p,shot,n++)}})}
async function downloadRenamed(s,rows){let downloaded=0;for(const r of rows){const f=files.get(r.photo.key);if(!f)continue;const url=URL.createObjectURL(f),a=document.createElement('a');a.href=url;a.download=r.newName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);downloaded++;await new Promise(res=>setTimeout(res,90))}if(downloaded){const tpl=D.templates.find(x=>x.id===s.templateId)||D.templates[0];D.history.unshift({shootId:s.id,count:downloaded,at:Date.now(),template:tpl.name});save();toast(`${downloaded} renamed ${downloaded===1?'copy':'copies'} downloaded`)}else toast('Re-select the photographs before downloading')}
render();
})();
</script>
</body>
</html>
