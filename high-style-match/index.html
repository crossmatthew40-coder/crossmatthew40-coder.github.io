function renderReviewTab(W,s,c){if(!s.cullCompleted){W.innerHTML=`<div class="empty"><div class="empty-icon">${icon('spark')}</div><h3>Run Smart Cull first</h3><p>Review Brief works from Smart Cull groups and shoot order.</p><button class="btn primary" id="reviewCull">Open Smart Cull</button></div>`;document.getElementById('reviewCull').onclick=()=>{tab='cull';renderWorkspace()};return}const sum=reviewSummary(s),rows=s.shots.filter(x=>!x.skip).map(shot=>({shot,...reviewInfo(s,shot)})).filter(r=>reviewFilter==='all'||r.status===reviewFilter);W.innerHTML=`<div class="review-hero"><div><div class="eyebrow">Shoot completion assistant</div><h2>Does this shoot fulfil the brief?</h2><p>Each requirement is checked against its assigned best frame. Low-confidence matches, technical flags and missing shots stay visible before anything is renamed.</p></div><div class="actions"><button class="btn secondary" id="rebuildMatch">${icon('refresh')}Rebuild Suggestions</button><button class="btn primary" id="approveReview" ${sum.missing?'disabled':''}>${icon('check')}${s.reviewApproved?'Approved':'Approve for Rename'}</button></div></div><div class="grid review-summary section"><div class="cull-stat"><label>Covered</label><b>${sum.covered}</b></div><div class="cull-stat"><label>Check</label><b>${sum.check}</b></div><div class="cull-stat"><label>Missing</label><b>${sum.missing}</b></div><div class="cull-stat"><label>Total brief</label><b>${sum.total}</b></div></div><div class="cull-toolbar"><div class="filters">${[['all','All'],['good','Covered'],['check','Check'],['missing','Missing']].map(x=>`<button data-review-filter="${x[0]}" class="${reviewFilter===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div class="muted" style="font-size:11px">${s.reviewApproved?'Brief approved for rename':'Review required before final rename'}</div></div><div class="review-list">${rows.map(({shot,p,alts,conf,issues,status})=>`<div class="review-row"><div class="review-thumb" ${p?`id="review-thumb-${esc function renderRenameTab(W,s,c){if(!s.reviewApproved){W.innerHTML=`<div class="empty"><div class="empty-icon">${icon('eye')}</div><h3>Review the brief before renaming</h3><p>High Style Match keeps the rename stage behind the final coverage review so missing or low-confidence requirements are not hidden by a clean filename list.</p><button class="btn primary" id="goReview">${icon('eye')}Open Review Brief</button></div>`;document.getElementById('goReview').onclick=()=>{tab='review';renderWorkspace()};return}if(!renameDraft.length)renameDraft=makePreview(s);const rs=s.renameSettings||{},unassigned=s.photos.filter(p=>!p.shotId&&!p.cullExcluded).length,sample=renameDraft[0]?.name||'Client_Subject_Landscape_001.jpg';W.innerHTML=`<div class="panel panel-pad"><div class="panel-head"><div><h2>Rename Studio</h2><p>Build a reusable naming system, preview every filename and export renamed copies.</p></div><button class="btn secondary small" id="regen">${icon('refresh')}Regenerate</button></div><div class="rename-settings-grid"><div class="field"><label>Naming template</label><select id="renameTemplate">${D.templates.map(t=>`<option value="${esc(t.id)}" ${t.id===s.templateId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Separator</label><select id="renameSep"><option value="_" ${rs.separator==='_'?'selected':''}>Underscore _</option><option value="-" ${rs.separator==='-'?'selected':''}>Hyphen -</option><option value="space" ${rs.separator==='space'?'selected':''}>Space</option></select></div><div class="field"><label>Case</label><select id="renameCase"><option value="asis" ${rs.caseMode==='asis'?'selected':''}>As entered</option><option value="title" ${rs.caseMode==='title'?'selected':''}>Title Case</option><option value="lower" ${rs.caseMode==='lower'?'selected':''}>lowercase</option><option value="upper" ${rs.caseMode==='upper'?'selected':''}>UPPERCASE</option></select></div><div class="field"><label>Numbering</label><div style="dis function liveState(s){if(!s.liveShoot||typeof s.liveShoot!=='object')s.liveShoot={status:'not_started',startedAt:null,endedAt:null,currentShotId:null,items:{}};const st=s.liveShoot;st.items=st.items&&typeof st.items==='object'?st.items:{};for(const shot of s.shots){if(!st.items[shot.id])st.items[shot.id]={state:'pending',captures:0,note:'',updatedAt:null}}if(!st.currentShotId||!s.shots.some(x=>x.id===st.currentShotId))st.currentShotId=s.shots.find(x=>!x.skip)?.id||s.shots[0]?.id||null;return st}

function liveSummary(s){const rows=s.shots.filter(x=>!x.skip),out={total:rows.length,done:0,pending:0,reshoot:0,skipped:0,captures:0,percent:0,ready:false};for(const shot of rows){const it=liveItem(s,shot.id);out.captures+=Number(it.captures)||0;if(it.state==='done')out.done++;else if(it.state==='reshoot')out.reshoot++;else if(it.state==='skipped')out.skipped++;else out.pending++}out.percent=out.total?Math.round(out.done/out.total*100):0;out.ready=out.total>0&&out.done===out.total;return out}
function liveStateText(state){return state==='done'?'Covered':state==='reshoot'?'Needs another':state==='skipped'?'Skipped':'Not shot'}
function liveStateClass(state){return state==='done'?'done':state==='reshoot'?'reshoot':state==='skipped'?'skipped':''}
function liveNextUnresolvedId(s,afterId){const rows=s.shots.filter(x=>!x.skip),idx=Math.max(0,rows.findIndex(x=>x.id===afterId));for(let off=1;off<=rows.length;off++){const shot=rows[(idx+off)%rows.length],it=liveItem(s,shot.id);if(it.state!=='done'&&it.state!=='skipped')return shot.id}return rows[(idx+1)%Math.max(1,rows.length)]?.id||afterId}
function startLiveShoot(s){const st=liveState(s),first=!st.startedAt;st.status='live';st.startedAt=st.startedAt||Date.now();st.endedAt=null;if(first)activity(s,'Live Shoot started',`${s.shots.filter(x=>!x.skip).length} requirements`);save();renderWorkspace();toast('Live Shoot started')}
function resumeLiveShoot(s){const st=liveState(s);st.status='live';st.endedAt=null;activity(s,'Live Shoot resumed');save();renderWorkspace()}
function liveSetCurrent(s,id){const st=liveState(s);if(!s.shots.some(x=>x.id===id))return;st.currentShotId=id;if(st.status==='not_started')st.status='live';save();renderWorkspace()}
function liveBumpCapture(s,id){const st=liveState(s),it=liveItem(s,id);it.captures=(Number(it.captures)||0)+1;it.state='done';it.updatedAt=Date.now();st.status='live';save();renderWorkspace();toast(`${it.captures} capture${it.captures===1?'':'s'} logged`)}
function liveMark(s,id,state){const st=liveState(s),it=liveItem(s,id);it.state=state;it.updatedAt=Date.now();st.status='live';if(state==='done'&&Number(it.captures)===0)it.captures=1;if(state==='done'||state==='skipped'){const next=liveNextUnresolvedId(s,id);if(next)st.currentShotId=next}save();renderWorkspace()}
function liveMove(s,dir){const st=liveState(s),rows=s.shots.filter(x=>!x.skip);if(!rows.length)return;let i=rows.findIndex(x=>x.id===st.currentShotId);if(i<0)i=0;i=(i+dir+rows.length)%rows.length;st.currentShotId=rows[i].id;save();renderWorkspace()}
function liveNoteModal(s,id){const shot=s.shots.find(x=>x.id===id);if(!shot)return;const it=liveItem(s,id);showModal(`<h3>Live note — ${esc(shot.subject)}</h3><p>${esc(shot.variant)} · keep a quick on-location note with this requirement.</p><div class="field"><textarea id="liveNoteText" style="min-height:130px" placeholder="Client wants another angle, garnish moved, reshoot after mains…">${esc(it.note||'')}</textarea></div><div class="actions section" style="justify-content:flex-end"><button class="btn secondary" data-close>Cancel</button><button class="btn primary" id="saveLiveNote">${icon('save')}Save Note</button></div>`);document.getElementById('saveLiveNote').onclick=()=>{it.note=document.getElementById('liveNoteText').value.trim();it.updatedAt=Date.now();save();closeModal();renderWorkspace();toast('Live note saved')}}
function finishLiveShoot(s,force=false){const sum=liveSummary(s);if(!sum.ready&&!force)return liveShootCheck(s);const st=liveState(s);st.status='complete';st.endedAt=Date.now();activity(s,'Live Shoot completed',`${sum.done}/${sum.total} requirements covered${sum.reshoot?` · ${sum.reshoot} need another`:''}${sum.pending?` · ${sum.pending} missing`:''}`);save();closeModal();renderWorkspace();toast(sum.ready?'Live Shoot complete — all required shots covered':'Live Shoot ended with outstanding shots')}
function liveShootCheck(s){const sum=liveSummary(s),missing=[],reshoot=[],skipped=[];for(const shot of s.shots.filter(x=>!x.skip)){const it=liveItem(s,shot.id);if(it.state==='pending')missing.push(shot);if(it.state==='reshoot')reshoot.push(shot);if(it.state==='skipped')skipped.push(shot)}const rows=(arr,label)=>arr.length?`<div class="section"><strong>${label}</strong><div class="shot-note" style="margin-top:7px">${arr.map(x=>`${esc(x.subject)} — ${esc(x.variant)}`).join('<br>')}</div></div>`:'';showModal(`<h3>${sum.ready?'Shoot coverage complete':'Check before you leave'}</h3><p>${sum.ready?'Every required shot has been marked covered.':'High Style Match found requirements that still need your attention.'}</p><div class="live-check-grid"><div class="live-check-stat"><b>${sum.done}</b><span>Covered</span></div><div class="live-check-stat"><b>${sum.pending}</b><span>Missing</span></div><div class="live-check-stat"><b>${sum.reshoot}</b><span>Needs another</span></div><div class="live-check-stat"><b>${sum.skipped}</b><span>Skipped</span></div></div>${rows(missing,'Still missing')}${rows(reshoot,'Needs another frame')}${rows(skipped,'Skipped on location')}<div class="actions section" style="justify-content:flex-end"><button class="btn secondary" data-close>Keep Shooting</button>${sum.ready?`<button class="btn primary" id="finishLive">${icon('check')}Finish Live Shoot</button>`:`<button class="btn secondary" id="finishLiveAnyway">Finish Anyway</button>`}</div>`);const a=document.getElementById('finishLive');if(a)a.onclick=()=>finishLiveShoot(s,true);const b=document.getElementById('finishLiveAnyway');if(b)b.onclick=()=>finishLiveShoot(s,true)}

ef note</strong><br>${esc(current.notes)}</div>`:''}${it?.note?`<div class="live-shot-notes"><strong>Live note</strong><br>${esc(it.note)}</div>`:''}<div class="live-capture-number"><b>${it?.captures||0}</b><span>captures logged for this requirement</span></div><div class="live-touch-controls"><button class="live-touch primary" id="liveCapture">+ Log Capture</button><button class="live-touch success" data-live-state="done">✓ Mark Done</button><button class="live-touch warn" data-live-state="reshoot">Needs Another</button><button class="live-touch ghost" data-live-state="skipped">Skip</button></div><div class="actions section"><button class="btn secondary" id="livePrev">← Previous</button><button class="btn secondary" id="liveNote">${icon('edit')}Add Note</button><button class="btn primary" id="liveNext">Next →</button></div></div><div class="grid" style="gap:16px"><div class="live-next-card"><label>Next</label><h3>${esc(next?.subject||'All done')}</h3><p>${esc(next?.variant||'Run the coverage check')}</p><div class="live-side-actions"><button class="btn primary" id="liveCheck">${icon('check')}Check Before Leaving</button><button class="btn secondary" id="liveFullscreen">Full Screen</button>${st.status==='complete'?`<button class="btn secondary" id="resumeLive">${icon('refresh')}Resume Live Shoot</button>`:''}</div></div><div class="live-queue-panel"><div class="live-queue-head"><h3>Shoot queue</h3><span class="pill purple">${sum.done}/${sum.total}</span></div><div class="live-queue">${rows.map((shot,n)=>{const x=liveItem(s,shot.id);return `<button class="live-queue-row ${shot.id===current?.id?'current':''}" data-live-shot="${esc(shot.id)}"><div><strong>${n+1}. ${esc(shot.subject)}</strong><small>${esc(shot.variant)}${x.note?' · note saved':''}</small></div><div class="live-queue-meta">${x.note?'<span class="live-note-dot"></span>':''}<span class="live-state ${liveStateClass(x.state)}">${liveStateText(x.state)}</span><span class="pill">${x.captures||0}</span></div></ function renderSettings(){setTop('<span>High Style Match</span><span>›</span><b>Settings</b>','');const st=D.settings;C.innerHTML=head('Workflow settings','Performance, storage & RAW','Tune how High Style Match groups a shoot and see what the browser edition can do locally.')+`<div class="settings-grid"><div class="setting-card"><h2>Smart Cull performance</h2><p>Large shoots are analysed progressively and cached. Shoot-order grouping limits near-duplicate comparisons to nearby capture windows.</p><div class="field"><label>New shoot group after</label><select id="gapSetting"><option value="20" ${+st.groupGapSeconds===20?'selected':''}>20 seconds</option><option value="45" ${+st.groupGapSeconds===45?'selected':''}>45 seconds</option><option value="90" ${+st.groupGapSeconds===90?'selected':''}>90 seconds</option><option value="180" ${+st.groupGapSeconds===180?'selected':''}>3 minutes</option></select></div><div class="field section"><label>Parallel image analysis</label><select id="concurrencySetting"><option value="1" ${+st.analysisConcurrency===1?'selected':''}>1 — safest</option><option value="2" ${+st.analysisConcurrency===2?'selected':''}>2 — recommended</option><option value="3" ${+st.analysisConcurrency===3?'selected':''}>3 — faster</option><option value="4" ${+st.analysisConcurrency===4?'selected':''}>4 — powerful desktop</option></select></div></div><div class="setting-card"><h2>Local storage</h2><p>Projects and source copies live in IndexedDB on this device. Persistent storage reduces the chance of the browser clearing them automatically.</p><button class="btn primary" id="settingsPersist">${icon('save')}Request Persistent Storage</button><div id="storageStatus" class="section"></div></div><div class="setting-card"><h2>Shot-list document support</h2><p>Simple formats are parsed directly. Excel, PDF and Word readers are loaded only when you choose those formats.</p><div class="format-badges"><span>XLSX / XLS</span><span>PDF text</span><span>DOCX</span><span>CSV</span><span>TSV</span><span>TXT</span><span>MD</span><span>JSON</span></div><div class="shot-note section">Scanned image-only PDFs still require OCR before import.</div></div><div class="setting-card"><h2>WeTransfer delivery</h2><p>The Deliver stage prepares client transfer details, opens WeTransfer and records the final transfer link or email hand-off. A private API key is never stored in the public web app.</p><div class="provider-card"><div class="provider-brand"><div class="provider-logo">W</div><div><strong>WeTransfer</strong><div class="shot-note">Configured as the default delivery provider</div></div></div><span class="pill success">Ready</span></div></div><div class="setting-card"><div class="desktop-cap"><span class="desktop-only-badge">PRO WORKFLOW</span><h2 style="color:#fff;margin-top:10px">RAW & desktop mode</h2><p>Browser High Style Match now attempts embedded JPEG previews from CR3, CR2, NEF, ARW, RAF, DNG, ORF and RW2 files. In-place filesystem renaming, folder watching, full RAW decoding and a future securely authenticated one-click WeTransfer API connection remain native/backend capabilities because browsers intentionally restrict direct file-system and secret-key control.</p></div></div></div>`;document.getElementById('gapSetting').onchange=e=>{D.settings.groupGapSeconds=+e.target.value;save();toast('Shoot-order grouping updated')};document.getElementById('concurrencySetting').onchange=e=>{D.settings.analysisConcurrency=+e.target.value;save();toast('Analysis performance updated')};document.getElementById('settingsPersist').onclick=protectStorage;updateStorageUI();appendLiveShootSettings()}
function renderTemplates(){setTop('<span>High Style Match</span><span>›</span><b>Naming Templates</b>','<button class="btn primary" id="addTemplate">'+icon('plus')+'New Template</button>');C.innerHTML=head('File naming','Naming templates','Create reusable patterns for how photographs are named after they are matched to the shot list.')+`<div class="notice info">${icon('info')}Available variables: {client}, {shoot}, {subject}, {shotListItem}, {orientation}, {number}, {shootDate}, {originalFilename}</div><div class="template-list section">${D.templates.map(t=>`<div class="template-row"><div><strong>${esc(t.name)}</strong>${t.id===D.settings.defaultTemplate?'<span class="pill purple" style="margin-left:8px">Default</span>':''}<code>${esc(t.pattern)}</code></div><div class="actions"><button class="btn secondary small edit-template" data-id="${esc(t.id)}">${icon('edit')}Edit</button><button class="btn secondary small default-template" data-id="${esc(t.id)}">Make Default</button></div></div>`).join('')}</div>`;document.getElementById('addTemplate').onclick=()=>templateModal();document.querySelectorAll('.edit-template').forEach(b=>b.onclick=()=>templateModal(b.dataset.id));document.querySelectorAll('.default-template').forEach(b=>b.onclick=()=>{D.settings.defaultTemplate=b.dataset.id;save();renderTemplates();toast('Default template updated')})}
function templateModal(id=null){const t=id?D.templates.find(x=>x.id===id):{id:uid('tpl'),name:'New Template',pattern:'{client}_{subject}_{orientation}_{number}'};showModal(`<h3>${id?'Edit':'Create'} naming template</h3><p>Use variables to build a consistent filename. High Style Match always preserves the photograph file extension.</p><div class="field"><label>Template name</label><input id="tplName" value="${esc(t.name)}"></div><div class="field section"><label>Pattern</label><input id="tplPattern" value="${esc(t.pattern)}"></div><div class="actions section" style="justify-content:space-between"><div>${id&&D.templates.length>1?'<button class="btn danger" id="deleteTpl">Delete</button>':''}</div><div class="actions"><button class="btn secondary" data-close>Cancel</button><button class="btn primary" id="saveTpl">Save Template</button></div></div>`);document.getElementById('saveTpl').onclick=()=>{t.name=document.getElementById('tplName').value.trim()||'Template';t.pattern=document.getElementById('tplPattern').value.trim()||'{client}_{subject}_{number}';const i=D.templates.findIndex(x=>x.id===t.id);if(i<0)D.templates.push(t);else D.templates[i]=t;save();closeModal();renderTemplates();toast('Naming template saved')};const del=document.getElementById('deleteTpl');if(del)del.onclick=()=>{D.templates=D.templates.filter(x=>x.id!==t.id);if(D.settings.defaultTemplate===t.id)D.settings.defaultTemplate=D.templates[0]?.id||null;D.shoots.forEach(s=>{if(s.templateId===t.id)s.templateId=D.settings.defaultTemplate});save();closeModal();renderTemplates();toast('Template deleted')}}

function confirmDeleteShoot(s){showModal(`<h3>Delete this shoot?</h3><p>This removes the project, its local photograph copies and its matching history from this browser. Your original files elsewhere on your device are not touched.</p><div class="actions" style="justify-content:flex-end"><button class="btn secondary" data-close>Cancel</button><button class="btn danger" id="confirmDelete">${icon('trash')}Delete Shoot</button></div>`);document.getElementById('confirmDelete').onclick=async()=>{await dbDeletePrefix(`${s.id}:`);D.shoots=D.shoots.filter(x=>x.id!==s.id);D.history=D.history.filter(x=>x.shootId!==s.id);D.activity=D.activity.filter(x=>x.shootId!==s.id);save();closeModal();navigate('shoots');toast('Shoot deleted')}}
function showModal(html){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`;root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);root.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

window.addEventListener('beforeunload',()=>{for(const u of fileURLs.values())URL.revokeObjectURL(u)});
window.__HSM_TEST__={version:APP_VERSION,parseShotList,cleanName,coverage,makePreview,autoMatch,reviewSummary,hammingHash,liveSummary,liveShootEntitled};
render();
})();
</script>
