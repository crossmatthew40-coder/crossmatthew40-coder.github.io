function uid(prefix='id'){return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`}

function save(){try{safeStorage.setItem(KEY,JSON.stringify(D))}catch(err){console.warn(err);toast('This browser is running low on project storage. Export a backup before adding more files.')}}
function loadData(){try{const cur=JSON.parse(safeStorage.getItem(KEY)||'null');if(cur)return cur;const old=JSON.parse(safeStorage.getItem(OLD_KEY)||'null');if(old){const migrated=structuredClone(defaults);migrated.shoots=(old.shoots||[]).map(s=>({id:String(s.id),client:s.client||'',name:s.name||'',date:s.date||'',location:s.location||'',createdAt:Date.now(),shotText:'',shotSourceName:'Migrated shot list',shots:(s.shots||[]).map(x=>({id:String(x.id),subject:x.subject||'Shot',variant:x.variant||'Shot',notes:'',skip:!!x.skip})),photos:(s.photos||[]).map(p=>({id:String(p.id),name:p.name,ext:p.ext||extOf(p.name),orientation:p.ori||'Unknown',width:0,height:0,size:0,lastModified:0,captureAt:0,shotId:p.shot?String(p.shot):null,fileKey:null,previewKey:null,needsReconnect:true})),templateId:'t1',renameOverrides:{},reviewApproved:false,undoStack:[]}));safeStorage.setItem(KEY,JSON.stringify(migrated));return migrated}}catch{}return structuredClone(defaults)}
function normalizeData(data){data=data&&typeof data==='object'?data:structuredClone(defaults);data.shoots=Array.isArray(data.shoots)?data.shoots:[];data.templates=Array.isArray(data.templates)&&data.templates.length?data.templates:structuredClone(defaults.templates);data.history=Array.isArray(data.history)?data.history:[];data.activity=Array.isArray(data.activity)?data.activity:[];data.settings={...defaults.settings,...(data.settings||{})};for(const s of data.shoots){s.id=String(s.id||uid('shoot'));s.client=s.client||'';s.name=s.name||'';s.shots=Array.isArray(s.shots)?s.shots:[];s.photos=Array.isArray(s.photos)?s.photos:[];s.renameOverrides=s.renameOverrides||{};s.renameSettings={separator:data.settings.defaultSeparator,caseMode:data.settings.defaultCase,numberStart:data.settings.numberStart,numberPad:data.settings.numberPad,...(s.renameSettings||{})};s.reviewApproved=!!s.reviewApproved;s.undoStack=Array.isArray(s.undoStack)?s.undoStack.slice(-8):[];s.updatedAt=s.updatedAt||s.createdAt||Date.now();for(const x of s.shots){x.id=String(x.id||uid('shot'));x.subject=x.subject||'Shot';x.variant=x.variant||'Shot';x.notes=x.notes||'';x.skip=!!x.skip}for(const p of s.photos){p.id=String(p.id||uid('photo'));p.ext=p.ext||extOf(p.name);p.captureAt=p.captureAt||p.lastModified||0;p.previewKey=p.previewKey||null;p.cullExcluded=!!p.cullExcluded;p.cullManualPick=!!p.cullManualPick}}return data}

function openDB(){return new Promise((resolve,reject)=>{try{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}catch(err){reject(err)}})}

async function dbGet(key){if(!key)return null;try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const q=tx.objectStore(DB_STORE).get(key);q.onsuccess=()=>{db.close();res(q.result||memoryFiles.get(key)||null)};q.onerror=()=>{db.close();rej(q.error)}})}catch{return memoryFiles.get(key)||null}}
async function dbDeletePrefix(prefix){for(const key of [...memoryFiles.keys()])if(String(key).startsWith(prefix))memoryFiles.delete(key);try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite'),store=tx.objectStore(DB_STORE),q=store.openCursor();q.onsuccess=()=>{const c=q.result;if(!c)return;if(String(c.key).startsWith(prefix))c.delete();c.continue()};tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}})}catch{}}

const SCRIPT_CACHE=new Map();

function parseDelimitedLine(line,delim){const cells=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===delim&&!quoted){cells.push(cur.trim());cur=''}else cur+=ch}cells.push(cur.trim());return cells}
function truthyCell(v){return /^(1|x|yes|y|true|✓|check|required|shot)$/i.test(String(v||'').trim())||/^\d+$/.test(String(v||'').trim())&&+v>0}
function parseShotList(text){const out=[],raw=String(text||'').trim();if(!raw)return out;const variants=['Landscape','Portrait','Overhead','Top Down','Detail','Macro','Square','Wide','Interior','Exterior','Hero','Close Up','Close-up','45 Degree','Lifestyle','Action','People','Room','Food','Drink'];const variantRe=new RegExp(`^(${variants.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})$`,'i');const add=(subject,variant='Shot',count=1,notes='',sourceRow='')=>{subject=String(subject||'').trim();variant=String(variant||'Shot').trim()||'Shot';if(!subject)return;for(let i=0;i<Math.max(1,count||1);i++)out.push({id:uid('shot'),subject,variant,notes:String(notes||'').trim(),sourceRow,skip:false})};
 try{if(raw[0]==='['||raw[0]==='{'){const j=JSON.parse(raw),arr=Array.isArray(j)?j:(j.shots||j.items||[]);if(Array.isArray(arr)){for(const r of arr){if(typeof r==='string')add(r);else add(r.subject||r.dish||r.item||r.name||r.shot,r.variant||r.orientation||r.view||r.type||'Shot',+(r.count||r.qty||r.quantity||1),r.notes||r.note||'')}if(out.length)return out}}}catch{}
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let delim=null;const first=lines[0]||'';if(first.includes('\t'))delim='\t';else if(first.includes(','))delim=',';else if(first.includes(';'))delim=';';if(delim){const rows=lines.map(l=>parseDelimitedLine(l,delim)),headers=rows[0].map(x=>x.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()),known=['subject','dish','item','name','shot','requirement','orientation','variant','view','type','count','qty','quantity','notes','note'];const headerish=headers.some(h=>known.includes(h)||variants.some(v=>v.toLowerCase()===h));if(headerish){const idx=(names)=>headers.findIndex(h=>names.includes(h));const si=idx(['subject','dish','item','name','shot','requirement','photo']),vi=idx(['orientation','variant','view','type','format']),ci=idx(['count','qty','quantity','number']),ni=idx(['notes','note','comments','comment']);const variantCols=headers.map((h,i)=>({h,i,v:variants.find(v=>v.toLowerCase()===h)})).filter(x=>x.v);for(let r=1;r<rows.length;r++){const row=rows[r],subject=(row[si>=0?si:0]||'').trim(),notes=ni>=0?(row[ni]||''):'';if(!subject)continue;let made=0;for(const vc of variantCols){if(truthyCell(row[vc.i])){const q=/^\d+$/.test(row[vc.i])?+row[vc.i]:1;add(subject,vc.v,q,notes,lines[r]);made+=q}}if(made)continue;const variant=vi>=0?(row[vi]||'Shot'):'Shot',count=ci>=0?Math.max(1,parseInt(row[ci],10)||1):1;if(/[|/]/.test(variant)){for(const v of variant.split(/[|/]/).map(x=>x.trim()).filter(Boolean))add(subject,v,count,notes,lines[r])}else add(subject,variant,count,notes,lines[r])}if(out.length)return out}}
 let subject='';for(let i=0;i<lines.length;i++){let line=lines[i].replace(/^[-•▪◦]\s*/,'').replace(/^\d+[.)]\s*/,'').trim();if(!line)continue;let notes='';const noteMatch=line.match(/\s+(?:notes?|comments?)\s*[:=-]\s*(.+)$/i);if(noteMatch){notes=noteMatch[1].trim();line=line.slice(0,noteMatch.index).trim()}let count=1;const cm=line.match(/(?:\s+x\s*|\s*\()(\d+)\)?$/i);if(cm){count=Math.max(1,+cm[1]);line=line.slice(0,cm.index).trim()}const exp=line.match(new RegExp(`^(.+?)\\s*[—–-]\\s*(${variants.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})$`,'i'));if(exp){subject=exp[1].trim();add(subject,exp[2],count,notes,lines[i]);continue}if(variantRe.test(line)&&subject){add(subject,line,count,notes,lines[i]);continue}const group=line.match(/^(.+):$/);if(group){subject=group[1].trim();continue}const next=(lines[i+1]||'').replace(/^[-•▪◦]\s*/,'').replace(/^\d+[.)]\s*/,'').trim();if(next&&variantRe.test(next)){subject=line;continue}subject=line;add(line,'Shot',count,notes,lines[i])}return out}
function coverage(s){const counts=new Map();s.photos.forEach(p=>p.shotId&&counts.set(p.shotId,(counts.get(p.shotId)||0)+1));const active=s.shots.filter(x=>!x.skip);const matched=active.filter(x=>counts.get(x.id)).length;return{matched,total:active.length,missing:Math.max(0,active.length-matched),counts,percent:active.length?Math.round(matched/active.length*100):0}}

function templateFor(s){return D.templates.find(t=>t.id===s.templateId)||D.templates[0]}

function renderRenameTab(W,s,c){if(!s.reviewApproved){W.innerHTML=`<div class="empty"><div class="empty-icon">${icon('eye')}</div><h3>Review the brief before renaming</h3><p>High Style Match keeps the rename stage behind the final coverage review so missing or low-confidence requirements are not hidden by a clean filename list.</p><button class="btn primary" id="goReview">${icon('eye')}Open Review Brief</button></div>`;document.getElementById('goReview').onclick=()=>{tab='review';renderWorkspace()};return}if(!renameDraft.length)renameDraft=makePreview(s);const rs=s.renameSettings||{},unassigned=s.photos.filter(p=>!p.shotId&&!p.cullExcluded).length,sample=renameDraft[0]?.name||'Client_Subject_Landscape_001.jpg';W.innerHTML=`<div class="panel panel-pad"><div class="panel-head"><div><h2>Rename Studio</h2><p>Build a reusable naming system, preview every filename and export renamed copies.</p></div><button class="btn secondary small" id="regen">${icon('refresh')}Regenerate</button></div><div class="rename-settings-grid"><div class="field"><label>Naming template</label><select id="renameTemplate">${D.templates.map(t=>`<option value="${esc(t.id)}" ${t.id===s.templateId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Separator</label><select id="renameSep"><option value="_" ${rs.separator==='_'?'selected':''}>Underscore _</option><option value="-" ${rs.separator==='-'?'selected':''}>Hyphen -</option><option value="space" ${rs.separator==='space'?'selected':''}>Space</option></select></div><div class="field"><label>Case</label><select id="renameCase"><option value="asis" ${rs.caseMode==='asis'?'selected':''}>As entered</option><option value="title" ${rs.caseMode==='title'?'selected':''}>Title Case</option><option value="lower" ${rs.caseMode==='lower'?'selected':''}>lowercase</option><option value="upper" ${rs.caseMode==='upper'?'selected':''}>UPPERCASE</option></select></div><div class="field"><label>Numbering</label><div style="dis async function downloadZip(s,rows){if(activeDownload)return;activeDownload=true;const btn=document.getElementById('downloadZip'),label=document.getElementById('downloadLabel');if(btn)btn.disabled=true;const entries=[];try{for(let i=0;i<rows.length;i++){if(label)label.textContent=`Preparing ${i+1} of ${rows.length}…`;const r=rows[i],file=await dbGet(r.fileKey);if(!file)throw new Error(`Missing file: ${r.old}`);entries.push({name:r.name,file})}if(label)label.textContent='Building ZIP…';const zip=await buildStoredZip(entries,(i,n)=>{if(label)label.textContent=`Packaging ${i} of ${n}…`});const a=document.createElement('a'),url=URL.createObjectURL(zip);a.href=url;a.download=`${cleanName(s.client)}_${cleanName(s.name)}_Renamed.zip`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);D.history.unshift({id:uid('hist'),shootId:s.id,at:Date.now(),count:rows.length,template:templateFor(s).name,zipName:a.download});activity(s,'Renamed export',`${rows.length} photographs · ${a.download}`);save();toast(`${rows.length} renamed photograph${rows.length===1?'':'s'} exported`)}catch(err){toast(err.message||'The renamed ZIP could not be created.')}finally{activeDownload=false;renderWorkspace()}}
function u16(n){const a=new Uint8Array(2),v=new DataView(a.buffer);v.setUint16(0,n,true);return a}function u32(n){const a=new Uint8Array(4),v=new DataView(a.buffer);v.setUint32(0,n>>>0,true);return a}const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

async function buildStoredZip(entries,progress){const enc=new TextEncoder(),parts=[],central=[];let offset=0;for(let i=0;i<entries.length;i++){const e=entries[i],name=enc.encode(e.name),crc=await crc32Blob(e.file),size=e.file.size,local=new Blob([u32(0x04034b50),u16(20),u16(0x0808),u16(0),u16(0),u16(0),u32(0),u32(0),u32(0),u16(name.length),u16(0),name]);parts.push(local,e.file,u32(0x08074b50),u32(crc),u32(size),u32(size));const cent=new Blob([u32(0x02014b50),u16(20),u16(20),u16(0x0808),u16(0),u16(0),u16(0),u32(crc),u32(size),u32(size),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);central.push(cent);offset+=local.size+size+16;if(progress)progress(i+1,entries.length)}const centralSize=central.reduce((a,b)=>a+b.size,0),centralOffset=offset,eocd=new Blob([u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),u32(centralSize),u32(centralOffset),u16(0)]);return new Blob([...parts,...central,eocd],{type:'application/zip'})}

).toLocaleString()}</div></div><div><span class="pill success">${x.count} photos</span></div><div class="meta">${esc(x.template||'Template')}</div></div>`).join('')}</div>`:`<div class="empty"><p>No renamed exports yet.</p></div>`}</div></div></div>`;const hu=document.getElementById('historyUndo');if(hu)hu.onclick=()=>undoLast(s);document.getElementById('metadataBackup').onclick=()=>downloadMetadataBackup(s);document.getElementById('restoreBackup').onclick=()=>BACKUP.click();document.getElementById('fullArchive').onclick=()=>downloadFullArchive(s);document.getElementById('persistStorage').onclick=protectStorage;updateStorageUI()}

function renderSettings(){setTop('<span>High Style Match</span><span>›</span><b>Settings</b>','');const st=D.settings;C.innerHTML=head('Workflow settings','Performance, storage & RAW','Tune how High Style Match groups a shoot and see what the browser edition can do locally.')+`<div class="settings-grid"><div class="setting-card"><h2>Smart Cull performance</h2><p>Large shoots are analysed progressively and cached. Shoot-order grouping limits near-duplicate comparisons to nearby capture windows.</p><div class="field"><label>New shoot group after</label><select id="gapSetting"><option value="20" ${+st.groupGapSeconds===20?'selected':''}>20 seconds</option><option value="45" ${+st.groupGapSeconds===45?'selected':''}>45 seconds</option><option value="90" ${+st.groupGapSeconds===90?'selected':''}>90 seconds</option><option value="180" ${+st.groupGapSeconds===180?'selected':''}>3 minutes</option></select></div><div class="field section"><label>Parallel image analysis</label><select id="concurrencySetting"><option value="1" ${+st.analysisConcurrency===1?'selected':''}>1 — safest</option><option value="2" ${+st.analysisConcurrency===2?'selected':''}>2 — recommended</option><option value="3" ${+st.analysisConcurrency===3?'selected':''}>3 — faster</option><option value="4" ${+st.analysisConcurrency===4?'selected':''}>4 — powerful desktop</option></select></div></div><div class="setting-card"><h2>Local storage</h2><p>Projects and source copies live in IndexedDB on this device. Persistent storage reduces the chance of the browser clearing them automatically.</p><button class="btn primary" id="settingsPersist">${icon('save')}Request Persistent Storage</button><div id="storageStatus" class="section"></div></div><div class="setting-card"><h2>Shot-list document support</h2><p>Simple formats are parsed directly. Excel, PDF and Word readers are loaded only when you choose those formats.</p><div class="format-badges"><span>XLSX / XLS</span><span>PDF text</span><span>DOCX</span><span>CSV</span><span>TSV</span><span>TXT</span><span>MD</span><span>JSON</span></div><div class="shot-note section">Scanned image-only PDFs still require OCR before import.</div></div><div class="setting-card"><div class="desktop-cap"><span class="desktop-only-badge">PRO WORKFLOW</span><h2 style="color:#fff;margin-top:10px">RAW & desktop mode</h2><p>Browser High Style Match now attempts embedded JPEG previews from CR3, CR2, NEF, ARW, RAF, DNG, ORF and RW2 files. In-place filesystem renaming, folder watching and full RAW decoding remain native desktop capabilities because browsers intentionally restrict direct file-system control.</p></div></div></div>`;document.getElementById('gapSetting').onchange=e=>{D.settings.groupGapSeconds=+e.target.value;save();toast('Shoot-order grouping updated')};document.getElementById('concurrencySetting').onchange=e=>{D.settings.analysisConcurrency=+e.target.value;save();toast('Analysis performance updated')};document.getElementById('settingsPersist').onclick=protectStorage;updateStorageUI()}
function renderTemplates(){setTop('<span>High Style Match</span><span>›</span><b>Naming Templates</b>','<button class="btn primary" id="addTemplate">'+icon('plus')+'New Template</button>');C.innerHTML=head('File naming','Naming templates','Create reusable patterns for how photographs are named after they are matched to the shot list.')+`<div class="notice info">${icon('info')}Available variables: {client}, {shoot}, {subject}, {shotListItem}, {orientation}, {number}, {shootDate}, {originalFilename}</div><div class="template-list section">${D.templates.map(t=>`<div class="template-row"><div><strong>${esc(t.name)}</strong>${t.id===D.settings.defaultTemplate?'<span class="pill purple" style="margin-left:8px">Default</span>':''}<code>${esc(t.pattern)}</code></div><div class="actions"><button class="btn secondary small edit-template" data-id="${esc(t.id)}">${icon('edit')}Edit</button><button class="btn secondary small default-template" data-id="${esc(t.id)}">Make Default</button></div></div>`).join('')}</div>`;document.getElementById('addTemplate').onclick=()=>templateModal();document.querySelectorAll('.edit-template').forEach(b=>b.onclick=()=>templateModal(b.dataset.id));document.querySelectorAll('.default-template').forEach(b=>b.onclick=()=>{D.settings.defaultTemplate=b.dataset.id;save();renderTemplates();toast('Default template updated')})}
function templateModal(id=null){const t=id?D.templates.find(x=>x.id===id):{id:uid('tpl'),name:'New Template',pattern:'{client}_{subject}_{orientation}_{number}'};showModal(`<h3>${id?'Edit':'Create'} naming template</h3><p>Use variables to build a consistent filename. High Style Match always preserves the photograph file extension.</p><div class="field"><label>Template name</label><input id="tplName" value="${esc(t.name)}"></div><div class="field section"><label>Pattern</label><input id="tplPattern" value="${esc(t.pattern)}"></div><div class="actions section" style="justify-content:space-between"><div>${id&&D.templates.length>1?'<button class="btn danger" id="deleteTpl">Delete</button>':''}</div><div class="actions"><button class="btn secondary" data-close>Cancel</button><button class="btn primary" id="saveTpl">Save Template</button></div></div>`);document.getElementById('saveTpl').onclick=()=>{t.name=document.getElementById('tplName').value.trim()||'Template';t.pattern=document.getElementById('tplPattern').value.trim()||'{client}_{subject}_{number}';const i=D.templates.findIndex(x=>x.id===t.id);if(i<0)D.templates.push(t);else D.templates[i]=t;save();closeModal();renderTemplates();toast('Naming template saved')};const del=document.getElementById('deleteTpl');if(del)del.onclick=()=>{D.templates=D.templates.filter(x=>x.id!==t.id);if(D.settings.defaultTemplate===t.id)D.settings.defaultTemplate=D.templates[0]?.id||null;D.shoots.forEach(s=>{if(s.templateId===t.id)s.templateId=D.settings.defaultTemplate});save();closeModal();renderTemplates();toast('Template deleted')}}

function confirmDeleteShoot(s){showModal(`<h3>Delete this shoot?</h3><p>This removes the project, its local photograph copies and its matching history from this browser. Your original files elsewhere on your device are not touched.</p><div class="actions" style="justify-content:flex-end"><button class="btn secondary" data-close>Cancel</button><button class="btn danger" id="confirmDelete">${icon('trash')}Delete Shoot</button></div>`);document.getElementById('confirmDelete').onclick=async()=>{await dbDeletePrefix(`${s.id}:`);D.shoots=D.shoots.filter(x=>x.id!==s.id);D.history=D.history.filter(x=>x.shootId!==s.id);D.activity=D.activity.filter(x=>x.shootId!==s.id);save();closeModal();navigate('shoots');toast('Shoot deleted')}}
function showModal(html){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`;root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);root.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

window.addEventListener('beforeunload',()=>{for(const u of fileURLs.values())URL.revokeObjectURL(u)});
window.__HSM_TEST__={version:APP_VERSION,parseShotList,cleanName,coverage,makePreview,autoMatch,reviewSummary,hammingHash};
render();
})();
