<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>High Style Match</title><style>
:root{--a:#8d6cff;--bg:#f5f5f7;--ink:#111;--muted:#6f6f78}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:#101014;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin:0 7px 22px}.logo{width:40px;height:40px;border-radius:11px;background:var(--a);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#999}nav{display:grid;gap:6px}nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:11px;border-radius:10px}nav button:hover,nav button.on{background:#222229;color:#fff}main{padding:30px;min-width:0}h1{font-size:30px;margin:5px 0}h2{font-size:19px;margin:3px 0}p,.muted{color:var(--muted)}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--a);font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e4e4e9;border-radius:16px;padding:18px}.stat b{font-size:26px;display:block}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:750}.pri{background:var(--a);color:#fff}.sec{background:#ececf0}.field{display:grid;gap:5px}.field input,.field textarea,.field select,select{border:1px solid #d7d7dc;border-radius:10px;padding:10px;background:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #e4e4e9;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.tabs{display:flex;gap:6px;border-bottom:1px solid #ddd;margin-bottom:16px;overflow:auto}.tabs button{border:0;background:none;padding:10px;font-weight:700;color:#777}.tabs button.on{color:#111;border-bottom:2px solid var(--a)}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.photo{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.thumb{aspect-ratio:4/3;background:#24242c;color:#fff;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.meta{padding:9px;display:grid;gap:7px}.meta strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rename{display:grid;grid-template-columns:1fr 24px 1.3fr;gap:8px;align-items:center;border:1px solid #e1e1e6;background:#fff;padding:9px;border-radius:10px;margin:7px 0}.rename input{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px}.note{background:#fff5d8;border:1px solid #ecd79d;color:#6f5316;border-radius:11px;padding:11px;margin:12px 0}.ok{background:#e8f7ef;border:1px solid #b8e4cb;color:#235f3c;border-radius:11px;padding:11px}.empty{text-align:center;padding:35px;border:1px dashed #ccc;border-radius:14px}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:11px 13px;border-radius:10px;display:none}.section{margin-top:16px}@media(max-width:760px){.app{display:block}aside{height:auto;display:flex;position:sticky;z-index:9;padding:8px;align-items:center}.brand{margin:0}.brand div:last-child{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{padding:18px 12px}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="app"><aside><div class="brand"><div class="logo">///</div><div><b>High Style Match</b><small>High Style Group</small></div></div><nav id="nav"><button data-s="dash" class="on">Dashboard</button><button data-s="shoots">Shoots</button><button data-s="new">New Shoot</button><button data-s="templates">Templates</button></nav></aside><main id="main"></main></div><input id="files" type="file" multiple accept="image/*,.cr3,.cr2,.nef,.arw,.raf,.dng,.orf,.rw2" hidden><div class="toast" id="toast"></div><script>
(()=>{const K='hsmWeb2',D=JSON.parse(localStorage.getItem(K)||'null')||{shoots:[],templates:[{id:1,name:'Client · Subject · Orientation',p:'{client}_{subject}_{orientation}_{number}'},{id:2,name:'Shoot · Shot',p:'{shoot}_{shotListItem}_{number}'}],history:[]};let S='dash',ID=null,T='summary',seq=1,ss=1;const F=new Map,M=document.getElementById('main'),P=document.getElementById('files');const save=()=>localStorage.setItem(K,JSON.stringify(D));const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=x=>{let t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(toast.x);toast.x=setTimeout(()=>t.style.display='none',2800)};document.getElementById('nav').onclick=x=>{let b=x.target.closest('[data-s]');if(b){S=b.dataset.s;ID=null;render()}};P.onchange=()=>{if(ID)add([...P.files]);P.value=''};
function head(a,b,c){return `<div class="ey">${a}</div><h1>${b}</h1><p>${c}</p>`}function stats(){return{sh:D.shoots.length,ph:D.shoots.reduce((a,s)=>a+s.photos.length,0),dl:D.history.reduce((a,h)=>a+h.n,0)}}function cov(s){let c=new Map;s.photos.forEach(p=>p.shot&&c.set(p.shot,(c.get(p.shot)||0)+1));let a=s.shots.filter(x=>!x.skip);return{m:a.filter(x=>c.get(x.id)).length,total:a.length,miss:a.filter(x=>!c.get(x.id)).length,c}}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===S));if(S==='dash')dash();if(S==='shoots')shoots();if(S==='new')newShoot();if(S==='templates')templates();if(S==='work')work()}function rows(a){return a.length?`<div class="list">${a.map(s=>{let c=cov(s);return `<div class="item"><div><b>${e(s.client)}</b><div class="muted">${e(s.name)}</div></div><div>${s.photos.length} photos · ${c.m}/${c.total} matched</div><button class="btn sec open" data-id="${s.id}">Open</button></div>`}).join('')}</div>`:`<div class="empty"><h2>No shoots yet</h2><p>Create your first shoot and paste the client shot list.</p></div>`}function wire(){document.querySelectorAll('.open').forEach(b=>b.onclick=()=>{ID=+b.dataset.id;S='work';T='summary';render()})}
function dash(){let q=stats();M.innerHTML=head('High Style Group','High Style Match','Turn your shot list into an organised, intelligently renamed shoot.')+`<div class="grid section"><div class="card stat"><b>${q.sh}</b><span>Shoots</span></div><div class="card stat"><b>${q.ph}</b><span>Photos</span></div><div class="card stat"><b>${q.dl}</b><span>Renamed downloads</span></div><div class="card stat"><b>Local</b><span>Browser processing</span></div></div><div class="panel section"><div class="row" style="justify-content:space-between"><h2>Recent shoots</h2><button class="btn pri" id="n">+ New Shoot</button></div>${rows(D.shoots.slice(0,5))}</div><div class="note">Web version: your photos stay on your device. High Style Match downloads renamed copies and never overwrites the originals.</div>`;document.getElementById('n').onclick=()=>{S='new';render()};wire()}function shoots(){M.innerHTML=head('Projects','Shoots','Your browser projects are stored locally on this device.')+`<div class="row section"><button class="btn pri" id="n">+ New Shoot</button></div>${rows(D.shoots)}`;document.getElementById('n').onclick=()=>{S='new';render()};wire()}
function parse(t){let out=[],sub='';t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>{let m=l.match(/^(.+?)\s*[—–-]\s*(Landscape|Portrait|Overhead|Detail|Square|Wide)$i),if(!m&&l.includes(',')){let z=l.split(',');if(z[0]&&z[1])m=[l,z[0].trim(),z[1].trim()]}if(m){out.push({id:ss++,subject:m[1],variant:m[2],skip:false});sub=m[1]}else if(/^(Landscape|Portrait|Overhead|Detail|Square|Wide)$/i.test(l)&&sub)out.push({id:ss++,subject:sub,variant:l,skip:false});else sub=l});return out}function newShoot(){M.innerHTML=head('Create project','New Shoot','Add the job details and paste the client shot list.')+`<div class="panel section"><div class="form"><div class="field"><label>Client</label><input id="c"></div><div class="field"><label>Shoot name</label><input id="n"></div><div class="field"><label>Date</label><input id="d" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Location</label><input id="l"></div><div class="field full"><label>Shot list</label><textarea id="sl" rows="10" placeholder="Burger — Landscape\nBurger — Portrait\nCarbonara — Overhead"></textarea></div></div><div class="row section"><button class="btn pri" id="create">Create Shoot</button><button class="btn sec" id="sample">Load Sample</button></div></div>`;document.getElementById('sample').onclick=()=>{document.getElementById('c').value='Cancello Restaurant';document.getElementById('n').value='Autumn Menu Shoot';document.getElementById('l').value='Manchester';document.getElementById('sl').value='Burger — Landscape\nBurger — Portrait\nBurger — Detail\nCarbonara — Landscape\nCarbonara — Overhead\nAperol Spritz — Portrait'};document.getElementById('create').onclick=()=>{let c=document.getElementById('c').value.trim(),n=document.getElementById('n').value.trim();if(!c||!n)return toast('Add a client and shoot name.');let s={id:Date.now(),client:c,name:n,date:document.getElementById('d').value,location:document.getElementById('l').value,shots:parse(document.getElementById('sl').value),photos:[],tpl:1};D.shoots.unshift(s);save();ID=s.id;S='work';render()}}
function templates(){M.innerHTML=head('Filenames','Naming Templates','Create reusable filename patterns.')+`<div class="panel section"><div class="note">Variables: {client} {shoot} {subject} {shotListItem} {orientation} {number} {shootDate} {originalFilename}</div><div class="list">${D.templates.map(t=>`<div class="item"><div><b>${e(t.name)}</b><div class="muted">${e(t.p)}</div></div><button class="btn sec edit" data-id="${t.id}">Edit</button></div>`).join('')}</div><button class="btn prisection" id="add">+ Add Template</button></div>`;document.getElementById('add').onclick=()=>editTpl();document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editTpl(+b.dataset.id))}function editTpl(id){let t=D.templates.find(x=>x.id===id)||{id:Date.now(),name:'New Template',p:'{client}_{subject}_{ori}_{number}'};M.innerHTML=head('Template','Edit naming template','Control exactly how files will be named.')+`<div class="panel section"><div class="field"><label>Name</label><input id="tn" value="${e(t.name)}"></div><div class="field section"><label>Pattern</label><input id="tp" value="${e(t.p)}"></div><div class="row section"><button class="btn prisection" id="sv">Save</button><button class="btn sec" id="cx">Cancel</button></div></div>`;document.getElementById('cx').onclick=()=>{S='templates';render()};document.getElementById('sv').onclick=()=>{t.name=document.getElementById('tn').value;t.p=document.getElementById('tp').value;let i=D.templates.findIndex(x=>x.id===t.id);i<0?D.templates.push(t):D.templates[i]=t;save();S='templates';render()}}
function work(){let s=D.shoots.find(x=>x.id===ID);if(!s){S='shoots';return render()}let c=cov(s);M.innerHTML=head(e(s.client),e(s.name),`${e(s.date)}${s.location?' · '+e(s.location):''}`)+`<div class="tabs"><button data-t="summary" class="${T==='summary'?'on':''}">Summary</button><button data-t="shots" class="${T==='shots'?'on':''}">Shot List</button><button data-t="photos" class="${T==='photos'?'on':''}">Photographs</button><button data-t="rename" class="${T==='rename'?'on':''}">Rename</button><button data-t="history" class="${T==='history'?'on':''}">History</button></div><div id="w"></div>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{T=b.dataset.t;work()});tab(s,c)}
function tab(s,c){let w=document.getElementById('w');if(T==='summary'){w.innerHTML=`<div class="grid"><div class="card stat"><b>${s.shots.length}</b><span>Requirements</span></div><div class="card stat"><b>${s.photos.length}</b><span>Photos</span></div><div class="card stat"><b>${c.m}</b><span>Matched</span></div><div class="card stat"><b>${c.miss}</b><span>Missing</span></div></div><div class="panel section"><h2>Add photographs</h2><p>Select JPG, PNG, HEIC or RAW files. Files remain on your device.</p><button class="btn prisection" id="pick">Select Photographs</button></div>${c.miss?`<div class="note">${c.miss} shot requirement${c.miss===1?'':'s'} still need a photograph.</div>`:`<div class="ok section">Shot list covered.</div>`}`;document.getElementById('pick').onclick=()=>P.click()}if(T==='shots'){w.innerHTML=`<div class="list">${s.shots.map(x=>`<div class="item"><div><b>${e(x.subject)}</b><div class="muted">${e(x.variant)}</div></div><div>${c.c.get(x.id)||0} photos</div></div>`).join('')}</div>`}if(T==='photos'){w.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Photographs</h2><button class="btn prisection" id="pick">+ Files</button></div>${s.photos.length?`<div class="photos section">${s.photos.map(p=>`<div class="photo"><div class="thumb">${p.url?`<img src="${p.url}">`:e(p.ext)}</div><div class="meta"><strong>${e(p.name)}</strong><span class="muted">${e(p.ori)}</span><select class="as" data-id="${p.id}"><option value="">Unassigned</option>${s.shots.map(x=>`<option value="${x.id}" ${p.shot===x.id?'selected':''}>${e(x.subject)} — ${e(x.variant)}</option>`).join('')}</select></div></div>`).join('')}</div>`:`<div class="empty section">No photographs added yet.</div>`}`;document.getElementById('pick').onclick=()=>P.click();document.querySelectorAll('.as').forEach(q=>q.onchange=()=>{s.photos.find(p=>p.id===+q.dataset.id).shot=q.value?+q.value:null;save();work()})}if(T==='rename'){let a=preview(s),tpl=D.templates.find(x=>x.id===s.tpl)||D.templates[0];w.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>Rename Preview</h2><p>Downloads renamed copies; originals stay untouched.</p></div><select id="tpl">${D.templates.map(x=>`<option value="${x.id}" ${x.id===tpl.id?'selected':''}>${e(x.name)}</option>`).join('')}</select></div><div class="note">For browser safety, High Style Match Web does not rename source files in place.</div>${a.map((r,i)=>`<div class="rename"><span>${e(r.old)}</span><span>→</span><input class="rn" data-i="${i}" value="${e(r.name)}"></div>`).join('')}<div class="row section"><button class="btn pri" id="dl" ${a.length?'':'disabled'}>Download Renamed Copies</button><button class="btn sec" id="copy" ${a.length?'':'disabled'}>Copy Filename List</button></div>`;document.getElementById('tpl').onchange=x=>{s.tpl=+x.target.value;save();work()};document.querySelectorAll('.rn').forEach(x=>x.oninput=()=>a[+x.dataset.i].name=withExt(x.value,a[+x.dataset.i].old));document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(a.map(x=>x.name).join('\n')).then(()=>toast('Filename list copied'));document.getElementById('dl').onclick=()=>download(s,a)}if(T==='history'){let h=D.history.filter(x=>x.id===s.id);w.innerHTML=h.length?`<div class="list">${h.map(x=>`<div class="item"><div><b>${x.n} renamed copies</b><div class="muted">${new Date(x.at).toLocaleString()}</div></div><div>${e(x.tpl)}</div></div>`).join('')}</div>`:`<div class="empty">No rename downloads yet.</div>`}}
async function add(fs){let s=D.shoots.find(x=>x.id===ID);for(let f of fs){if(!/\.(jpe?g|png|webp|heic|cr3|cr2|nef|arw|raf|dng|orf|rw2)$/i.test(f.name))continue;let id=Date.now()+seq++,key=ID+':'+id,ext=(f.name.split('.').pop()||'').toUpperCase(),p={id,name:f.name,ext,shot:null,ori:'Unknown',key,url:null};F.set(key,f);if(f.type.startsWith('image/')&&!/heic/i.test(f.type)){p.url=URL.createObjectURL(f);try{let m=await meta(p.url);p.ori=m.w===m.h?'Square':m.w>m.h?'Landscape':'Portrait'}catch{}}s.photos.push(p)}save();T='photos';work();toast('Photographs added locally')}function meta(u){return new Promise((r,j)=>{let i=new Image;i.onload=()=>r({w:i.naturalWidth,h:i.naturalHeight});i.onerror=j;i.src=u})}function clean(v){return v.normalize('NFKC').replace(/[<>:"/\\|?*\x00-\x1F
