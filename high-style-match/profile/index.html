<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Account — High Style Match</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding:26px}.wrap{width:min(760px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:42px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:78px;height:40px;object-fit:contain}.back{color:#aaa;text-decoration:none;font-size:11px}.card{border:1px solid #292929;background:#0b0b0b;padding:24px;margin-bottom:12px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#888;font-weight:800}h1{font-size:34px;letter-spacing:-.045em;margin:8px 0 6px}.muted{color:#929292;font-size:12px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.stat{border-top:1px solid #262626;padding-top:12px}.stat span{display:block;color:#777;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.stat b{display:block;margin-top:5px;font-size:13px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:11px;font-weight:760}.field input{background:#050505;border:1px solid #333;color:#fff;padding:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:40px;padding:0 13px;border-radius:3px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000;border:1px solid #fff}.secondary{background:#111;color:#fff;border:1px solid #333}.status{display:none;margin-top:12px;padding:10px;border:1px solid #333;background:#101010;font-size:11px;color:#ccc}.status.on{display:block}@media(max-width:580px){body{padding:18px 13px}.grid{grid-template-columns:1fr}.card{padding:18px}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><img src="/high-style-logo.svg" alt="High Style Match"><b>Account</b></div><a class="back" id="home" href="../">Back to workspace</a></header><section class="card"><div class="eyebrow">Signed-in account</div><h1 id="nameTitle">Your account</h1><p class="muted">Your account type controls which High Style Match workspace and project data you can access.</p><div class="grid"><div class="stat"><span>Email</span><b id="email">—</b></div><div class="stat"><span>Account type</span><b id="role">—</b></div></div></section><section class="card"><div class="eyebrow">Profile</div><div class="field"><label for="displayName">Display name / studio</label><input id="displayName"></div><div class="actions"><button class="btn primary" id="save">Save name</button><button class="btn secondary" id="reset">Send password reset</button><button class="btn secondary" id="signout">Sign out</button></div><div id="status" class="status"></div></section></div><script src="../auth-config.js"></script><script src="../auth-router.js"></script><script>
(async()=>{const show=m=>{status.textContent=m;status.className='status on'};try{if(!HSMAuthRouter.configured())throw new Error('Secure accounts are not connected yet.');const ctx=await HSMAuthRouter.context();if(!ctx){location.replace('../sign-in/');return}const p=ctx.profile;email.textContent=p.email||ctx.session.user.email||'—';role.textContent=(p.role||'customer').replace(/^./,c=>c.toUpperCase());displayName.value=p.display_name||'';nameTitle.textContent=p.display_name||'Your account';home.href=ctx.home;save.onclick=async()=>{try{const sb=await HSMAuthRouter.getClient();const {data,error}=await sb.from('profiles').update({display_name:displayName.value.trim()||null}).eq('id',ctx.session.user.id).select().single();if(error)throw error;nameTitle.textContent=data.display_name||'Your account';show('Profile updated.')}catch(e){show(e.message)}};reset.onclick=async()=>{try{const sb=await HSMAuthRouter.getClient();const {error}=await sb.auth.resetPasswordForEmail(ctx.session.user.email,{redirectTo:new URL('../sign-in/?reset=1',location.href).href});if(error)throw error;show('Password reset email sent.')}catch(e){show(e.message)}};signout.onclick=async()=>{await HSMAuthRouter.signOut();location.replace('../sign-in/')}}catch(e){show(e.message)}})();
</script><script src="../site-compliance.js?v=20260908-1"></script></body></html>
