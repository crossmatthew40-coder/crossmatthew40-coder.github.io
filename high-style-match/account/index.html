<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Photographer Sign In — High Style Match</title><script src="../auth-config.js"></script><script src="../app-config.js"></script><script src="../cloud.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.shell{width:min(480px,100%);border:1px solid #292929;background:#0b0b0b;border-radius:18px;padding:28px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:34px}.mark{width:38px;height:38px;border:1px solid #fff;border-radius:10px;display:grid;place-items:center}.mark i{width:18px;height:4px;background:#fff;border-radius:99px;box-shadow:0 -7px #fff,0 7px #fff;transform:skewX(-22deg)}small,.muted{color:#999}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#aaa;font-weight:850}h1{font-size:32px;letter-spacing:-.045em;margin:8px 0 8px}p{color:#aaa;line-height:1.55;font-size:13px;margin:0 0 24px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:750}.field input{width:100%;border:1px solid #333;background:#050505;color:#fff;border-radius:10px;padding:12px 13px;outline:none}.field input:focus{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.15)}button{font:inherit;cursor:pointer}.primary,.secondary{width:100%;min-height:44px;border-radius:10px;font-weight:800}.primary{background:#fff;color:#000;border:1px solid #fff}.secondary{margin-top:10px;background:#111;color:#fff;border:1px solid #333}.status{display:none;margin-top:14px;border:1px solid #333;background:#101010;color:#ddd;border-radius:10px;padding:11px 12px;font-size:11px;line-height:1.5}.status.on{display:block}.links{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:11px}.links a{color:#aaa;text-decoration:none}.links a:hover{color:#fff}</style></head><body><main class="shell"><div class="brand"><div class="mark"><i></i></div><div><b>High Style Match</b><small>Photographer Workspace</small></div></div><div class="eyebrow">Account</div><h1>Sign in.</h1><p>Use your photographer account to sync projects, invite customers and use the admin-ready cloud workflow.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">Sign in</button></form><button class="secondary" id="magic" type="button">Email me a sign-in link</button><div class="status" id="status"></div><div class="links"><a href="../">← Use local app</a><a href="../onboarding/">Setup</a></div></main><script>(()=>{const status=document.getElementById('status');const show=(m)=>{status.textContent=m;status.classList.add('on')};async function sb(){if(!window.HSMCloud.configured())throw new Error('Cloud accounts are not connected yet. Add your Supabase Project URL and public anon key in auth-config.js.');return window.HSMCloud.getClient()}window.HSMCloud.getSession().then(s=>{if(s)location.href='../'}).catch(()=>{});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();try{const c=await sb();const {error}=await c.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;location.href='../'}catch(err){show(err.message)}});document.getElementById('magic').onclick=async()=>{try{if(!email.value.trim())throw new Error('Enter your email address first.');const c=await sb();const {error}=await c.auth.signInWithOtp({email:email.value.trim(),options:{emailRedirectTo:new URL('../',location.href).href}});if(error)throw error;show('Sign-in link sent. Check your email.')}catch(err){show(err.message)}}})();</script></body></html>
