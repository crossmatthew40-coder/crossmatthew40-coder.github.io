<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#08090b">
<title>Opening Live Shoot — High Style Match</title>
<style>
html,body{margin:0;min-height:100%;background:#08090b;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{display:grid;place-items:center}.card{width:min(520px,calc(100% - 36px));border:1px solid #292c33;border-radius:20px;background:#111317;padding:28px;text-align:center}.mark{width:48px;height:48px;margin:0 auto 18px;border-radius:13px;background:#8d6cff;display:grid;place-items:center}.mark i{width:22px;height:4px;background:#fff;transform:skewX(-23deg);border-radius:4px;box-shadow:0 -7px #fff,0 7px #fff}h1{font-size:25px;letter-spacing:-.035em;margin:0 0 7px}p{margin:0;color:#979ca6;line-height:1.55;font-size:13px}a{display:inline-flex;margin-top:18px;text-decoration:none;background:#8d6cff;color:#fff;font-weight:800;border-radius:10px;padding:11px 14px}
</style>
</head>
<body>
<div class="card"><div class="mark"><i></i></div><h1>Opening High Style Match Live</h1><p>Tether Mode now uses the new Capture One Companion bridge.</p><a id="continue" href="../live-shoot/">Open Live Shoot</a></div>
<script>
(function(){
  const target='../live-shoot/'+location.search+location.hash;
  document.getElementById('continue').href=target;
  location.replace(target);
})();
</script>
</body>
</html>
