<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Project Review — High Style Match</title><script src="../../auth-config.js"></script><script src="../../app-config.js"></script><script src="../../cloud.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding:18px}.wrap{max-width:1200px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:6px 0 24px}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border:1px solid #fff;border-radius:10px;display:grid;place-items:center}.mark i{width:18px;height:4px;background:#fff;border-radius:99px;box-shadow:0 -7px #fff,0 7px #fff;transform:skewX(-22deg)}a{color:#aaa;text-decoration:none;font-size:12px}.head{border:1px solid #292929;background:#080808;border-radius:16px;padding:22px;margin-bottom:12px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#999;font-weight:850}.head h1{font-size:30px;letter-spacing:-.045em;margin:7px 0 5px}.head p{color:#999;font-size:12px;margin:0}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{border:1px solid #333;background:#111;border-radius:999px;padding:6px 9px;color:#ddd;font-size:10px;font-weight:750}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.photo{border:1px solid #292929;background:#0b0b0b;border-radius:13px;overflow:hidden}.image{aspect-ratio:4/3;background:#080808;display:grid;place-items:center;color:#666;font-size:11px}.image img{width:100%;height:100%;object-fit:cover;display:block}.meta{padding:11px}.meta strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;color:#777;margin-top:4px}.review{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.review button{border:1px solid #333;background:#111;color:#fff;border-radius:8px;padding:8px 6px;font-size:10px;font-weight:750;cursor:pointer}.review button:hover,.review button.on{background:#fff;color:#000;border-color:#fff}.comment{margin-top:7px;display:flex;gap:6px}.comment input{min-width:0;flex:1;background:#050505;border:1px solid #333;color:#fff;border-radius:8px;padding:8px 9px;font-size:10px;outline:none}.comment button{border:1px solid #333;background:#111;color:#fff;border-radius:8px;padding:8px 10px;font-size:10px;font-weight:750;cursor:pointer}.section{margin-top:12px;border:1px solid #292929;background:#0b0b0b;border-radius:13px;padding:16px}.section h2{font-size:16px;margin:0 0 10px}.delivery{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #222}.delivery:first-of-type{border-top:0}.delivery strong{font-size:12px}.delivery small{display:block;color:#777;margin-top:3px}.delivery button{border:1px solid #fff;background:#fff;color:#000;border-radius:8px;padding:8px 10px;font-size:10px;font-weight:800;cursor:pointer}.status{padding:18px;border:1px solid #292929;background:#0b0b0b;border-radius:13px;color:#aaa;font-size:12px;line-height:1.5}@media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){body{padding:11px}.gallery{grid-template-columns:1fr}.head{padding:17px}.head h1{font-size:26px}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="mark"><i></i></div><div><b>High Style Match</b><div style="font-size:10px;color:#777">Customer Review</div></div></div><a href="../">← My projects</a></div><div id="app" class="status">Loading project…</div></div><script>(async()=>{const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id')||new URLSearchParams(location.search).get('project');const esc=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));if(!id){app.textContent='No project was selected.';return}if(!HSMCloud.configured()){app.textContent='Customer cloud access is not connected yet.';return}try{const session=await HSMCloud.getSession();if(!session){location.href=`../../sign-in/?returnTo=${encodeURIComponent(location.pathname+location.search)}`;return}const [project,photos,reviews,deliveries]=await Promise.all([HSMCloud.getProject(id),HSMCloud.listPhotos(id),HSMCloud.listReviews(id),HSMCloud.listDeliveries(id)]);const latest=new Map();for(const r of reviews){if(r.photo_id&&!latest.has(r.photo_id)&&['approve','favourite','change'].includes(r.decision))latest.set(r.photo_id,r.decision)}const cards=[];for(const p of photos){let url='';try{url=await HSMCloud.signedPreviewUrl(p.preview_path)}catch{}const state=latest.get(p.id)||'';cards.push(`<article class="photo" data-photo="${p.id}"><div class="image">${url?`<img src="${url}" alt="${esc(p.original_filename)}">`:'Preview unavailable'}</div><div class="meta"><strong>${esc(p.original_filename)}</strong><small>${esc(p.orientation||'')} ${p.capture_at?'· '+new Date(p.capture_at).toLocaleString():''}</small><div class="review"><button data-decision="favourite" class="${state==='favourite'?'on':''}">Favourite</button><button data-decision="approve" class="${state==='approve'?'on':''}">Approve</button><button data-decision="change" class="${state==='change'?'on':''}">Change</button></div><div class="comment"><input placeholder="Add a comment"><button data-comment>Send</button></div></div></article>`)}app.className='';app.innerHTML=`<section class="head"><div class="eyebrow">${esc(project.client_name||'Client project')}</div><h1>${esc(project.name)}</h1><p>${project.shoot_date?new Date(project.shoot_date+'T12:00:00').toLocaleDateString():''}</p><div class="summary"><span class="pill">${photos.length} photos</span><span class="pill">${esc(project.status)}</span><span class="pill">${reviews.length} review actions</span></div></section><section class="gallery">${cards.join('')||'<div class="status">No review photographs have been shared yet.</div>'}</section><section class="section"><h2>Delivery</h2><div id="deliveries">${deliveries.map(d=>`<div class="delivery"><div><strong>${esc(d.provider)} · v${esc(d.version||'1')}</strong><small>${d.delivered_at?new Date(d.delivered_at).toLocaleString():'Ready'}${d.expires_at?' · expires '+new Date(d.expires_at).toLocaleDateString():''}</small></div>${d.delivery_url?`<button data-delivery="${d.id}">Open delivery</button>`:''}</div>`).join('')||'<div style="color:#777;font-size:11px">No delivery available yet.</div>'}</div></section>`;app.addEventListener('click',async e=>{const btn=e.target.closest('button');if(!btn)return;const card=btn.closest('[data-photo]');try{if(btn.dataset.decision&&card){await HSMCloud.saveReview({projectId:id,photoId:card.dataset.photo,decision:btn.dataset.decision});card.querySelectorAll('[data-decision]').forEach(x=>x.classList.toggle('on',x===btn));return}if(btn.hasAttribute('data-comment')&&card){const input=card.querySelector('input');if(!input.value.trim())return;await HSMCloud.saveReview({projectId:id,photoId:card.dataset.photo,decision:'comment',comment:input.value.trim()});input.value='';btn.textContent='Sent';setTimeout(()=>btn.textContent='Send',1200);return}if(btn.dataset.delivery){const result=await HSMCloud.invokeFunction('delivery-open',{deliveryId:btn.dataset.delivery});if(result?.url)window.open(result.url,'_blank','noopener')}}catch(err){alert(err.message)}})}catch(e){app.textContent=e.message}})();</script></body></html>
